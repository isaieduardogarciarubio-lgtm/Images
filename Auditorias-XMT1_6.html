    // No se encontró en ninguno de los dos índices: se trata igual como
    // "fuera de catálogo", usando el código escaneado tal cual.
    if (ScanParser.ID_PATTERN.test(raw) || AuditoriaHVSession.RETURN_QR_PATTERN.test(raw)) {
      return { row: null, code: raw };
    }
    return null;
  }

  handleScan(rawText) {
    if (this.locked) return;
    const resolved = this.resolveScan(rawText);
    if (!resolved) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      return;
    }
    // Dedup: un On_Hold ya confirmado hoy (rama fuera de catálogo) no se
    // vuelve a preguntar — un match en catálogo sí puede repetirse.
    if (!resolved.row && this.onHoldCaptured.has(resolved.code.toUpperCase())) {
      this.vibrate([40, 60, 40]);
      this.flash('error', `${resolved.code} ya se capturó como On_Hold anteriormente.`);
      return;
    }
    this.locked = true;
    this.stopScanner();
    if (resolved.row) {
      this.renderFound(resolved.row);
    } else {
      this.renderNotFound(resolved.code);
    }
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (this.flashEl) {
      const cls = kind === 'ok' ? 'active-ok' : (kind === 'error' ? 'active-error' : '');
      if (cls) {
        this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
        this.flashEl.classList.add(cls);
        setTimeout(() => {
          if (this.flashEl) {
            this.flashEl.classList.remove(cls);
            this.flashEl.innerHTML = '';
          }
        }, 550);
      }
    }
    setTimeout(() => {
      if (!this.supportEl) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = this.inManualMode
        ? 'Escribe el código y presiona Enter.'
        : (this.loopHint || 'Escaneando... apunta la cámara al shipment o al QR de retorno.');
    }, 900);
  }

   * saveNotFound: descripción se guarda como literal "(fuera de catálogo)"
   * — decisión de producto ante la ambigüedad del spec (el flujo no pide
   * descripción libre en esta rama).
   */
  async saveNotFound(code, caso, foto) {
    this.flash('ok', `${code} · ${caso}`);
    this.locked = false;
    // Marca el código como capturado ANTES del await: si se escanea de
    // nuevo mientras la sincronización todavía está en curso, el guard de
    // handleScan ya lo bloquea sin depender de que el registro haya
    // terminado de sincronizarse.
    this.onHoldCaptured.add(code.toUpperCase());
    if (this.onScan) {
      await this.onScan({
        shipment_id: code,

        caso,
        foto,

    this.count += 1;
    this.renderLoop();

  /* ====================================================================== */
  /* Cámara — mismo patrón visual que FormEngine.enterPhotoCapture          */
  /* ====================================================================== */

  async enterPhotoCapture({ onCaptured }) {
    this.stopPhotoCamera();
    this.supportEl.textContent = 'Encuadra y toma la foto con la cámara de la app.';
    this.supportEl.classList.remove('error');

    this.photoBody.innerHTML = `
      <div class="scanner-viewport">
        <video class="scanner-video" playsinline muted></video>
      </div>
    `;

    if (!PhotoCamera.isSupported()) {
      this.photoCameraUnavailable({ onCaptured });
      return;
    }

    const video = this.photoBody.querySelector('.scanner-video');
    this.photoCamera = new PhotoCamera();
    try {
      await this.photoCamera.start(video);
    } catch (e) {
      this.photoCameraUnavailable({ onCaptured });
      return;
    }

    if (this.photoCamera.hasTorch()) {
      const viewport = this.photoBody.querySelector('.scanner-viewport');
      const torchBtn = document.createElement('button');
      torchBtn.type = 'button';
      torchBtn.className = 'scanner-torch';
      torchBtn.setAttribute('aria-label', 'Linterna');
      torchBtn.innerHTML = Icons.svg('flash', { size: 20 });
      let on = false;
      torchBtn.addEventListener('click', async () => {
        on = !on;
        const ok = await this.photoCamera.setTorch(on);
        torchBtn.classList.toggle('active', ok && on);
      });
      viewport.appendChild(torchBtn);
    }

    const shutter = document.createElement('button');
    shutter.type = 'button';
    shutter.className = 'photo-cam-shutter';
    shutter.innerHTML = `${Icons.svg('camera', { size: 20 })}<span>Tomar foto</span>`;
    shutter.addEventListener('click', () => {
      const data = this.photoCamera && this.photoCamera.capture({ maxDim: 1280, quality: 0.6 });
      if (!data) {
        this.supportEl.textContent = 'No se pudo capturar. Intenta de nuevo.';
        this.supportEl.classList.add('error');
        return;
      }
      this.vibrate(30);
      this.stopPhotoCamera();
      this.enterPhotoPreview(data, { onCaptured });
    });
    this.photoBody.appendChild(shutter);
  }

  photoCameraUnavailable({ onCaptured }) {
    this.stopPhotoCamera();
    this.photoBody.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${Icons.svg('alertCircle', { size: 48 })}</div>
        <p style="font-size: 1rem; margin-bottom: 16px;">Cámara no disponible</p>
        <p style="font-size: 0.9rem; color: var(--color-text-muted);">No se pudo abrir la cámara de la app. Verifica el permiso de cámara e intenta de nuevo.</p>
      </div>
    `;
    this.supportEl.textContent = 'Cámara no disponible';
    this.supportEl.classList.add('error');

    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.className = 'btn btn-primary btn-block';
    retryBtn.innerHTML = `${Icons.svg('refresh', { size: 16 })}<span>Reintentar</span>`;
    retryBtn.addEventListener('click', () => this.enterPhotoCapture({ onCaptured }));
    this.photoBody.appendChild(retryBtn);
  }

  enterPhotoPreview(dataUrl, { onCaptured }) {
    this.supportEl.textContent = '';
    this.supportEl.classList.remove('error');

    this.photoBody.innerHTML = `
      <div class="photo-preview">
        <img alt="Foto capturada" />
        <div class="photo-preview-badge">${Icons.svg('checkCircle', { size: 20 })}</div>
      </div>
    `;
    this.photoBody.querySelector('img').src = dataUrl;

    const retakeBtn = document.createElement('button');
    retakeBtn.type = 'button';
    retakeBtn.className = 'btn btn-secondary btn-block';
    retakeBtn.style.margin = '8px 0';
    retakeBtn.innerHTML = `${Icons.svg('refresh', { size: 16 })}<span>Retomar</span>`;
    retakeBtn.addEventListener('click', () => this.enterPhotoCapture({ onCaptured }));

    const confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'btn btn-primary btn-block';
    confirmBtn.innerHTML = `${Icons.svg('check', { size: 16 })}<span>Confirmar foto</span>`;
    confirmBtn.addEventListener('click', () => onCaptured(dataUrl));

    this.photoBody.appendChild(retakeBtn);
    this.photoBody.appendChild(confirmBtn);
  }
}

/**
 * RegistroShipmentsSession — log temporal y simple: escaneo rápido de
 * shipments (sin catálogo, sin validación contra ninguna fuente externa),
 * con una nota de texto libre opcional antes de guardar. Un shipment ya
 * registrado (en cualquier sesión, cualquier día — ver CapturaApp.
 * loadRecentRegistroShipments, dedup permanente) no se puede volver a
 * registrar.
 */
class RegistroShipmentsSession {
  constructor(opts = {}) {
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.registered = new Set(opts.registered || []);

    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.inManualMode = false;
    this.count = 0;
  }

  render(containerId) {
    this.container = document.getElementById(containerId);
    this.renderLoop();
  }

  destroy() {
    this.stopScanner();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /* ====================================================================== */
  /* Loop de escaneo                                                       */
  /* ====================================================================== */

  renderLoop() {
    this.stopScanner();
    this.locked = false;
    this.inManualMode = false;
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera ? 'Escaneando... apunta la cámara al shipment.' : '';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Registro de Shipment's</div>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el Shipment</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
        <div class="session-counter">${this.count} registrados en esta sesión</div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.counterEl = this.container.querySelector('.session-counter');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startCamera();
    } else {
      // Hidden HID input — mismo patrón "escaneo sin teclado" que
      // Barredura/Premissort/Auditoría HV.
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        hidInput.value = '';
        lastCodeEl.textContent = raw;
        lastCodeEl.className = 'hh-last-code visible';
        this.handleScan(raw);
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Shipment ID</p>
          <input type="text" class="hh-manual-input" placeholder="Shipment ID" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.handleScan(val);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  async startCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  enterManualEntry() {
    if (this.scanner) this.scanner.pause();
    this.inManualMode = true;

    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el Shipment ID" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el código y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      this.handleScan(val);
      input.value = '';
    });

    setTimeout(() => input.focus(), 60);
  }

  /** Extrae y valida el shipment escaneado — mismo patrón numérico que ScanParser.ID_PATTERN. */
  resolveScan(rawText) {
    const extracted = ScanParser.extract(rawText);
    const raw = extracted ? extracted.value : String(rawText || '').trim();
    if (!raw || !ScanParser.ID_PATTERN.test(raw)) return null;
    return raw;
  }

  handleScan(rawText) {
    if (this.locked) return;
    const shipmentId = this.resolveScan(rawText);
    if (!shipmentId) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      return;
    }
    // Dedup permanente: un shipment ya registrado no se vuelve a preguntar.
    if (this.registered.has(shipmentId)) {
      this.vibrate([40, 60, 40]);
      this.flash('error', `${shipmentId} ya fue registrado antes.`);
      return;
    }
    this.locked = true;
    this.stopScanner();
    this.renderConfirm(shipmentId);
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (this.flashEl) {
      const cls = kind === 'ok' ? 'active-ok' : (kind === 'error' ? 'active-error' : '');
      if (cls) {
        this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
        this.flashEl.classList.add(cls);
        setTimeout(() => {
          if (this.flashEl) {
            this.flashEl.classList.remove(cls);
            this.flashEl.innerHTML = '';
          }
        }, 550);
      }
    }
    setTimeout(() => {
      if (!this.supportEl) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = this.inManualMode
        ? 'Escribe el Shipment ID y presiona Enter.'
        : (this.loopHint || 'Escaneando... apunta la cámara al shipment.');
    }, 900);
  }

  /* ====================================================================== */
  /* Confirmación: nota opcional antes de guardar                          */
  /* ====================================================================== */

  renderConfirm(shipmentId) {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Registro de Shipment's</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${shipmentId}</div>
        </div>
        <h1 class="step-question">¿Alguna nota? (opcional)</h1>
        <div class="step-input-wrap">
          <textarea class="step-input session-nota-input" rows="3" placeholder="Escribe una nota si aplica..."></textarea>
        </div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    const notaInput = this.container.querySelector('.session-nota-input');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'btn btn-primary btn-block';
    saveBtn.style.margin = '12px 0';
    saveBtn.innerHTML = `${Icons.svg('check', { size: 16 })}<span>Guardar</span>`;
    saveBtn.addEventListener('click', () => this.save(shipmentId, notaInput.value.trim()));
    this.container.querySelector('.step-screen').appendChild(saveBtn);

    // Enter guarda directo (sin Shift) — mismo espíritu "rápido" del resto
    // de la app; la nota sí puede abrir el teclado en pantalla si el
    // operador decide usarla (a diferencia del HID de escaneo).
    notaInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        this.save(shipmentId, notaInput.value.trim());
      }
    });
    setTimeout(() => notaInput.focus(), 60);
  }

  async save(shipmentId, nota) {
    if (this.saving) return;
    this.saving = true;
    try {
      this.registered.add(shipmentId);
      this.flash('ok', `${shipmentId} · Registrado`);
      if (this.onScan) {
        await this.onScan({ shipment_id: shipmentId, nota });
      }
      this.count += 1;
      this.locked = false;
      this.renderLoop();
    } finally {
      this.saving = false;
    }
  }
}

class DebugConsole {
  static entries = [];
  static maxEntries = 300;

  // Persistencia remota de warn/error, a petición del usuario (botón
  // "Guardar en servidor" dentro de la consola): la consola local se
  // pierde al cerrar el dispositivo, así que sin este botón un error de
  // sync en campo nunca llega al equipo de auditoría a menos que alguien
  // mire la pantalla en ese momento. attachRemote() conecta esta clase a
  // un GridClient para poder subir los warn/error actuales a un bucket
  // compartido (error_logs), visible solo desde el consolidado. No se
  // sube nada automáticamente en cada log — solo cuando el usuario lo pide.
  static remoteClient = null;
  static remoteApp = '';
  static getRemoteUsuario = () => '';

  static attachRemote(gridClient, appTag, getUsuario) {
    this.remoteClient = gridClient;
    this.remoteApp = appTag;
    this.getRemoteUsuario = getUsuario || (() => '');
  }

  static log(message, level = 'info') {
    const ts = new Date().toISOString().split('T')[1].slice(0, 8);
    this.entries.push({ ts, fullTs: new Date().toISOString(), level, message: String(message) });
    if (this.entries.length > this.maxEntries) this.entries.shift();
    this.render();
    if (level === 'error') console.error(message);
    else if (level === 'warn') console.warn(message);
    else console.log(message);
  }

  /**
   * Botón "Guardar en servidor" de la consola: sube los warn/error
   * actuales de este dispositivo al bucket compartido error_logs, con el
   * mismo reintento por conflicto que el resto de la app.
   */
  static async saveToServer() {
    if (!this.remoteClient) {
      this.log('No se pudo guardar: sin conexión con el servidor todavía', 'error');
      return;
    }
    const toSave = this.entries
      .filter((e) => e.level === 'error' || e.level === 'warn')
      .map((e) => ({
        ts: e.fullTs || new Date().toISOString(),
        level: e.level,
        message: e.message,
        usuario: this.getRemoteUsuario() || '',
        app: this.remoteApp,
      }));
    if (toSave.length === 0) {
      this.log('No hay errores ni warnings que guardar', 'info');
      return;
    }
    for (let attempt = 0; attempt < 3; attempt++) {
      const bucket = await this.remoteClient.getStateBucketConfirmedNonEmpty('error_logs');
      const entries = (bucket && bucket.entries) || [];
      entries.push(...toSave);
      while (entries.length > 500) entries.shift();
      const result = await this.remoteClient.setStateBucket('error_logs', { version: 1, entries });
      if (result?.ok) {
        this.log(`${toSave.length} entrada(s) guardadas en el servidor`, 'info');
        return;
      }
      if (result?.conflict) {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 400));
        continue;
      }
      break;
    }
    this.log('No se pudo guardar en el servidor — intenta de nuevo', 'error');
  }

  static escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  static render() {
    const el = document.getElementById('debug-console-body');
    if (!el) return;
    const colors = { error: '#ff453a', warn: '#ffcc00', info: '#8e8e93' };
    el.innerHTML = this.entries.map(e =>
      `<div style="color:${colors[e.level] || colors.info};">[${e.ts}] ${this.escapeHtml(e.message)}</div>`
    ).join('');
    el.scrollTop = el.scrollHeight;
    const errorCount = this.entries.filter(e => e.level === 'error').length;
    const inlineBadge = document.getElementById('debug-console-inline-badge');
    if (inlineBadge) {
      inlineBadge.style.display = errorCount > 0 ? 'flex' : 'none';
      inlineBadge.textContent = errorCount > 9 ? '9+' : String(errorCount);
    }
  }

  static toggle() {
    const panel = document.getElementById('debug-console-panel');
    panel.classList.toggle('open');
    const isOpen = panel.classList.contains('open');
    panel.style.transform = isOpen ? 'translateY(0)' : 'translateY(450px)';
  }

  static copyToClipboard() {
    const text = this.entries.map(e => `[${e.ts}] [${e.level}] ${e.message}`).join('\n');
    navigator.clipboard.writeText(text).then(() => {
      this.log('Log copiado al portapapeles', 'info');
    }).catch(() => {
      this.log('No se pudo copiar automáticamente — selecciona el texto manualmente', 'warn');
    });
  }

  static setup() {
    window.addEventListener('error', (e) => {
      this.log(`Error no capturado: ${e.message} (${e.filename}:${e.lineno})`, 'error');
    });
    window.addEventListener('unhandledrejection', (e) => {
      const reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
      this.log(`Promesa rechazada sin capturar: ${reason}`, 'error');
    });
    this.log('Consola de depuración iniciada', 'info');
  }
}

/**
 * LoadingOverlay — bloqueo visual de pantalla completa mientras se guarda/
 * sincroniza un registro. Evita que un doble-tap dispare un segundo
 * guardado mientras el primero todavía está en curso — el backdrop cubre
 * toda la pantalla y captura los clicks, así que nada por debajo es
 * interactuable hasta que se oculta.
 */
const LoadingOverlay = (() => {
  let overlayEl, orbEl, textEl, hideTimer;

  function refs() {
    if (!overlayEl) {
      overlayEl = document.getElementById('loading-overlay');
      orbEl = document.getElementById('loading-orb');
      textEl = document.getElementById('loading-overlay-text');
    }
    return !!overlayEl;
  }

  function show(text = 'Guardando...') {
    if (!refs()) return;
    clearTimeout(hideTimer);
    overlayEl.classList.add('active');
    orbEl.className = 'loading-orb saving';
    textEl.textContent = text;
  }

  function success(text = 'Guardado', autoHideMs = 500) {
    if (!refs()) return;
    orbEl.className = 'loading-orb saved';
    textEl.textContent = text;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, autoHideMs);
  }

  function error(text = 'Error al guardar', autoHideMs = 1600) {
    if (!refs()) return;
    orbEl.className = 'loading-orb error';
    textEl.textContent = text;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hide, autoHideMs);
  }

  function hide() {
    if (!refs()) return;
    clearTimeout(hideTimer);
    overlayEl.classList.remove('active');
  }

  return { show, success, error, hide };
})();

/**
 * ConfirmModal — confirmación in-app (reemplaza confirm() nativo, que se ve
 * fuera de lugar con el resto del diseño OLED). Singleton: reutiliza el
 * mismo overlay del DOM para cualquier confirmación de la app.
 */
class ConfirmModal {
  static show({ title, message, confirmText = 'Confirmar', cancelText = 'Cancelar', danger = false } = {}) {
    return new Promise((resolve) => {
      const overlay = document.getElementById('confirm-overlay');
      const btnAccept = document.getElementById('confirm-btn-accept');
      const btnCancel = document.getElementById('confirm-btn-cancel');

      document.getElementById('confirm-title').textContent = title || '';
      document.getElementById('confirm-message').textContent = message || '';
      btnAccept.textContent = confirmText;
      btnAccept.classList.toggle('danger', !!danger);
      btnCancel.textContent = cancelText;

      const close = (result) => {
        overlay.classList.remove('active');
        resolve(result);
      };

      btnAccept.addEventListener('click', () => close(true), { once: true });
      btnCancel.addEventListener('click', () => close(false), { once: true });
      overlay.classList.add('active');
    });
  }
}

/**
 * GridClient — interact with Grid API for state buckets and document uploads
 */
class GridClient {
  constructor(docId) {
    this.docId = docId;
    this.baseUrl = location.origin;
    this._updatedAtByName = {};
    // Backpressure global (Biblia Grid V23.5 §5, §15.17.8): un 429 en CUALQUIER
    // petición abre un freno compartido por TODAS — sin esto, varias lecturas
    // paralelas (ej. registry + shards concurrentes) siguen golpeando la API
    // mientras Grid ya pidió esperar, y el 429 se retroalimenta en ráfaga.
    this._blockedUntil = 0;
  }

  /** Espera si hay un freno de backpressure activo antes de disparar la petición. */
  async _respectBackpressureGate() {
    const wait = this._blockedUntil - Date.now();
    if (wait > 0) {
      DebugConsole.log(`Backpressure global: esperando ${Math.round(wait / 1000)}s antes de la próxima petición`, 'info');
      await new Promise((r) => setTimeout(r, wait));
    }
  }

  /** Registra un 429: abre (o extiende) el freno global usando Retry-After si Grid lo manda. */
  _observe429(res) {
    const header = res.headers.get('Retry-After');
    let waitMs = 3000; // fallback conservador si Grid no manda el header
    if (header) {
      const asSeconds = Number(header);
      waitMs = Number.isFinite(asSeconds) ? asSeconds * 1000 : (new Date(header).getTime() - Date.now());
    }
    if (!Number.isFinite(waitMs) || waitMs < 0) waitMs = 3000;
    const until = Date.now() + waitMs;
    if (until > this._blockedUntil) {
      this._blockedUntil = until;
      DebugConsole.log(`Backpressure global: 429 recibido, pausando ${Math.round(waitMs / 1000)}s`, 'warn');
    }
  }

  /**
   * fetch() con timeout y un error tipado para distinguir "el servidor
   * respondió con un error HTTP" de "la petición nunca llegó" (red caída,
   * DNS, CORS, timeout) — el navegador colapsa todo eso en el mismo
   * `TypeError: Failed to fetch` sin más contexto, así que lo etiquetamos
   * aquí una sola vez para que quien llama no tenga que adivinar.
   */
  async _fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
    await this._respectBackpressureGate();
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      if (res.status === 429) this._observe429(res);
      return res;
    } catch (e) {
      if (e.name === 'AbortError') {
        const err = new Error(`Tiempo de espera agotado (${timeoutMs / 1000}s)`);
        err.isTimeout = true;
        throw err;
      }
      // TypeError con "Failed to fetch" (Chrome) / "NetworkError" (Firefox):
      // la petición no llegó a salir de la red del dispositivo. No es un
      // error de la app ni de Grid — es la conexión real, aunque
      // navigator.onLine haya dicho que sí había internet.
      const err = new Error('Sin conexión con el servidor (red no disponible)');
      err.isNetworkError = true;
      err.cause = e;
      throw err;
    } finally {
      clearTimeout(timeoutId);
    }
  }

  async getMe() {
    try {
      const res = await this._fetchWithTimeout(`${this.baseUrl}/api/v1/me`, { credentials: 'include' });
      if (!res.ok) throw new Error(`${res.status}`);
      return await res.json();
    } catch (e) {
      console.warn('Could not fetch /me:', e);
      return null;
    }
  }

  /**
   * GET /documents/{id}/download no sirve el binario directo: devuelve
   * metadata JSON con download_url (o agent_download_url), que hay que
   * volver a fetchear para obtener el blob real.
   */
  async downloadDocumentAsObjectUrl(docId) {
    try {
      const metaRes = await this._fetchWithTimeout(`${this.baseUrl}/api/v1/documents/${docId}/download`, {
        credentials: 'include',
      });
      if (!metaRes.ok) throw new Error(`${metaRes.status}`);
      const meta = await metaRes.json();
      const url = meta.download_url || meta.agent_download_url;
      if (!url) throw new Error('No se encontró download_url en la respuesta');

      const blobRes = await this._fetchWithTimeout(url, { credentials: 'include' });
      if (!blobRes.ok) throw new Error(`${blobRes.status}`);
      const blob = await blobRes.blob();
      return URL.createObjectURL(blob);
    } catch (e) {
      console.warn(`downloadDocumentAsObjectUrl ${docId}:`, e);
      return null;
    }
  }

  /**
   * Subida genérica de archivos a Grid. Se usa tanto para fotos como para
   * los CSV de recovery. El recovery es un documento NUEVO e inmutable: no
   * depende de leer ningún State Bucket antes de poder persistir el lote.
   */
  async uploadDocument(blob, filename, { description = 'Documento de auditoría', visibility = 'public' } = {}) {
    const fd = new FormData();
    fd.append('file', blob, filename);
    fd.append('title', filename);
    fd.append('description', description);
    if (visibility) fd.append('visibility', visibility);

    const res = await this._fetchWithTimeout(`${this.baseUrl}/api/v1/documents`, {
      method: 'POST',
      credentials: 'include',
      body: fd,
    }, 30000);

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || err.message || `HTTP ${res.status}`);
    }
    const body = await res.json();
    const docId = body.id || body.doc_id || (body.document && body.document.id) || null;
    if (!docId) throw new Error('Grid creó el documento pero no devolvió doc_id');
    return docId;
  }

  async uploadPublicDocument(blob, filename) {
    return this.uploadDocument(blob, filename, {
      description: 'Foto de auditoría (captura)',
      visibility: 'public',
    });
  }

  /**
   * A diferencia de las demás llamadas, los errores de red/timeout se
   * relanzan (no se devuelven como null) para que flushOutbox pueda
   * distinguir "todavía no existe el bucket" (404 → null, normal) de
   * "no se pudo hablar con Grid" (hay que detener la sincronización, no
   * seguir intentando registro por registro contra una red caída).
   */
  /**
   * Errores 503 de Grid (típicamente "object-storage is temporarily
   * unavailable") vienen con retry:true explícito en el body — Grid mismo
   * está diciendo que es transitorio y hay que reintentar. Antes esto se
   * trataba igual que cualquier otro error (se relanzaba y se abandonaba
   * el registro para el siguiente flushOutbox), lo cual es más lento e
   * innecesario dado que Grid ya nos dice que reintentemos.
   */
  _shouldRetryStatus(status, bodyText) {
    if (status === 503 || status === 429) return true;
    try {
      return !!JSON.parse(bodyText).retry;
    } catch (e) {
      return false;
    }
  }

  async getStateBucket(name, attempt = 0) {
    const url = `${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`;
    const res = await this._fetchWithTimeout(url, { credentials: 'include' });
    if (res.status === 404) {
      DebugConsole.log(`GET ${name}: 404 (bucket no existe todavía)`, 'info');
      return null;
    }
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      if (this._shouldRetryStatus(res.status, bodyText) && attempt < 5) {
        DebugConsole.log(`GET ${name}: HTTP ${res.status} (transitorio, reintentando) — ${bodyText}`, 'warn');
        await new Promise((r) => setTimeout(r, 500 * (attempt + 1) + Math.random() * 300));
        return this.getStateBucket(name, attempt + 1);
      }
      DebugConsole.log(`GET ${name}: HTTP ${res.status} — ${bodyText}`, 'error');
      const err = new Error(`${res.status}`);
      if (res.status === 429) err.isRateLimited = true;
      throw err;
    }
    const body = await res.json();
    this._updatedAtByName[name] = body.updated_at || '';
    const count = Array.isArray(body.state?.records) ? body.state.records.length : 'n/a';
    DebugConsole.log(`GET ${name}: OK, updated_at=${body.updated_at || '(vacío)'}, records=${count}`, 'info');
    return body.state ?? null;
  }

  /**
   * Confirmado en producción: dos lecturas seguidas del mismo bucket, sin
   * ninguna escritura de por medio, devolvieron 0 registros y luego 46 —
   * object-storage puede responder 200 OK con un estado vacío/obsoleto
   * para un bucket que en realidad sí tiene datos, sin ningún error que
   * detectar ni reintentar por status. syncOneRecord usa este resultado
   * como base para decidir si el bucket "no existe todavía" (empieza desde
   * cero) — confiar en una lectura vacía ahí sobreescribiría el historial
   * real con solo el registro que se está sincronizando. Por eso, antes de
   * aceptar una lectura vacía como base para escribir, se reintenta un par
   * de veces con una breve espera.
   */
  async getStateBucketConfirmedNonEmpty(name) {
    let data = await this.getStateBucket(name);
    for (let i = 0; i < 2 && (!data || !data.records || data.records.length === 0); i++) {
      DebugConsole.log(`GET ${name}: vino vacío, confirmando antes de usarlo como base (intento ${i + 1})`, 'warn');
      await new Promise((r) => setTimeout(r, 700 + Math.random() * 300));
      data = await this.getStateBucket(name);
    }
    return data;
  }

  /**
   * Lectura FAIL-CLOSED exclusiva para *_master antes de una escritura.
   *
   * Un master vacío solo es confiable si lleva el sentinel initialized:true.
   * Los masters legacy con registros se aceptan y se migran al sentinel en
   * la siguiente escritura. Si 3 lecturas siguen llegando null/[] sin ese
   * sentinel, NO se escribe: se lanza un error tipado y Captura activa el
   * circuito de contingencia + recovery CSV.
   */
  async getStateBucketForProtectedMasterWrite(name, confirmations = 3) {
    let last = null;
    for (let i = 0; i < confirmations; i++) {
      const data = await this.getStateBucket(name);
      last = data;
      const hasRecordsArray = !!data && Array.isArray(data.records);
      const isInitialized = hasRecordsArray && data.initialized === true;
      const isLegacyNonEmpty = hasRecordsArray && data.records.length > 0;

      if (isInitialized || isLegacyNonEmpty) {
        // Migración segura de legacy: solo se agrega el sentinel después de
        // haber observado un master no vacío. OCC seguirá protegiendo el PUT.
        if (data.initialized !== true) return { ...data, initialized: true };
        return data;
      }

      if (i < confirmations - 1) {
        DebugConsole.log(
          `GET ${name}: vacío/no inicializado; fail-closed, confirmación ${i + 1}/${confirmations}`,
          'warn'
        );
        await new Promise((r) => setTimeout(r, 700 + Math.random() * 300));
      }
    }

    const err = new Error(`Lectura ambigua de ${name}: no se acepta vacío sin initialized:true`);
    err.isAmbiguousMaster = true;
    err.bucketName = name;
    err.lastState = last;
    throw err;
  }

  /**
   * Después de un PUT 200, no eliminamos la copia local hasta comprobar que
   * el UID ya es visible en el master. Una lectura stale puede retrasar el
   * ACK, pero eso es seguro: el siguiente intento deduplica por uid.
   */
  async confirmRecordPresent(name, uid, attempts = 3) {
    for (let i = 0; i < attempts; i++) {
      const data = await this.getStateBucket(name);
      if (data && Array.isArray(data.records) && data.records.some((r) => r && r.uid === uid)) {
        return true;
      }
      if (i < attempts - 1) {
        await new Promise((r) => setTimeout(r, 500 + Math.random() * 350));
      }
    }
    return false;
  }

  /** Variante batch de confirmRecordPresent: confirma varios UIDs en una sola pasada de lecturas. */
  async confirmRecordsPresent(name, uids, attempts = 3) {
    const wanted = new Set(uids);
    for (let i = 0; i < attempts; i++) {
      const data = await this.getStateBucket(name);
      if (data && Array.isArray(data.records)) {
        const found = new Set(data.records.map((r) => r && r.uid).filter(Boolean));
        if ([...wanted].every((uid) => found.has(uid))) return true;
      }
      if (i < attempts - 1) {
        await new Promise((r) => setTimeout(r, 500 + Math.random() * 350));
      }
    }
    return false;
  }

  /**
   * Variante shard-aware de getStateBucketForProtectedMasterWrite: un shard
   * diario nuevo (nadie escribió ahí todavía, en ningún dispositivo) es
   * legítimamente vacío y no debe activar el fail-closed — se crearía un
   * falso circuito de contingencia cada medianoche. {formId}_shard_registry
   * es un bucket minúsculo (una fecha -> true por día, nunca crece con el
   * volumen de registros) que recuerda qué shards ya tuvieron al menos una
   * escritura confirmada; solo esos shards usan el fail-closed de verdad.
   */
  async getShardBucketForWrite(formId, shardName, dateKey, confirmations = 3) {
    const registry = await this.getStateBucket(`${formId}_shard_registry`);
    const knownToExist = !!(registry && registry.dates && registry.dates[dateKey]);

    if (!knownToExist) {
      const data = await this.getStateBucket(shardName);
      if (data && Array.isArray(data.records) && (data.initialized === true || data.records.length > 0)) {
        // Otro dispositivo lo creó justo entre que se leyó el registro y ahora.
        return data.initialized === true ? data : { ...data, initialized: true };
      }
      return { version: 1, initialized: true, records: [] };
    }

    return this.getStateBucketForProtectedMasterWrite(shardName, confirmations);
  }

  /**
   * Variante para masters NO shardeados, análoga a getShardBucketForWrite:
   * el "primera vez" se resuelve con un registro por formId en vez de por
   * fecha, porque un master plano solo es legítimamente vacío una única
   * vez en su vida (no "cada medianoche" como los shards). Sin esto,
   * cualquier formId cuyo master jamás se haya escrito queda bloqueado
   * para siempre: el fail-closed exige ver datos ya confirmados antes de
   * permitir la primera escritura, y un master nuevo nunca los tendrá.
   */
  async getMasterBucketForWrite(formId, bucketName, confirmations = 3) {
    const registry = await this.getStateBucket(`${formId}_master_registry`);
    const knownToExist = !!(registry && registry.created === true);

    if (!knownToExist) {
      const data = await this.getStateBucket(bucketName);
      if (data && Array.isArray(data.records) && (data.initialized === true || data.records.length > 0)) {
        // Otro dispositivo lo creó justo entre que se leyó el registro y ahora.
        return data.initialized === true ? data : { ...data, initialized: true };
      }
      return { version: 1, initialized: true, records: [] };
    }

    return this.getStateBucketForProtectedMasterWrite(bucketName, confirmations);
  }

  /** Marca un master no shardeado como creado. Idempotente y con OCC. */
  async markMasterCreated(formId) {
    const registryName = `${formId}_master_registry`;
    for (let attempt = 0; attempt < 5; attempt++) {
      const state = (await this.getStateBucket(registryName)) || { version: 1, created: false };
      if (state.created === true) return true;
      state.version = 1;
      state.created = true;
      const result = await this.setStateBucket(registryName, state);
      if (result?.ok) return true;
      if (result?.conflict) {
        await new Promise((r) => setTimeout(r, 200 + Math.random() * 250));
        continue;
      }
      return false;
    }
    return false;
  }

  /** Marca una fecha como confirmada en el registro de shards. Idempotente y con OCC. */
  async markShardCreated(formId, dateKey) {
    const registryName = `${formId}_shard_registry`;
    for (let attempt = 0; attempt < 5; attempt++) {
      const state = (await this.getStateBucket(registryName)) || { version: 1, dates: {} };
      if (state.dates && state.dates[dateKey]) return true;
      state.version = 1;
      state.dates = state.dates || {};
      state.dates[dateKey] = true;
      const result = await this.setStateBucket(registryName, state);
      if (result?.ok) return true;
      if (result?.conflict) {
        await new Promise((r) => setTimeout(r, 200 + Math.random() * 250));
        continue;
      }
      return false;
    }
    return false;
  }

  async setStateBucket(name, data, attempt = 0) {
    const ifUpdatedAt = this._updatedAtByName[name] || '';
    const url = `${this.baseUrl}/api/v1/documents/${this.docId}/states/${name}`;
    DebugConsole.log(`PUT ${name}: if_updated_at="${ifUpdatedAt}", records=${data.records?.length ?? 'n/a'}`, 'info');
    const res = await this._fetchWithTimeout(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: data, if_updated_at: ifUpdatedAt }),
      credentials: 'include',
    });

    if (res.status === 409) {
      const conflictBody = await res.json().catch(() => ({}));
      if (conflictBody.current_updated_at) {
        this._updatedAtByName[name] = conflictBody.current_updated_at;
      }
      DebugConsole.log(`PUT ${name}: 409 conflict, current_updated_at=${conflictBody.current_updated_at || '?'}`, 'warn');
      return { conflict: true };
    }
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      if (this._shouldRetryStatus(res.status, bodyText) && attempt < 5) {
        DebugConsole.log(`PUT ${name}: HTTP ${res.status} (transitorio, reintentando) — ${bodyText}`, 'warn');
        await new Promise((r) => setTimeout(r, 500 * (attempt + 1) + Math.random() * 300));
        return this.setStateBucket(name, data, attempt + 1);
      }
      DebugConsole.log(`PUT ${name}: HTTP ${res.status} — ${bodyText}`, 'error');
      const err = new Error(`${res.status}`);
      if (res.status === 429) err.isRateLimited = true;
      throw err;
    }
    const body = await res.json();
    this._updatedAtByName[name] = body.updated_at || '';
    DebugConsole.log(`PUT ${name}: OK, new updated_at=${body.updated_at || '(vacío)'}`, 'info');
    return { ok: true };
  }

  /* ====================================================================== */
  /* Catálogo de Premissort Contenerizado (Google Sheets)                   */
  /* Grid retiró source_type: grid_sql (ver comentario junto a              */
  /* PREMISSORT_SHEET_ID) — el catálogo completo se lee de una sheet ya     */
  /* conectada a BigQuery vía el proxy de Sheets de Grid.                   */
  /* ====================================================================== */

  /**
   * Trae el catálogo completo (todas las posiciones/HU/shipments activos)
   * en una sola llamada — PremissortSession lo cachea en memoria por
   * sesión y filtra en JS por posición o shipment_id, en vez de pedir una
   * consulta nueva por cada escaneo.
   */
  async loadPremissortCatalog() {
    // cache: 'no-store' + cache-busting por timestamp — sin esto, algunos
    // WebView/navegadores pueden servir una respuesta GET cacheada en vez
    // de golpear el proxy de Sheets de nuevo, lo que se ve igual que "el
    // catálogo no lee la actualización reciente" aunque la sheet ya esté
    // al día. Ver también el log de diagnóstico abajo.
    const url = `${this.baseUrl}/api/v1/sheets/${encodeURIComponent(PREMISSORT_SHEET_ID)}?doc_id=${encodeURIComponent(this.docId)}&range=${encodeURIComponent(PREMISSORT_SHEET_RANGE)}&_ts=${Date.now()}`;
    const res = await this._fetchWithTimeout(url, { credentials: 'include', cache: 'no-store' });
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      throw new Error(`No se pudo leer el catálogo de Premissort: HTTP ${res.status}${bodyText ? ` — ${bodyText.slice(0, 300)}` : ''}`);
    }
    const body = await res.json();
    const rows = Array.isArray(body?.values) ? body.values : [];
    const [header, ...dataRows] = rows;
    if (!header) {
      DebugConsole.log('Catálogo Premissort: la sheet no devolvió encabezado (¿pestaña/rango vacíos?)', 'warn');
      return [];
    }
    const idx = {
      POSICION: header.indexOf('POSICION'),
      HU: header.indexOf('HU'),
      SHIPMENT_ID: header.indexOf('SHIPMENT_ID'),
    };
    const missingCols = Object.entries(idx).filter(([, i]) => i === -1).map(([k]) => k);
    if (missingCols.length) {
      DebugConsole.log(`Catálogo Premissort: encabezado real no tiene estas columnas esperadas: ${missingCols.join(', ')} (header real: ${header.join(' | ')})`, 'warn');
    }
    DebugConsole.log(`Catálogo Premissort: ${dataRows.length} filas leídas de ${PREMISSORT_SHEET_RANGE}`, 'info');
    return dataRows
      .filter((r) => Array.isArray(r) && r.length)
      .map((r) => ({
        POSICION: String(r[idx.POSICION] ?? '').trim(),
        HU: String(r[idx.HU] ?? '').trim(),
        SHIPMENT_ID: String(r[idx.SHIPMENT_ID] ?? '').trim(),
      }))
      .filter((r) => r.POSICION && r.SHIPMENT_ID);
  }

  /** Igual que loadPremissortCatalog pero para la pestaña CONT_CERRADO (solo HU + SHIPMENT_ID, sin POSICION). */
  async loadContenedorCerradoCatalog() {
    const url = `${this.baseUrl}/api/v1/sheets/${encodeURIComponent(PREMISSORT_SHEET_ID)}?doc_id=${encodeURIComponent(this.docId)}&range=${encodeURIComponent(CONT_CERRADO_SHEET_RANGE)}&_ts=${Date.now()}`;
    const res = await this._fetchWithTimeout(url, { credentials: 'include', cache: 'no-store' });
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      throw new Error(`No se pudo leer el catálogo de Contenedor Cerrado: HTTP ${res.status}${bodyText ? ` — ${bodyText.slice(0, 300)}` : ''}`);
    }
    const body = await res.json();
    const rows = Array.isArray(body?.values) ? body.values : [];
    const [header, ...dataRows] = rows;
    if (!header) {
      DebugConsole.log('Catálogo Contenedor Cerrado: la sheet no devolvió encabezado (¿pestaña/rango vacíos?)', 'warn');
      return [];
    }
    const idx = {
      HU: header.indexOf('HU'),
      SHIPMENT_ID: header.indexOf('SHIPMENT_ID'),
    };
    const missingCols = Object.entries(idx).filter(([, i]) => i === -1).map(([k]) => k);
    if (missingCols.length) {
      DebugConsole.log(`Catálogo Contenedor Cerrado: encabezado real no tiene estas columnas esperadas: ${missingCols.join(', ')} (header real: ${header.join(' | ')})`, 'warn');
    }
    DebugConsole.log(`Catálogo Contenedor Cerrado: ${dataRows.length} filas leídas de ${CONT_CERRADO_SHEET_RANGE}`, 'info');
    return dataRows
      .filter((r) => Array.isArray(r) && r.length)
      .map((r) => ({
        HU: String(r[idx.HU] ?? '').trim(),
        SHIPMENT_ID: String(r[idx.SHIPMENT_ID] ?? '').trim(),
      }))
      .filter((r) => r.HU && r.SHIPMENT_ID);
  }

  /** Igual que loadContenedorCerradoCatalog pero para la pestaña AUDITORIA_HV. */
  async loadAuditoriaHVCatalog() {
    // cache: 'no-store' — sin esto, algunos WebView/navegadores pueden
    // servir una respuesta GET cacheada en vez de golpear el proxy de
    // Sheets de nuevo, lo que se vería igual que "el catálogo no lee la
    // actualización reciente" aunque la sheet ya esté al día.
    const url = `${this.baseUrl}/api/v1/sheets/${encodeURIComponent(PREMISSORT_SHEET_ID)}?doc_id=${encodeURIComponent(this.docId)}&range=${encodeURIComponent(AUDITORIA_HV_SHEET_RANGE)}&_ts=${Date.now()}`;
    const res = await this._fetchWithTimeout(url, { credentials: 'include', cache: 'no-store' });
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      throw new Error(`No se pudo leer el catálogo de Auditoría HV: HTTP ${res.status}${bodyText ? ` — ${bodyText.slice(0, 300)}` : ''}`);
    }
    const body = await res.json();
    const rows = Array.isArray(body?.values) ? body.values : [];
    const [header, ...dataRows] = rows;
    if (!header) {
      DebugConsole.log('Catálogo Auditoría HV: la sheet no devolvió encabezado (¿pestaña/rango vacíos?)', 'warn');
      return [];
    }
    const idx = {
      ID: header.indexOf('ID'),
      Descripcion: header.indexOf('Descripcion'),
      Costo_USD: header.indexOf('Costo_USD'),
      Costo_MXN: header.indexOf('Costo_MXN'),
      TIPO_DE_ENVIO: header.indexOf('TIPO_DE_ENVIO'),
      Canalizacion: header.indexOf('Canalizacion'),
      SHP_RETURN_QR_ID: header.indexOf('SHP_RETURN_QR_ID'),
      FECHA_DE_ACTUALIZACION: header.indexOf('FECHA_DE_ACTUALIZACION'),
    };
    // Si alguna columna esperada no matchea el header real (nombre exacto
    // distinto, típicamente por mayúsculas/espacios), header.indexOf
    // devuelve -1 y esa columna sale vacía en TODAS las filas — se ve
    // igual que "no lee nada nuevo" pero es un problema de nombre de
    // columna, no de frescura. Se deja bien visible en consola para poder
    // distinguir un caso del otro sin adivinar.
    const missingCols = Object.entries(idx).filter(([, i]) => i === -1).map(([k]) => k);
    if (missingCols.length) {
      DebugConsole.log(`Catálogo Auditoría HV: encabezado real no tiene estas columnas esperadas: ${missingCols.join(', ')} (header real: ${header.join(' | ')})`, 'warn');
    }
    DebugConsole.log(`Catálogo Auditoría HV: ${dataRows.length} filas leídas de ${AUDITORIA_HV_SHEET_RANGE}`, 'info');
    return dataRows
      .filter((r) => Array.isArray(r) && r.length)
      .map((r) => ({
        ID: String(r[idx.ID] ?? '').trim(),
        Descripcion: String(r[idx.Descripcion] ?? '').trim(),
        Costo_USD: String(r[idx.Costo_USD] ?? '').trim(),
        Costo_MXN: String(r[idx.Costo_MXN] ?? '').trim(),
        TIPO_DE_ENVIO: String(r[idx.TIPO_DE_ENVIO] ?? '').trim(),
        Canalizacion: String(r[idx.Canalizacion] ?? '').trim(),
        SHP_RETURN_QR_ID: String(r[idx.SHP_RETURN_QR_ID] ?? '').trim(),
        FECHA_DE_ACTUALIZACION: String(r[idx.FECHA_DE_ACTUALIZACION] ?? '').trim(),
      }))
      .filter((r) => r.ID);
  }
}

/**
 * Enlaces externos (Sauron/TMS): se abren con window.open() explícito, sin
 * target="_blank" en el <a>. En algunos WebView (handheld con MDM) un
 * <a target="_blank"> dispara la apertura nativa de una pestaña Y, en
 * paralelo, el interceptor de enlaces que Grid inyecta en el HTML (ver más
 * abajo en el archivo, "Grid: outbound link"/requestParentPopup) intenta
 * abrir una segunda vía postMessage al padre — dos pestañas para el mismo
 * clic. Al no declarar target="_blank" en el <a> y disparar window.open()
 * nosotros mismos (que Grid también intercepta, de forma segura y única),
 * queda un solo punto de apertura.
 */
document.addEventListener('click', (e) => {
  const link = e.target.closest('a.ext-open-link');
  if (!link) return;
  e.preventDefault();
  window.open(link.getAttribute('href'), '_blank');
});

/**
 * Main application controller
 */
class CapturaApp {
  constructor() {
    this.docId = new URLSearchParams(location.search).get('data_doc_id') || '01KZPRK3PDWP9TG0RKW3J9JGN7';
    this.gridClient = new GridClient(this.docId);
    this.catalogIndex = {};
    this.catalogLoadedAt = null;
    this.catalogAccessDenied = false;
    this.outboxRecords = [];
    this.syncing = false;
    this.currentEngine = null;
    this.userEmail = null;
    this.pendingCount = 0;
    this.lastDoca = null;
    this.lastLugar = null;
    this.barreduraCatalogIndex = {};
    this.barreduraCatalogGeneratedAt = null;
    this.barreduraCatalogAccessDenied = false;
    this.folderIds = {}; // folder_id de Grid por tipo de log (cache en memoria)

    // Resiliencia de sincronización. El operador nunca decide entre master y
    // recovery: Captura conmuta automáticamente y sigue guardando local.
    this.deviceId = null;
    this.masterCircuit = {}; // bucketName -> { openUntil, openedAt, reason }
    this.MASTER_CIRCUIT_MS = 60 * 1000;
    this.RECOVERY_BATCH_THRESHOLD = 50;
    this.RECOVERY_MAX_WAIT_MS = 5 * 60 * 1000;
    this.RECOVERY_BATCH_MAX = 100;
    this.RECOVERY_PREFIX = 'RECOVERY_AUDITORIAS';
    this._maintenanceTimer = null;
    // Shards ya confirmados como existentes en esta sesión — evita releer
    // {formId}_shard_registry en cada lote una vez que ya se sabe que el
    // shard de hoy existe (ver GridClient.getShardBucketForWrite).
    this._knownShards = new Set();
    // Debounce de sincronización para los logs de escaneo en loop: agrupa
    // varios escaneos seguidos en un solo GET+PUT por shard en vez de uno
    // por registro. Dispara al primero que ocurra de: 10 pendientes o 5s
    // desde el primer pendiente sin sincronizar.
    this._syncDebounceTimer = null;
    this.SYNC_BATCH_MAX = 10;
    this.SYNC_BATCH_DEBOUNCE_MS = 5000;

    // Modo de captura de códigos: 'handheld' (lector integrado, principal) o
    // 'camera'. Se restaura desde IndexedDB en init() (por dispositivo).
    this.scanMode = 'handheld';
    this._navRevealTimer = null;

    // Guard de historial: intercepta el botón/gesto "atrás" del sistema
    // (Android, o el back del navegador) para navegar dentro de la app
    // (paso anterior del formulario, o al menú) en vez de salir de la app
    // por completo — sin esto, "atrás" cierra el documento de Grid.
    this._screen = 'menu';
    this._inSubScreen = false;
    window.addEventListener('popstate', () => this.handleHardwareBack());
    history.replaceState({ screen: 'menu' }, '', '');

    DebugConsole.setup();
    DebugConsole.log(`Documento: ${this.docId}`, 'info');

    const debugBtn = document.getElementById('btn-debug-console');
    if (debugBtn) debugBtn.addEventListener('click', () => DebugConsole.toggle());

    // Logo = home button
    const navLogo = document.getElementById('navbar-logo');
    if (navLogo) navLogo.addEventListener('click', () => this.renderMenu());

    // Pull-tab reveals the navbar temporarily when inside a log
    const pullTab = document.getElementById('nav-pull-tab');
    if (pullTab) pullTab.addEventListener('click', () => {
      clearTimeout(this._navRevealTimer);
      document.querySelector('.navbar').classList.remove('nav-hidden');
      document.getElementById('nav-overlay').classList.add('visible');
      this._navRevealTimer = setTimeout(() => this._autoHideNavbar(), 4000);
    });

    const navOverlay = document.getElementById('nav-overlay');
    if (navOverlay) navOverlay.addEventListener('click', () => this._autoHideNavbar());
  }

  /**
   * Empuja una entrada extra al historial mientras estemos fuera del menú,
   * para que el siguiente "atrás" dispare popstate (navegación interna) en
   * vez de la navegación real del navegador/webview.
   */
  ensureBackGuard() {
    if (!this._inSubScreen) {
      history.pushState({ guard: true }, '', '');
      this._inSubScreen = true;
    }
  }

  handleHardwareBack() {
    if (this.currentEngine) {
      this.currentEngine.back();
    } else {
      this.renderMenu();
    }

    if (this._screen !== 'menu') {
      history.pushState({ guard: true }, '', '');
      this._inSubScreen = true;
    } else {
      this._inSubScreen = false;
    }
  }

  /**
   * Iniciales del correo (ej. isaieduardo.garciarubio@mercadolibre.com.mx
   * → "IG"), igual que el patrón de avatar de otras apps internas: primera
   * letra de las dos primeras palabras del local-part (separadas por
   * punto/guión), o las dos primeras letras si no hay separador.
   */
  static getInitials(email) {
    if (!email) return '?';
    const local = email.split('@')[0] || '';
    const parts = local.split(/[._-]+/).filter(Boolean);
    if (parts.length >= 2) {
      return (parts[0][0] + parts[1][0]).toUpperCase();
    }
    return local.slice(0, 2).toUpperCase() || '?';
  }

  /**
   * Cierra sesión del usuario actual (Biblia Grid §16.23): carga el logout de
   * la pasarela de login en un iframe oculto y verifica con GET /api/v1/me.
   * Nunca se declara "Sesión cerrada" sin esa verificación.
   */
  static async closeGridSession() {
    const url = 'https://login.adminml.com/logout?callbackURL=' + encodeURIComponent('https://grid.adminml.com');
    const iframe = document.createElement('iframe');
    iframe.setAttribute('aria-hidden', 'true');
    iframe.tabIndex = -1;
    iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden;';
    try {
      await new Promise((resolve) => {
        const t = setTimeout(resolve, 15000);
        iframe.addEventListener('load', () => { clearTimeout(t); setTimeout(resolve, 1500); }, { once: true });
        iframe.src = url; // src ANTES de insertar el iframe
        document.body.appendChild(iframe);
      });
    } finally {
      iframe.remove();
    }
    for (let i = 0; i < 4; i++) {
      if (i > 0) await new Promise((r) => setTimeout(r, 1500));
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 8000);
      try {
        const res = await fetch(`${location.origin}/api/v1/me`, {
          credentials: 'include', redirect: 'manual', cache: 'no-store', signal: ctrl.signal,
        });
        if (res.type === 'opaqueredirect' || res.status === 401 || res.status === 403) return true;
      } catch (_) {
        // un error de red no prueba nada: se reintenta
      } finally {
        clearTimeout(timer);
      }
    }
    return false;
  }

  async logout() {
    if (this._loggingOut) return;
    const pend = this.outboxRecords.length;
    const ok = await ConfirmModal.show({
      title: 'Cerrar sesión',
      message: `¿Cerrar sesión de ${this.userEmail}? También se cerrará en las demás apps con el mismo inicio de sesión (*.adminml.com).`
        + (pend > 0 ? ` Hay ${pend} registro(s) pendientes de sincronizar: se conservan en este dispositivo y se enviarán cuando vuelvas a iniciar sesión.` : ''),
      confirmText: 'Cerrar sesión',
      danger: true,
    });
    if (!ok) return;

    this._loggingOut = true;
    try {
      for (;;) {
        LoadingOverlay.show('Cerrando sesión...');
        if (await CapturaApp.closeGridSession()) break;
        LoadingOverlay.hide();
        const retry = await ConfirmModal.show({
          title: 'No se pudo cerrar la sesión',
          message: 'No se pudo verificar el cierre de sesión. Revisa tu conexión e inténtalo de nuevo.',
          confirmText: 'Reintentar',
        });
        if (!retry) return;
      }
      this._onLoggedOut();
    } finally {
      this._loggingOut = false;
    }
  }

  /** Gancho onLoggedOut: limpia estado en memoria y bloquea la UI. */
  _onLoggedOut() {
    LoadingOverlay.hide();
    if (this._maintenanceTimer) { clearInterval(this._maintenanceTimer); this._maintenanceTimer = null; }
    this.syncing = true; // sin sesión no hay sincronización posible
    try { if (this.currentEngine && this.currentEngine.destroy) this.currentEngine.destroy(); } catch (_) {}
    this.currentEngine = null;
    this.userEmail = null;
    const root = document.getElementById('app-root');
    if (root) root.innerHTML = '';
    const screen = document.createElement('div');
    screen.style.cssText = 'position:fixed;inset:0;z-index:4000;background:var(--color-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--spacing-lg);gap:var(--spacing-sm);';
    screen.innerHTML = '<div style="font-size:1.1rem;font-weight:700;">Sesión cerrada</div>'
      + '<div style="font-size:var(--font-body);color:var(--color-text-muted);max-width:320px;">Tu sesión se cerró en Grid y en las demás apps con el mismo inicio de sesión. Vuelve a abrir la app desde Grid para entrar de nuevo.</div>';
    document.body.appendChild(screen);
  }

  /**
   * Folder_id de Grid para un tipo de log — una carpeta POR LOG (no una
   * compartida), reutilizada entre dispositivos vía el State Bucket
   * photo_folders en vez de crear una carpeta nueva en cada sincronización.
   * No es bloqueante: si falla, la foto ya subió igual, solo sin organizar.
   */
  async getOrCreateFolderId(formId) {
    if (this.folderIds[formId]) return this.folderIds[formId];

    try {
      const bucket = await this.gridClient.getStateBucket('photo_folders');
      if (bucket && bucket[formId]) {
        this.folderIds[formId] = bucket[formId];
        return bucket[formId];
      }
    } catch (e) {
      DebugConsole.log(`No se pudo leer photo_folders: ${e.message}`, 'warn');
    }

    const label = (FORMS_CONFIG[formId] && FORMS_CONFIG[formId].title) || formId;
    try {
      DebugConsole.log(`Creando carpeta de fotos para ${label}...`, 'info');
      const res = await this.gridClient._fetchWithTimeout(
        `${location.origin}/api/v1/folders`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ name: label }),
        }
      );
      const data = await res.json();
      if (!res.ok || !data.folder_id) {
        DebugConsole.log(`No se pudo crear carpeta para ${label}: ${res.status}`, 'warn');
        return null;
      }
      this.folderIds[formId] = data.folder_id;
      await this.savePhotoFolder(formId, data.folder_id);
      DebugConsole.log(`Carpeta lista para ${label}: ${data.folder_id}`, 'info');
      return data.folder_id;
    } catch (e) {
      DebugConsole.log(`Error creando carpeta para ${label}: ${e.message}`, 'warn');
      return null;
    }
  }

  /**
   * Guarda el folder_id recién creado en photo_folders (bucket compartido
   * entre dispositivos) con reintento en conflicto (409). Si otro
   * dispositivo ya resolvió ese mismo log mientras tanto, se usa el suyo
   * en vez del propio (queda una carpeta huérfana vacía en Grid, pero
   * eso es preferible a una carpeta distinta por dispositivo).
   */
  async savePhotoFolder(formId, folderId) {
    for (let attempt = 0; attempt < 5; attempt++) {
      const current = (await this.gridClient.getStateBucket('photo_folders')) || {};
      if (current[formId]) {
        this.folderIds[formId] = current[formId];
        return;
      }
      const result = await this.gridClient.setStateBucket('photo_folders', { ...current, [formId]: folderId });
      if (!result || !result.conflict) return;
      await new Promise((r) => setTimeout(r, 200 + Math.random() * 300));
    }
  }

    try {
      DebugConsole.log('Cargando catálogo destino/doca...', 'info');
      const data = await this.gridClient.getStateBucket('catalogo_destino_doca');

      if (!data || typeof data !== 'object') {
        DebugConsole.log('Catálogo destino/doca vacío o no publicado', 'warn');
        this.catalogIndex = {};

      DebugConsole.log(`Catálogo destino/doca cargado: ${Object.keys(this.catalogIndex).length} docas`, 'info');

      this.catalogAccessDenied = /^403$/.test(e.message);

  /**
   * Registros de barredura de las últimas 16h para la deduplicación global:
   * combina lo ya sincronizado en los shards de master (hoy + ayer, o el
   * legacy si la fecha cae antes del cutover) con la cola local aún sin
   * sincronizar. Devuelve [{ shipment_id, ts }].
   */
  async loadRecentBarredura() {
    const cutoff = Date.now() - BarreduraSession.DEDUP_WINDOW_MS;
    const recent = [];

    const todayKey = shardDateKeyMexico(new Date().toISOString());
    const yesterdayKey = shardDateKeyMexico(new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString());
    const bucketNames = new Set([
      masterBucketNameFor('barredura', todayKey),
      masterBucketNameFor('barredura', yesterdayKey),
    ]);

    for (const bucketName of bucketNames) {
      try {
        const bucket = await this.gridClient.getStateBucket(bucketName);
        if (bucket && Array.isArray(bucket.records)) {
          bucket.records.forEach((r) => {
            if (r && r.shipment_id && r.ts && Date.parse(r.ts) >= cutoff) {
              recent.push({ shipment_id: String(r.shipment_id), ts: r.ts });
            }
          });
        }
      } catch (e) {
        DebugConsole.log(`No se pudo leer ${bucketName} para dedup: ${e.message}`, 'warn');
      }
    }

    this.outboxRecords.forEach((r) => {
      if (r && r.formId === 'barredura' && r.shipment_id && r.ts && Date.parse(r.ts) >= cutoff) {
        recent.push({ shipment_id: String(r.shipment_id), ts: r.ts });
      }
    });
    return recent;
  }

  /**
   * Dedup del día para Premissort: combina lo ya sincronizado en el shard
   * de HOY (Premissort no consulta ayer — cada día es un plan de posiciones
   * nuevo) con la cola local aún sin sincronizar. found = shipment_id con
   * estado Encontrado (cuenta como resuelto en su posición correcta,
   * llegue de donde llegue); anyRecord = cualquier shipment_id con registro
   * de hoy (Encontrado o sobrante ya resuelto), para no volver a preguntar
   * por lo mismo si se re-escanea.
   */
  async loadRecentPremissort() {
    const found = new Set();
    const anyRecord = new Set();

    const todayKey = shardDateKeyMexico(new Date().toISOString());
    const bucketName = masterBucketNameFor('premissort', todayKey);

    try {
      const bucket = await this.gridClient.getStateBucket(bucketName);
      if (bucket && Array.isArray(bucket.records)) {
        bucket.records.forEach((r) => {
          if (!r || !r.shipment_id) return;
          const sid = String(r.shipment_id);
          anyRecord.add(sid);
          if (r.estado === 'Encontrado') found.add(sid);
        });
      }
    } catch (e) {
      DebugConsole.log(`No se pudo leer ${bucketName} para dedup de Premissort: ${e.message}`, 'warn');
    }

    this.outboxRecords.forEach((r) => {
      if (!r || r.formId !== 'premissort' || !r.shipment_id) return;
      const sid = String(r.shipment_id);
      anyRecord.add(sid);
      if (r.estado === 'Encontrado') found.add(sid);
    });

    return { found, anyRecord };
  }

  /**
   * Dedup de Auditoría HV: un shipment marcado On_Hold (rama fuera de
   * catálogo, ver descripcion === '(fuera de catálogo)' en saveNotFound)
   * solo se captura UNA VEZ para siempre, sin importar el día — a
   * diferencia de un match en catálogo, que sí puede repetirse (una misma
   * Rx puede cubrir varios paquetes en momentos distintos). Por eso se lee
   * el histórico completo de auditoria_hv_master (bucket único, no
   * shardeado) sin filtrar por fecha.
   */
  async loadRecentAuditoriaHV() {
    const onHoldCaptured = new Set();
    // Sin filtro de fecha a propósito: un On_Hold es de una sola vez para
    // siempre, no por día calendario — se revisa el histórico completo de
    // auditoria_hv_master (bucket único, no shardeado).
    const bucketName = masterBucketNameFor('auditoria_hv', new Date().toISOString());

    try {
      const bucket = await this.gridClient.getStateBucket(bucketName);
      if (bucket && Array.isArray(bucket.records)) {
        bucket.records.forEach((r) => {
          if (!r || !r.shipment_id) return;
          if (r.descripcion !== '(fuera de catálogo)') return;
          onHoldCaptured.add(String(r.shipment_id).toUpperCase());
        });
      }
    } catch (e) {
      DebugConsole.log(`No se pudo leer ${bucketName} para dedup de Auditoría HV: ${e.message}`, 'warn');
    }

    this.outboxRecords.forEach((r) => {
      if (!r || r.formId !== 'auditoria_hv' || !r.shipment_id) return;
      if (r.descripcion !== '(fuera de catálogo)') return;
      onHoldCaptured.add(String(r.shipment_id).toUpperCase());
    });

    return onHoldCaptured;
  }
