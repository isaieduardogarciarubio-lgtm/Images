    // nuevo el log desde el menú crea una instancia nueva y por lo tanto
    // relee el catálogo; cambiar de HU dentro de la misma sesión no.
    this.catalog = null;

    // Dedup del día: found = ya guardado como Encontrado (en cualquier
    // HU); anyRecordToday = cualquier registro de hoy (Encontrado o
    // sobrante ya resuelto), para no volver a preguntar por lo mismo.
    this.foundToday = new Set(opts.foundToday || []);
    this.anyRecordToday = new Set(opts.anyRecordToday || []);

    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.inManualMode = false;
    this.pendingPanelOpen = false;

    this.hu = null;
    this.pending = new Map();
    this.handled = new Map();
    this.total = 0;
  }

  render(containerId) {
    this.container = document.getElementById(containerId);
    this.renderHuEntry();
  }

  /** Carga el catálogo la primera vez que se necesita; llamadas siguientes reusan la misma referencia en memoria. */
  async ensureCatalog() {
    if (!this.catalog) {
      this.catalog = await this.gridClient.loadContenedorCerradoCatalog();
    }
    return this.catalog;
  }

  destroy() {
    this.stopScanner();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /* ====================================================================== */
  /* Paso 1: escanear/ingresar el HU del contenedor cerrado                */
  /* ====================================================================== */

  renderHuEntry(message) {
    this.stopScanner();
    this.locked = false;
    const camera = ScanUI.mode() === 'camera';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Contenedor Cerrado</div>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">${camera ? 'Escanea el HU' : 'Escanea o ingresa el HU'}</h1>
        <div class="scanner-body"></div>
        <div class="step-support ${message ? 'error' : ''}">${message || ''}</div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderHuEntry()));
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      if (!this.supportEl.textContent) this.supportEl.textContent = 'Apunta la cámara al código del HU del contenedor.';
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Ingresar HU manualmente';
      link.addEventListener('click', () => this.enterManualHuEntry());
      this.container.querySelector('.step-screen').appendChild(link);
      this.startHuCamera();
    } else {
      if (!this.supportEl.textContent) this.supportEl.textContent = 'Escanea con el lector o escribe el HU y Enter.';

      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw) return;
        hidInput.value = '';
        lastCodeEl.textContent = raw;
        lastCodeEl.className = 'hh-last-code visible';
        this.handleHuInput(raw);
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">HU</p>
          <input type="text" class="hh-manual-input" placeholder="Ej. 2425561772887420" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.handleHuInput(val);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  /** A diferencia de la posición de Premissort (código propio, no HU/shipment), aquí sí se escanea un HU real — se reusa ScanParser para aceptar el mismo formato (texto plano o QR con legacy_id) que el resto de la app. */
  handleHuInput(raw) {
    const parsed = ScanParser.parse(raw, 'hu');
    if (!parsed) {
      this.vibrate([40, 60, 40]);
      this.renderHuEntry(`"${raw}" no es un HU válido.`);
      return;
    }
    this.resolveContainer(parsed);
  }

  enterManualHuEntry() {
    if (this.scanner) this.scanner.pause();
    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Ej. 2425561772887420" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el HU y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      this.handleHuInput(input.value);
    });
    setTimeout(() => input.focus(), 60);
  }

  async startHuCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — ingresa el HU manualmente.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleHuInput(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — ingresa el HU manualmente.';
      this.supportEl.classList.add('error');
    }
  }

  renderHuLoading(hu) {
    this.stopScanner();
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <div class="step-progress">Contenedor Cerrado</div>
        </div>
        <h1 class="step-question">Consultando HU ${hu}…</h1>
        <div class="step-support">${this.catalog ? 'Un momento…' : 'Cargando el catálogo — solo tarda la primera vez de esta sesión.'}</div>
      </div>
    `;
  }

  async resolveContainer(hu) {
    this.renderHuLoading(hu);
    let rows;
    try {
      const catalog = await this.ensureCatalog();
      rows = catalog.filter((r) => r.HU === hu);
    } catch (e) {
      this.vibrate([40, 60, 40]);
      this.renderHuEntry(`No se pudo consultar el HU: ${e.message}`);
      return;
    }

    const shipmentIds = [...new Set(rows.map((r) => r && r.SHIPMENT_ID).filter(Boolean).map(String))];
    if (shipmentIds.length === 0) {
      this.vibrate([40, 60, 40]);
      this.renderHuEntry(`HU "${hu}" no tiene shipments activos (o no existe).`);
      return;
    }

    this.hu = hu;
    this.pending = new Map();
    this.handled = new Map();
    shipmentIds.forEach((id) => {
      if (this.foundToday.has(id)) this.handled.set(id, 'Encontrado');
      else this.pending.set(id, { shipment_id: id });
    });
    this.total = shipmentIds.length;

    this.vibrate(60);
    this.renderLoop();
  }

  /* ====================================================================== */
  /* Paso 2: loop de escaneo de shipments esperados en el HU               */
  /* ====================================================================== */

  renderLoop() {
    this.stopScanner();
    this.locked = false;
    this.inManualMode = false;
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera ? 'Escaneando... apunta la cámara al shipment.' : '';

    const foundCount = this.handled.size;
    const pendingCount = this.pending.size;

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Contenedor Cerrado</div>
        </div>
        <div class="session-pill">
          <div class="session-pill-info">HU ${this.hu}</div>
          <button type="button" class="btn btn-secondary session-change-btn">Cambiar</button>
        </div>
        <button type="button" class="driver-pending-toggle">
          <span>${foundCount} / ${this.total} encontrados · ${pendingCount} faltantes</span>
          ${Icons.svg(this.pendingPanelOpen ? 'arrowDown' : 'arrowRight', { size: 16 })}
        </button>
        <div class="driver-pending-panel" style="display: ${this.pendingPanelOpen ? 'block' : 'none'};"></div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el shipment</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.pendingToggleEl = this.container.querySelector('.driver-pending-toggle span');
    this.pendingPanelEl = this.container.querySelector('.driver-pending-panel');
    this.renderPendingPanel();
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });
    this.container.querySelector('.session-change-btn').addEventListener('click', () => {
      this.renderHuEntry();
    });
    this.container.querySelector('.driver-pending-toggle').addEventListener('click', () => {
      this.pendingPanelOpen = !this.pendingPanelOpen;
      this.renderLoop();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualShipmentEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startShipmentCamera();
    } else {
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        hidInput.value = '';
        const isDup = this.handled.has(raw) || this.anyRecordToday.has(raw);
        lastCodeEl.textContent = isDup ? `${raw} · ya escaneado` : raw;
        lastCodeEl.className = 'hh-last-code visible';
        lastCodeEl.classList.toggle('duplicate', isDup);
        this.submitShipmentValue(raw, hidInput);
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Shipment ID</p>
          <input type="text" class="hh-manual-input" placeholder="Shipment ID" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim().toUpperCase();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.submitShipmentValue(val, hidInput);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  submitShipmentValue(rawText, input) {
    const parsed = ScanParser.parse(rawText, 'shipment');
    if (!parsed) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      if (input) input.value = '';
      return;
    }
    const isKnown = this.pending.has(parsed) || this.handled.has(parsed) || this.anyRecordToday.has(parsed);
    const willNavigate = !isKnown;
    this.processShipment(parsed);
    if (!willNavigate && input && document.body.contains(input)) {
      input.value = '';
      input.focus();
    }
  }

  async startShipmentCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleShipmentScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  handleShipmentScan(rawText) {
    if (this.locked) return;
    const parsed = ScanParser.parse(rawText, 'shipment');
    if (!parsed) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      return;
    }
    this.processShipment(parsed);
  }

  enterManualShipmentEntry() {
    if (this.scanner) this.scanner.pause();
    this.inManualMode = true;
    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el Shipment ID" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el Shipment ID y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const parsed = ScanParser.parse(input.value, 'shipment');
      if (!parsed) {
        this.supportEl.textContent = 'Shipment inválido. Verifica el número e intenta de nuevo.';
        this.supportEl.classList.add('error');
        return;
      }
      this.processShipment(parsed);
      input.value = '';
    });
    setTimeout(() => input.focus(), 60);
  }

  renderPendingPanel() {
    if (!this.pendingPanelEl) return;
    if (this.pending.size === 0) {
      this.pendingPanelEl.innerHTML = '<div class="driver-pending-empty">Sin faltantes — todos los shipments esperados fueron encontrados.</div>';
      return;
    }
    this.pendingPanelEl.innerHTML = Array.from(this.pending.keys()).map((sid) => `
      <div class="driver-pending-item">
        <div class="driver-pending-info">
          <div class="driver-pending-id">${sid}</div>
        </div>
      </div>
    `).join('');
  }

  /**
   * Coincide con lo esperado en ESTE HU -> guarda directo, sin interrumpir
   * el loop (ver saveMatch). Ya resuelto hoy (aquí o en otro HU) -> aviso,
   * sigue escaneando. Cualquier otro caso -> pausa y busca en el resto del
   * catálogo (ver resolveSurplus) para saber si pertenece a otro HU o no
   * existe en absoluto.
   */
  processShipment(shipmentId) {
    if (this.pending.has(shipmentId)) {
      this.vibrate(60);
      this.saveMatch(shipmentId);
      return;
    }

    if (this.handled.has(shipmentId) || this.anyRecordToday.has(shipmentId)) {
      this.vibrate(40);
      this.flash('warn', `${shipmentId} · Ya escaneado hoy.`);
      return;
    }

    this.locked = true;
    if (this.scanner) this.scanner.pause();
    this.vibrate([40, 60, 40]);
    this.resolveSurplus(shipmentId);
  }

  renderSurplusLoading(shipmentId) {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <div class="step-progress">Contenedor Cerrado</div>
        </div>
        <h1 class="step-question">Consultando ${shipmentId}…</h1>
        <div class="step-support">Un momento…</div>
      </div>
    `;
  }

  /**
   * Busca el shipment en el resto del catálogo ya cargado (¿a qué HU
   * pertenece, si a alguno?) — sin llamada nueva, es el mismo array que ya
   * se usó para resolver el HU actual. Con resultado -> sobrante ubicable
   * (renderMisplaced). Sin resultado -> sin match en catálogo
   * (renderOutOfCatalog). No hace falta chequear si "en realidad"
   * pertenece al HU actual: si perteneciera, ya habría quedado en
   * pending/handled al resolver el HU, porque ambos leen el mismo
   * snapshot.
   */
  async resolveSurplus(shipmentId) {
    this.renderSurplusLoading(shipmentId);
    let matches;
    try {
      const catalog = await this.ensureCatalog();
      matches = catalog.filter((r) => r.SHIPMENT_ID === shipmentId);
    } catch (e) {
      this.locked = false;
      this.flash('error', `No se pudo consultar ${shipmentId}: ${e.message}`);
      this.renderLoop();
      return;
    }

    const match = matches[0];
    if (match) {
      this.renderMisplaced(shipmentId, { hu: String(match.HU) });
    } else {
      this.renderOutOfCatalog(shipmentId);
    }
  }

  /**
   * Saca el shipment de pending DE INMEDIATO (antes del await) para que un
   * doble escaneo rapidísimo del mismo ID no dispare dos guardados — pero
   * sin bloquear el guardado de OTRO shipment distinto mientras este está
   * en vuelo (por eso no hay un flag booleano único como en las pantallas
   * de detalle). El guardado real ocurre en segundo plano; la UI ya se
   * actualizó de forma optimista.
   */
  async saveMatch(shipmentId) {
    if (!this.pending.has(shipmentId)) return;
    this.pending.delete(shipmentId);
    this.handled.set(shipmentId, 'Encontrado');
    this.foundToday.add(shipmentId);
    this.anyRecordToday.add(shipmentId);
    this.flash('ok', `${shipmentId} · Follow`);
    if (this.pendingToggleEl) {
      this.pendingToggleEl.textContent = `${this.handled.size} / ${this.total} encontrados · ${this.pending.size} faltantes`;
    }
    this.renderPendingPanel();

    if (this.onScan) {
      try {
        await this.onScan({
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Encontrado',
          detalle: '',
        });
      } catch (e) {
        DebugConsole.log(`Contenedor Cerrado: error al guardar ${shipmentId}: ${e.message}`, 'error');
      }
    }
  }

  /* ====================================================================== */
  /* Sobrante que SÍ se localizó en el catálogo, pero en otro HU           */
  /* ====================================================================== */

  renderMisplaced(shipmentId, elsewhere) {
    const tmsUrl = `https://tms.adminml.com/fos/shipment/details/${encodeURIComponent(shipmentId)}`;
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Sobrante — otro contenedor</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${shipmentId}</div>
          <div class="driver-shipment-row">
            <span class="driver-badge driver-badge-out">Pertenece al HU ${elsewhere.hu}</span>
          </div>
        </div>
        <a href="${tmsUrl}" class="btn btn-secondary btn-block ext-open-link" style="margin: 12px 0; display: block; text-align: center; text-decoration: none;">Corroborar en TMS</a>
        <h1 class="step-question">¿Ya lo colocaste en el contenedor correcto?</h1>
        <div class="driver-status-actions">
          <button type="button" class="driver-status-btn driver-status-btn-ok">Sí, ya lo coloqué</button>
          <button type="button" class="driver-status-btn driver-status-btn-divergencia">No todavía</button>
        </div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });
    this.container.querySelector('.driver-status-btn-ok').addEventListener('click', () => {
      this.saveMisplaced(shipmentId, elsewhere, true);
    });
    this.container.querySelector('.driver-status-btn-divergencia').addEventListener('click', () => {
      this.saveMisplaced(shipmentId, elsewhere, false);
    });
  }

  async saveMisplaced(shipmentId, elsewhere, alreadyRelocated) {
    if (this.savingMisplaced) return;
    this.savingMisplaced = true;
    try {
      if (this.onScan) {
        await this.onScan(alreadyRelocated ? {
          hu: elsewhere.hu,
          shipment_id: shipmentId,
          estado: 'Encontrado',
          detalle: `Reubicado desde HU ${this.hu}`,
        } : {
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - pendiente reubicar',
          detalle: `Pertenece al HU ${elsewhere.hu}`,
        });
      }
      if (alreadyRelocated) this.foundToday.add(shipmentId);
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingMisplaced = false;
    }
  }

  /* ====================================================================== */
  /* Sin match en el catálogo: clasificar (Correcto / Missort probable /   */
  /* realmente no contenerizado) antes de decidir la acción                 */
  /* ====================================================================== */

  /**
   * Mismo razonamiento que en Premissort (ver PremissortSession.
   * renderOutOfCatalog): el catálogo viene de una Google Sheet conectada a
   * BigQuery con posible desfase, así que no encontrar el shipment no
   * prueba nada por sí solo — puede ser una falsa alarma (sí pertenece a
   * este HU), un Missort real en otro contenedor que el catálogo no
   * refleja todavía, o de verdad no contenerizado.
   */
  renderOutOfCatalog(shipmentId) {
    const tmsUrl = `https://tms.adminml.com/fos/shipment/details/${encodeURIComponent(shipmentId)}`;
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Sobrante — sin match en catálogo</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${shipmentId}</div>
          <div class="driver-shipment-row">
            <span class="driver-badge driver-badge-out">No aparece en el catálogo</span>
          </div>
        </div>
        <a href="${tmsUrl}" class="btn btn-secondary btn-block ext-open-link" style="margin: 12px 0; display: block; text-align: center; text-decoration: none;">Corroborar en TMS</a>
        <div class="step-support">El catálogo puede tener unos segundos de desfase — puede ser una falsa alarma (sí pertenece aquí), un Missort real (está en otro contenedor) que aún no se refleja, o de verdad no contenerizado.</div>
        <h1 class="step-question">¿Qué es este paquete?</h1>
        <div class="choice-options"></div>
      </div>
    `;

    const options = this.container.querySelector('.choice-options');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });

    const correctBtn = document.createElement('button');
    correctBtn.type = 'button';
    correctBtn.className = 'choice-btn';
    correctBtn.textContent = 'Correcto — sí pertenece aquí';
    correctBtn.addEventListener('click', () => this.saveCorrectHere(shipmentId));
    options.appendChild(correctBtn);

    const missortBtn = document.createElement('button');
    missortBtn.type = 'button';
    missortBtn.className = 'choice-btn';
    missortBtn.textContent = 'Missort — está en otro contenedor';
    missortBtn.addEventListener('click', () => this.saveMissortProbable(shipmentId));
    options.appendChild(missortBtn);

    // "No contenerizado" ya es un paso final (a diferencia de Correcto/
    // Missort, no lleva a otra pantalla) — un solo botón, sin preguntar
    // por una acción/canalización específica.
    const outBtn = document.createElement('button');
    outBtn.type = 'button';
    outBtn.className = 'choice-btn';
    outBtn.textContent = 'Fuera de contenedor';
    outBtn.addEventListener('click', () => this.saveOutOfCatalog(shipmentId));
    options.appendChild(outBtn);
  }

  /** Falsa alarma por desfase del catálogo — el operador confirma que sí pertenece a este HU. Mismo resultado que un match normal (saveMatch), pero este shipment nunca estuvo en pending. */
  async saveCorrectHere(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      this.handled.set(shipmentId, 'Encontrado');
      this.foundToday.add(shipmentId);
      this.anyRecordToday.add(shipmentId);
      this.flash('ok', `${shipmentId} · Follow`);
      if (this.onScan) {
        try {
          await this.onScan({
            hu: this.hu,
            shipment_id: shipmentId,
            estado: 'Encontrado',
            detalle: 'Confirmado en este HU — no aparecía en el catálogo (posible desfase de la sheet conectada)',
          });
        } catch (e) {
          DebugConsole.log(`Contenedor Cerrado: error al guardar ${shipmentId}: ${e.message}`, 'error');
        }
      }
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  /** El operador ya sabe/observó que está en otro contenedor — se marca pendiente de reubicar aunque el catálogo no diga cuál. */
  async saveMissortProbable(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      if (this.onScan) {
        await this.onScan({
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - pendiente reubicar',
          detalle: 'Missort — no aparece aún en el catálogo (posible desfase de la sheet conectada)',
        });
      }
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  async saveOutOfCatalog(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      if (this.onScan) {
        await this.onScan({
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - no contenerizado',
          detalle: 'Fuera de contenedor',
        });
      }
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (this.flashEl) {
      const cls = kind === 'ok' ? 'active-ok' : (kind === 'error' ? 'active-error' : '');
      if (cls) {
        this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
        this.flashEl.classList.add(cls);
        setTimeout(() => {
          if (this.flashEl) {
            this.flashEl.classList.remove(cls);
            this.flashEl.innerHTML = '';
          }
        }, 550);
      }
    }
    setTimeout(() => {
      if (!this.supportEl) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = this.inManualMode
        ? 'Escribe el Shipment ID y presiona Enter.'
        : (this.loopHint || 'Escaneando... apunta la cámara al shipment.');
    }, 900);
  }
}

/**
 * Barredura — escaneo continuo de shipments en un lugar fijo por sesión
 * (ej. andén, zona; se pregunta una vez y queda fijo hasta que se cambie
 * a mano con "Cambiar", igual que la doca en Pre-Missort), comparando
 * cada shipment contra el catálogo catalogo_barredura (Shipment_ID →
 * fecha_inbound/hub_status/ultimo_nodo/estatus/subestatus):
 *   - En catálogo: guarda directo con esos datos + los días en sitio
 *     calculados desde fecha_inbound. Si el subestatus es "on_hold",
 *     alerta que el paquete requiere auditoría fiscal con LP y lo guarda
 *     con ese caso automáticamente.
 *   - Fuera de catálogo: pide revisar Sauron (link directo al shipment) y
 *     elegir un caso (Sin recepción / Despachado / Con estatus BPP /
 *     Missort / Otro).
 * La barredura funciona igual sin catálogo publicado (o con uno viejo) —
 * solo avisa una vez al abrir el log, no bloquea el escaneo. No se puede
 * repetir un ID en un rango de 16h — la deduplicación es global: al abrir
 * el log se leen los registros de barredura_master (+ la cola local) de
 * las últimas 16h, y esos IDs quedan bloqueados desde el arranque aunque
 * sean de otra sesión/dispositivo.
 */
class BarreduraSession {
  static DEDUP_WINDOW_MS = 16 * 60 * 60 * 1000;
  static CATALOG_STALE_MS = 12 * 60 * 60 * 1000;

  static CASO_OPTIONS = ['Sin recepción', 'Despachado', 'Con estatus BPP', 'Missort', 'Otro'];

  static ZONA_OPTIONS = ['Sorting Large', 'Sorting GM1', 'Sorting GM2', 'Inbound FM', 'Inbound LH', 'Mesa de Ayuda', 'Inventarios', 'Staging', 'Otro'];

  // A diferencia del "Otro" de ZONA_OPTIONS (texto libre), el "Otro" de
  // tipo de ruta no abre un input manual — se guarda tal cual como valor.
  static TIPO_RUTA_OPTIONS = ['V3', 'Otro'];

  constructor(opts = {}) {
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.onWarning = opts.onWarning;
    this.initialLugar = opts.initialLugar || null;
    this.lugar = null;
    this.catalogIndex = opts.catalogIndex || {};
    this.catalogGeneratedAt = opts.catalogGeneratedAt || null;

    // Índice inverso HU -> [shipment_id, ...] para el escaneo de HU (guarda
    // todos los shipments ligados a un HU de una sola vez). Se deriva del
    // mismo catalogIndex — cada fila del catálogo trae su propio HU.
    this.huIndex = {};
    Object.entries(this.catalogIndex).forEach(([shipmentId, meta]) => {
      const hu = meta && meta.hu;
      if (!hu) return;
      if (!this.huIndex[hu]) this.huIndex[hu] = [];
      this.huIndex[hu].push(shipmentId);
    });

    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.inManualMode = false;
    this.count = 0;

    // Dedup 12h global: shipment_id -> ts ISO del escaneo más reciente.
    this.recentMap = new Map();
    (opts.recentRecords || []).forEach((r) => {
      if (!r || !r.shipment_id || !r.ts) return;
      const id = String(r.shipment_id);
      const prev = this.recentMap.get(id);
      if (!prev || Date.parse(r.ts) > Date.parse(prev)) this.recentMap.set(id, r.ts);
    });
  }

  render(containerId) {
    this.container = document.getElementById(containerId);
    this.warnIfCatalogStale();
    if (this.initialLugar) {
      this.lugar = this.initialLugar;
      this.renderLoop();
    } else {
      this.pickLugar();
    }
  }

  /**
   * Aviso único (no bloqueante) si no hay catálogo publicado o si tiene
   * más de 12h de antigüedad — la barredura sigue funcionando igual.
   */
  warnIfCatalogStale() {
    if (this._catalogWarningShown || !this.onWarning) return;
    this._catalogWarningShown = true;
    if (!this.catalogGeneratedAt) {
      this.onWarning('No hay catálogo de Barredura publicado — puedes seguir escaneando sin comparar contra inventario.');
      return;
    }
    const ageMs = Date.now() - this.catalogGeneratedAt.getTime();
    if (ageMs > BarreduraSession.CATALOG_STALE_MS) {
      this.onWarning('El catálogo de Barredura tiene más de 12 horas de antigüedad.');
    }
  }

  destroy() {
    this.stopScanner();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /**
   * Duplicado si el ID se escaneó en las últimas 16h (por cualquiera). Se
   * evalúa contra la marca de tiempo real para no bloquear de más si la
   * sesión dura mucho.
   */
  isDuplicate(id) {
    const ts = this.recentMap.get(id);
    if (!ts) return false;
    return (Date.now() - Date.parse(ts)) < BarreduraSession.DEDUP_WINDOW_MS;
  }

  /* ====================================================================== */
  /* Lugar: texto libre, una vez por sesión (no hay catálogo de lugares)    */
  /* ====================================================================== */

  pickLugar() {
    this.stopScanner();
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Atrás">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Barredura</div>
        </div>
        <h1 class="step-question">¿En qué zona estás?</h1>
        <div class="choice-options"></div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    const options = this.container.querySelector('.choice-options');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      if (this.lugar) this.renderLoop();
      else if (this.onExit) this.onExit();
    });

    BarreduraSession.ZONA_OPTIONS.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (opt === 'Otro') this.pickLugarOtro();
        else this.setLugar(opt);
      });
      options.appendChild(btn);
    });
  }

  /**
   * Sub-enum de "Staging": tipo de ruta — solo aplica al escanear un HU
   * (ver processHu), NO a un shipment suelto. Se pregunta DESPUÉS de
   * escanear el HU (no al elegir la zona), y el resultado se aplica a
   * TODOS los shipment_id ligados a ese HU de una sola vez. A diferencia
   * del "Otro" de zona, el "Otro" aquí no abre entrada manual — se guarda
   * literal. Se combina con "Staging" solo para ese lote de registros
   * (this.lugar de la sesión sigue siendo "Staging"). onPicked recibe el
   * lugarForRecord resultante ("Staging - V3" / "Staging - Otro").
   */
  pickTipoRutaForScan(label, onPicked) {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Staging — ${label}</div>
        </div>
        <h1 class="step-question">¿Cuál es el tipo de ruta?</h1>
        <div class="choice-options"></div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    const options = this.container.querySelector('.choice-options');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });

    BarreduraSession.TIPO_RUTA_OPTIONS.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        this.locked = false;
        onPicked(`Staging - ${opt}`);
      });
      options.appendChild(btn);
    });
  }

  pickLugarOtro() {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Atrás">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Barredura — otra zona</div>
        </div>
        <h1 class="step-question">Describe la zona</h1>
        <div class="step-input-wrap">
          <input type="text" class="step-input barredura-lugar-input" placeholder="Ej. PATIO 3" />
        </div>
        <div class="step-support">Solo mayúsculas. Presiona Enter para continuar.</div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.pickLugar();
    });

    const input = this.container.querySelector('.barredura-lugar-input');
    input.addEventListener('input', () => {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.toUpperCase();
      input.setSelectionRange(start, end);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = input.value.trim().toUpperCase();
      if (!val) {
        this.supportEl.textContent = 'Escribe una zona para continuar.';
        this.supportEl.classList.add('error');
        return;
      }
      this.setLugar(val);
    });

    setTimeout(() => input.focus(), 60);
  }

  setLugar(lugar) {
    this.lugar = lugar;
    this.initialLugar = lugar;
    this.renderLoop();
  }

  /* ====================================================================== */
  /* Loop de escaneo                                                       */
  /* ====================================================================== */

  renderLoop() {
    this.stopScanner();
    this.locked = false;
    this.inManualMode = false;
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera
      ? 'Escaneando... apunta la cámara al shipment.'
      : '';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Barredura</div>
        </div>
        <div class="session-pill">
          <div class="session-pill-info">Lugar: ${this.lugar}</div>
          <button type="button" class="btn btn-secondary session-change-btn">Cambiar</button>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el Shipment o HU</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
        <div class="session-counter">${this.count} escaneados en esta sesión</div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.counterEl = this.container.querySelector('.session-counter');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });
    this.container.querySelector('.session-change-btn').addEventListener('click', () => {
      this.pickLugar();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startCamera();
    } else {
      // Hidden HID input
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      // Scan area
      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        hidInput.value = '';
        const isDup = this.isDuplicate(raw);
        lastCodeEl.textContent = isDup ? `${raw} · ya escaneado` : raw;
        lastCodeEl.className = 'hh-last-code visible';
        lastCodeEl.classList.toggle('duplicate', isDup);
        this.submitScanValue(raw, hidInput);
      });

      armHid();

      // Floating manual button
      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      // Bottom-sheet modal
      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Shipment ID</p>
          <input type="text" class="hh-manual-input" placeholder="Shipment ID" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim().toUpperCase();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.submitScanValue(val, hidInput);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  submitScanValue(rawText, input) {
    const resolved = this.resolveScan(rawText);
    if (!resolved) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      if (input) input.value = '';
      return;
    }

    if (resolved.type === 'hu') {
      // El único caso que navega (reemplaza el loop) es Staging, que pide
      // tipo de ruta antes de guardar. El resto (HU no en catálogo, o
      // guardado silencioso en bloque de todos sus shipments) se queda en
      // el loop.
      const willNavigate = this.lugar === 'Staging';
      this.processHu(resolved.value);
      if (!willNavigate && input && document.body.contains(input)) {
        input.value = '';
        input.focus();
      }
      return;
    }

    // Si va a navegar (duplicado no, fuera de catálogo sí) no limpiar el
    // input todavía — se limpia al volver al loop. El tipo de ruta de
    // Staging no aplica a un shipment suelto (solo a HU).
    const willNavigate = !this.isDuplicate(resolved.value) && !this.catalogIndex[resolved.value];
    this.processShipment(resolved.value);
    if (!willNavigate && input && document.body.contains(input)) {
      input.value = '';
      input.focus();
    }
  }

  async startCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  /**
   * Resuelve un código crudo a shipment o HU. A diferencia de
   * ScanParser.parse(raw, 'shipment') (que rechaza un HU por tipo
   * incorrecto), Barredura acepta ambos desde el mismo lector — el QR de
   * HU trae legacy_id y se distingue así del shipment (id/código plano).
   */
  resolveScan(rawText) {
    const extracted = ScanParser.extract(rawText);
    if (!extracted) return null;
    const { value, kind } = extracted;
    if (!ScanParser.ID_PATTERN.test(value)) return null;
    return { type: kind === 'hu' ? 'hu' : 'shipment', value };
  }

  handleScan(rawText) {
    if (this.locked) return;
    const resolved = this.resolveScan(rawText);
    if (!resolved) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      return;
    }
    if (resolved.type === 'hu') this.processHu(resolved.value);
    else this.processShipment(resolved.value);
  }

  enterManualEntry() {
    if (this.scanner) this.scanner.pause();
    this.inManualMode = true;

    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el Shipment ID" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el Shipment ID y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const resolved = this.resolveScan(input.value);
      if (!resolved) {
        this.supportEl.textContent = 'Shipment inválido. Verifica el número e intenta de nuevo.';
        this.supportEl.classList.add('error');
        return;
      }
      if (resolved.type === 'hu') this.processHu(resolved.value);
      else this.processShipment(resolved.value);
      input.value = '';
    });

    setTimeout(() => input.focus(), 60);
  }

  /**
   * Duplicado en 12h -> aviso, no agrega. En catálogo -> guarda directo
   * con sus datos (hub_status "dispatched" se guarda automáticamente con
   * caso "Despachado", sin preguntar nada). Fuera de catálogo -> pide
   * revisar Sauron y elegir un caso antes de guardar.
   *
   * El tipo de ruta de "Staging" NO aplica aquí — solo se pregunta al
   * escanear un HU (ver processHu). Un shipment suelto sigue el flujo
   * normal sin importar la zona.
   */
  processShipment(shipmentId) {
    const id = String(shipmentId);

    if (this.isDuplicate(id)) {
      this.vibrate(40);
      this.flash('warn', `${id} · Ya escaneado en las últimas 16h.`);
      return;
    }

    this.continueProcessShipment(id, this.lugar);
  }

  /**
   * Resto del flujo de processShipment. El tipo de ruta de "Staging" no
   * aplica a un shipment suelto (solo a HU, ver processHu), así que
   * lugarForRecord aquí siempre es this.lugar tal cual.
   */
  async continueProcessShipment(id, lugarForRecord) {
    const meta = this.catalogIndex[id];
    if (meta) {
      this.vibrate(60);
      const isDispatched = (meta.hub_status || '').trim().toLowerCase() === 'dispatched';
      await this.saveFound(id, meta, isDispatched ? 'Despachado' : '', lugarForRecord);
      return;
    }

    this.locked = true;
    if (this.scanner) this.scanner.pause();
    this.vibrate([40, 60, 40]);
    this.renderNotFound(id, lugarForRecord);
  }

  /**
   * Escaneo de HU (QR con legacy_id): guarda TODOS los shipment_id ligados
   * a ese HU en el catálogo de una sola vez (total_shipments_por_hu). Cada
   * shipment bajo un mismo HU comparte el mismo hub_status (así lo
   * garantiza el sistema origen), así que no hace falta revisar cada uno
   * por separado para decidir Despachado vs Backlog esperado — aun así se
   * lee el hub_status de cada fila individualmente, más robusto y sin
   * costo extra.
   *
   * Si el HU no aparece en el catálogo no hay ningún shipment_id que
   * "adivinar": se le pide al operador escanear el Shipment ID
   * directamente (ese sí sigue el flujo normal de fuera de catálogo).
   */
  processHu(hu) {
    const shipmentIds = this.huIndex[hu] || [];

    if (shipmentIds.length === 0) {
      this.vibrate(40);
      this.flash('error', `HU ${hu} no está en catálogo — escanea el Shipment ID directamente.`);
      return;
    }

    const pendingIds = shipmentIds.filter((sid) => !this.isDuplicate(sid));
    if (pendingIds.length === 0) {
      this.vibrate(40);
      this.flash('error', `HU ${hu} · Ya escaneado en las últimas 16h.`);
      return;
    }

    // Calcular despachados de forma sincrónica para el flash inmediato.
    const dispatchedCount = pendingIds.filter(
      (sid) => (this.catalogIndex[sid]?.hub_status || '').trim().toLowerCase() === 'dispatched'
    ).length;
    const dispatchedNote = dispatchedCount > 0 ? ` · ${dispatchedCount} despachado(s)` : '';
    this.vibrate(60);
    // Flash inmediato (sincrónico) — no espera el guardado async.
    this.flash(
      dispatchedCount > 0 ? 'error' : 'ok',
      `HU ${hu} · ${pendingIds.length} shipment(s)${dispatchedNote}`
    );

    if (this.lugar === 'Staging') {
      this.locked = true;
      if (this.scanner) this.scanner.pause();
      this.pickTipoRutaForScan(hu, async (lugarForRecord) => {
        await this.saveHuShipments(hu, pendingIds, lugarForRecord);
        this.renderLoop();
      });
      return;
    }

    this.saveHuShipments(hu, pendingIds, this.lugar);
  }

  async saveHuShipments(hu, shipmentIds, lugarForRecord = this.lugar) {
    for (const sid of shipmentIds) {
      const meta = this.catalogIndex[sid];
      const isDispatched = (meta.hub_status || '').trim().toLowerCase() === 'dispatched';
      await this.saveFound(sid, meta, isDispatched ? 'Despachado' : '', lugarForRecord, { silent: true });
    }
  }

  /** Días transcurridos desde fecha_inbound hasta hoy (o '' si no hay fecha válida). */
  /**
   * Parsea fecha_inbound tolerando los formatos reales que suele traer un
   * catálogo exportado de Excel/Sheets:
   *   - DD/MM/YYYY o DD/MM/YY, separador "/" o "-", hora opcional en 24h
   *     o con AM/PM (ej. "4/08/2026 22:18:41", "04-08-26 10:18 PM").
   *   - Fecha serial de Excel (número puro, ej. "46247"): pasa cuando la
   *     celda quedó en formato "General" en vez de fecha al exportar.
   *   - ISO (YYYY-MM-DD…): sin ambigüedad día/mes, se deja tal cual.
   * DD/MM es la convención esperada (México) — si el día quedara >12 en
   * la posición de mes (o viceversa), se corrige solo porque en ese caso
   * ya no es ambiguo. Para "4/08" (ambos ≤12) no hay forma de saber con
   * certeza cuál es cuál sin el formato explícito, así que se asume DD/MM.
   * Si nada de esto reconoce el valor, se cae a Date.parse y se registra
   * en DebugConsole para poder ajustar el parser con el formato real.
   */
  parseFechaInbound(str) {
    const s = String(str || '').trim();
    if (!s) return NaN;

    // Fecha serial de Excel: día 0 = 1899-12-30 (incluye el bug histórico
    // del año bisiesto 1900 que Excel también arrastra, por eso -25569
    // y no -25567 — mismo ajuste que usa Google Sheets/Excel entre sí).
    if (/^\d{4,6}(\.\d+)?$/.test(s)) {
      const serial = Number(s);
      const ms = Math.round((serial - 25569) * 86400 * 1000);
      if (!Number.isNaN(ms) && ms > 0) return ms;
    }

    const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?)?$/);
    if (m) {
      const [, a, b, yearStr, hhStr, minStr, ssStr, ampm] = m;
      let day = Number(a);
      let month = Number(b);
      // Si vino al revés (MM/DD) y solo esa lectura es válida, se corrige.
      if (month > 12 && day <= 12) {
        [day, month] = [month, day];
      }
      const year = yearStr.length === 2 ? 2000 + Number(yearStr) : Number(yearStr);
      let hours = Number(hhStr || 0);
      if (ampm) {
        const isPM = /p/i.test(ampm);
        if (isPM && hours < 12) hours += 12;
        if (!isPM && hours === 12) hours = 0;
      }
      const d = new Date(year, month - 1, day, hours, Number(minStr || 0), Number(ssStr || 0));
      if (!Number.isNaN(d.getTime())) return d.getTime();
    }

    const fallback = Date.parse(s);
    if (Number.isNaN(fallback)) {
      DebugConsole.log(`fecha_inbound no reconocida, dias_en_sitio quedará vacío: "${s}"`, 'warn');
    }
    return fallback;
  }

  /**
   * Días en sitio por DÍA CALENDARIO, no por horas exactas — si solo se
   * restaran timestamps, un fecha_inbound con hora más tarde que la del
   * escaneo (aunque sea el mismo día) daba un número negativo y el campo
   * quedaba vacío (parecía un bug). Cualquier resultado negativo (mismo
   * día con hora posterior, o una fecha futura por error de captura) se
   * muestra como 0 — más claro para el operador que dejarlo en blanco.
   */
  diasEnSitio(fechaInbound) {
    const parsed = this.parseFechaInbound(fechaInbound);
    if (!fechaInbound || Number.isNaN(parsed)) return '';
    const inbound = new Date(parsed);
    const inboundDay = new Date(inbound.getFullYear(), inbound.getMonth(), inbound.getDate());
    const today = new Date();
    const todayDay = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const days = Math.round((todayDay - inboundDay) / (24 * 60 * 60 * 1000));
    return Math.max(days, 0);
  }

  async saveFound(id, meta, caso = '', lugarForRecord = this.lugar, { silent = false } = {}) {
    this.recentMap.set(id, new Date().toISOString());
    // Aviso visual: despachado se marca en rojo aunque no sea un error —
    // el flujo sigue igual (Backlog esperado, sin pedir nada al operador),
    // solo cambia el color para que salte a la vista.
    if (!silent) {
      this.flash(
        caso === 'Despachado' ? 'error' : 'ok',
        caso ? `${id} · ${caso}` : `${id} · Backlog esperado`
      );
    }
    if (this.onScan) {
      await this.onScan({
        shipment_id: id,
        hu: meta.hu || '',
        lugar: lugarForRecord,
        estado: 'Backlog esperado',
        dias_en_sitio: this.diasEnSitio(meta.fecha_inbound),
        hub_status: meta.hub_status || '',
        usuario_dispatch: meta.usuario_dispatch || '',
        logistic_center: meta.logistic_center || '',
        fecha_ultimo_estado: meta.fecha_ultimo_estado || '',
        total_shipments_por_hu: meta.total_shipments_por_hu || '',
        caso,
      });
    }
    this.count += 1;
    if (this.counterEl) this.counterEl.textContent = `${this.count} escaneados en esta sesión`;
  }

  /* ====================================================================== */
  /* Fuera de catálogo: Sauron + caso (enum + "Otro" texto libre)           */
  /* ====================================================================== */

  renderNotFound(id, lugarForRecord = this.lugar) {
    const sauronUrl = `https://shipping-bo.adminml.com/sauron/shipments/shipment/${encodeURIComponent(id)}`;
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Fuera de catálogo</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${id}</div>
          <div class="driver-shipment-row">
            <span class="driver-badge driver-badge-out">No está en el catálogo</span>
          </div>
        </div>
        <a href="${sauronUrl}" class="btn btn-secondary btn-block ext-open-link" style="margin: 12px 0; display: block; text-align: center; text-decoration: none;">Ver en Sauron</a>
        <h1 class="step-question">¿Cuál es el caso?</h1>
        <div class="choice-options"></div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    const options = this.container.querySelector('.choice-options');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });

    BarreduraSession.CASO_OPTIONS.forEach((opt) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => {
        if (opt === 'Otro') this.renderNotFoundOtro(id, lugarForRecord);
        else this.saveNotFound(id, opt, lugarForRecord);
      });
      options.appendChild(btn);
    });
  }

  renderNotFoundOtro(id, lugarForRecord = this.lugar) {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Atrás">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Fuera de catálogo — otro caso</div>
        </div>
        <h1 class="step-question">Escribe el caso (${id})</h1>
        <div class="step-input-wrap">
          <input type="text" class="step-input barredura-caso-input" placeholder="CASO" />
        </div>
        <div class="step-support">Solo mayúsculas. Presiona Enter para guardar.</div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.renderNotFound(id, lugarForRecord);
    });

    const input = this.container.querySelector('.barredura-caso-input');
    input.addEventListener('input', () => {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.toUpperCase();
      input.setSelectionRange(start, end);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = input.value.trim().toUpperCase();
      if (!val) {
        this.supportEl.textContent = 'Escribe un caso para continuar.';
        this.supportEl.classList.add('error');
        return;
      }
      this.saveNotFound(id, val, lugarForRecord);
    });
    setTimeout(() => input.focus(), 60);
  }

  async saveNotFound(id, caso, lugarForRecord = this.lugar) {
    // Guard contra doble toque: un segundo click rápido en la misma
    // opción (o Enter dos veces en "Otro") duplicaba el registro mientras
    // el primer guardado todavía no terminaba.
    if (this.savingCaso) return;
    this.savingCaso = true;

    this.recentMap.set(id, new Date().toISOString());
    if (this.onScan) {
      await this.onScan({
        shipment_id: id,
        hu: '',
        lugar: lugarForRecord,
        estado: 'Backlog inesperado',
        dias_en_sitio: '',
        hub_status: '',
        // usuario_dispatch queda vacío: no hay dato de catálogo para un
        // shipment fuera de catálogo. Se puede llenar después a mano desde
        // el dashboard (ver nota en consolidado_auditoria.html).
        usuario_dispatch: '',
        logistic_center: '',
        fecha_ultimo_estado: '',
        total_shipments_por_hu: '',
        caso,
      });
    }
    this.count += 1;
    this.savingCaso = false;
    this.locked = false;
    this.renderLoop();
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (this.flashEl) {
      const cls = kind === 'ok' ? 'active-ok' : (kind === 'error' ? 'active-error' : '');
      if (cls) {
        this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
        this.flashEl.classList.add(cls);
        setTimeout(() => {
          if (this.flashEl) {
            this.flashEl.classList.remove(cls);
            this.flashEl.innerHTML = '';
          }
        }, 550);
      }
    }
    setTimeout(() => {
      if (!this.supportEl) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = this.inManualMode
        ? 'Escribe el Shipment ID y presiona Enter.'
        : (this.loopHint || 'Escaneando... apunta la cámara al shipment.');
    }, 900);
  }
}

/**
 * AuditoriaHVSession — escaneo de UN shipment (o QR de retorno) a la vez
 * contra el catálogo AUDITORIA_HV (Google Sheets, ver AUDITORIA_HV_SHEET_RANGE
 * y GridClient.loadAuditoriaHVCatalog). A diferencia de BarreduraSession no
 * hay "lugar" fijo de sesión — cada escaneo es independiente.
 */
class AuditoriaHVSession {
  static CASO_OPTIONS = ['Vacío', 'Piezas faltantes', 'Sin divergencias'];

  // PLACEHOLDER: sin ejemplo real de SHP_RETURN_QR_ID todavía — ajustar
  // este regex en cuanto se tenga un caso real de escaneo. Basado en el
  // único ejemplo dado por el usuario: K0000052742MLB (1 letra + 10
  // dígitos + 3 letras).
  static RETURN_QR_PATTERN = /^[A-Z]\d{10}[A-Z]{3}$/i;

  constructor(opts = {}) {
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.catalog = Array.isArray(opts.catalog) ? opts.catalog : [];

    this.catalogById = {};
    this.catalogByReturnQr = {};
    this.catalog.forEach((row) => {
      if (row.ID) this.catalogById[row.ID] = row;
      if (row.SHP_RETURN_QR_ID) this.catalogByReturnQr[row.SHP_RETURN_QR_ID.toUpperCase()] = row;
    });

    // Dedup de On_Hold: un shipment fuera de catálogo confirmado como
    // On_Hold solo se captura una vez PARA SIEMPRE, sin importar el día
    // (ver CapturaApp.loadRecentAuditoriaHV) — un match en catálogo SÍ
    // puede repetirse (una misma Rx puede cubrir varios paquetes), así que
    // el dedup solo aplica a la rama "fuera de catálogo".
    this.onHoldCaptured = new Set(opts.onHoldCaptured || []);

    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.inManualMode = false;
    this.count = 0;

    // Última foto tomada en esta sesión (cualquiera de las dos ramas) —
    // permite ofrecer "Reutilizar última foto" en la rama fuera de catálogo.
    this.lastPhotoDataUrl = null;
  }

  render(containerId) {
    this.container = document.getElementById(containerId);
    this.renderLoop();
  }

  destroy() {
    this.stopScanner();
    this.stopPhotoCamera();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  stopPhotoCamera() {
    if (this.photoCamera) {
      this.photoCamera.stop();
      this.photoCamera = null;
    }
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /* ====================================================================== */
  /* Loop de escaneo                                                       */
  /* ====================================================================== */

  renderLoop() {
    this.stopScanner();
    this.stopPhotoCamera();
    this.locked = false;
    this.inManualMode = false;
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera
      ? 'Escaneando... apunta la cámara al shipment o al QR de retorno.'
      : '';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Auditoría HV</div>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el Shipment o QR de retorno</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
        <div class="session-counter">${this.count} escaneados en esta sesión</div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.counterEl = this.container.querySelector('.session-counter');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startCamera();
    } else {
      // Hidden HID input — mismo patrón "escaneo sin teclado" que
      // BarreduraSession/PremissortSession: el input real queda oculto
      // (inputmode:'none') y solo se arma a modo texto en la ventana justo
      // después del blur, para que el lector HID pueda escribir sin que el
      // teclado en pantalla aparezca en dispositivos táctiles.
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        hidInput.value = '';
        lastCodeEl.textContent = raw;
        lastCodeEl.className = 'hh-last-code visible';
        this.handleScan(raw);
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Shipment o QR de retorno</p>
          <input type="text" class="hh-manual-input" placeholder="Shipment o QR de retorno" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.handleScan(val);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  async startCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  enterManualEntry() {
    if (this.scanner) this.scanner.pause();
    this.inManualMode = true;

    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el Shipment o QR de retorno" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el código y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      this.handleScan(val);
      input.value = '';
    });

    setTimeout(() => input.focus(), 60);
  }

  /**
   * Resuelve un código escaneado contra el catálogo: primero como
   * Shipment ID numérico (catalogById), y si no matchea o no se encuentra
   * ahí, como QR de retorno (catalogByReturnQr). Si se resuelve vía QR de
   * retorno, el shipment_id real a guardar es el ID de esa misma fila —
   * nunca el código del QR de retorno.
   */
  resolveScan(rawText) {
    const extracted = ScanParser.extract(rawText);
    const raw = extracted ? extracted.value : String(rawText || '').trim().toUpperCase();
    if (!raw) return null;

    if (ScanParser.ID_PATTERN.test(raw)) {
      const row = this.catalogById[raw];
      if (row) return { row, code: raw };
      // No está por ID: puede seguir siendo un QR de retorno (poco probable
      // si matchea el patrón numérico, pero no hay razón para no intentarlo).
    }

    if (AuditoriaHVSession.RETURN_QR_PATTERN.test(raw)) {
      const row = this.catalogByReturnQr[raw.toUpperCase()];
      if (row) return { row, code: raw };
    }
