        <input type="text" class="hh-manual-input"
               placeholder="${field.placeholder || 'Escribe el código'}"
               autocomplete="off" autocorrect="off" spellcheck="false"
               ${field.idType === 'doca' ? 'inputmode="numeric"' : ''}/>
        <div class="hh-manual-actions">
          <button class="hh-manual-cancel">Cancelar</button>
          <button class="hh-manual-confirm">Confirmar</button>
        </div>
      </div>`;
    this.container.appendChild(modal);

    const modalInput = modal.querySelector('.hh-manual-input');
    const openModal  = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
    const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
    const confirmModal = () => {
      const val = modalInput.value.trim();
      if (!val) return;
      hidInput.value = field.idType !== 'raw' ? val.toUpperCase() : val;
      modalInput.value = '';
      closeModal();
      this.confirmManual(field);
    };

    manualBtn.addEventListener('click', openModal);
    modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
    modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
    modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // ── Action bar: Omitir para campos opcionales ────────────────────────
    if (!field.required) {
      this.setActions([this.makeButton('Omitir', {
        icon: 'arrowRight', iconAfter: true,
        onClick: () => this.confirmManual(field),
      })]);
    } else {
      this.setActions([]);
    }
  }

  async enterScanningState(field) {
    this.stopScanner();
    this.supportEl.textContent = 'Escaneando... Apunta la cámara al código.';
    this.supportEl.classList.remove('error');

    this.scannerBody.innerHTML = `
      <div class="scanner-viewport">
        <video class="scanner-video" playsinline muted></video>
        <div class="scanner-frame"><span class="scanner-line"></span></div>
      </div>
    `;

    this.setActions([]);

    if (!ScannerEngine.isSupported()) {
      this.enterCameraUnavailable(field);
      return;
    }

    const video = this.scannerBody.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();

    try {
      await this.scanner.start(video, (text, format) => {
        this.onScanDetected(field, text, format);
      });
      this.maybeAddTorchButton();
    } catch (err) {
      this.enterCameraUnavailable(field);
    }
  }

  enterCameraUnavailable(field) {
    this.stopScanner();
    this.scannerBody.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${Icons.svg('alertCircle', { size: 48 })}</div>
        <p style="font-size: 1rem; margin-bottom: 16px;">Cámara no disponible</p>
        <p style="font-size: 0.9rem; color: var(--color-text-muted); margin-bottom: 24px;">Usa uno de los métodos alternativos para ingresar el código.</p>
      </div>
    `;

    this.supportEl.textContent = 'Cámara no disponible — selecciona una alternativa';
    this.supportEl.classList.add('error');

    const manualBtn = this.makeButton('Escribir manualmente', {
      primary: true,
      icon: 'keyboard',
      onClick: () => this.enterHandheldState(field),
    });
    const uploadBtn = this.makeButton('Escanear desde imagen', {
      icon: 'image',
      onClick: () => this.enterImageUploadState(field),
    });
    this.setActions([uploadBtn, manualBtn]);
  }

  enterImageUploadState(field) {
    this.stopScanner();
    this.supportEl.textContent = 'Carga una imagen que contenga el código QR o de barras.';
    this.supportEl.classList.remove('error');

    this.scannerBody.innerHTML = `
      <button type="button" class="photo-dropzone">
        <span>${Icons.svg('image', { size: 30 })}</span>
        <span class="photo-dropzone-label">Carga una imagen</span>
      </button>
      <input type="file" accept="image/*" class="image-input" hidden />
    `;

    const dropzone = this.scannerBody.querySelector('.photo-dropzone');
    const fileInput = this.scannerBody.querySelector('.image-input');

    dropzone.addEventListener('click', () => fileInput.click());

    const processImage = async (file) => {
      if (!file) return;
      try {
        this.supportEl.textContent = 'Analizando imagen...';
        this.supportEl.classList.remove('error');

        // Load image and try to detect barcode with ZXing
        const reader = new FileReader();
        reader.onload = async (e) => {
          const img = new Image();
          img.onload = async () => {
            try {
              if (window.ZXing) {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const scanReader = new window.ZXing.BrowserMultiFormatReader();

                // Suppress ZXing frame errors for image scanning
                const origErr = console.error;
                console.error = function(...args) {
                  const msg = args[0]?.toString?.() || '';
                  if (msg.includes('No MultiFormat') || msg.includes('NotFoundException')) return;
                  origErr.apply(console, args);
                };

                try {
                  const result = scanReader.decodeFromImageData(imgData);
                  console.error = origErr; // Restore

                  if (result) {
                    console.log('[ZXing] Barcode from image detected:', result.getText());
                    this.onScanDetected(field, result.getText(), this.mapZxingFormat(result.getBarcodeFormat()));
                    return;
                  }
                } finally {
                  console.error = origErr; // Ensure restore
                }
              }

              // No barcode found in image
              this.supportEl.textContent = 'No se detectó código en la imagen. Intenta otra o escribe manualmente.';
              this.supportEl.classList.add('error');
              setTimeout(() => {
                this.enterImageUploadState(field);
              }, 1500);
            } catch (e) {
              console.error('[Image scan]', e);
              this.supportEl.textContent = 'Error al analizar la imagen.';
              this.supportEl.classList.add('error');
              setTimeout(() => {
                this.enterImageUploadState(field);
              }, 1500);
            }
          };
          img.onerror = () => {
            this.supportEl.textContent = 'No se pudo cargar la imagen.';
            this.supportEl.classList.add('error');
          };
          img.src = e.target.result;
        };
        reader.onerror = () => {
          this.supportEl.textContent = 'Error al leer el archivo.';
          this.supportEl.classList.add('error');
        };
        reader.readAsDataURL(file);
      } catch (e) {
        console.error('[Upload image]', e);
        this.supportEl.textContent = 'Error al procesar la imagen.';
        this.supportEl.classList.add('error');
      }
    };

    fileInput.addEventListener('change', () => {
      const file = fileInput.files?.[0];
      if (file) processImage(file);
    });

    const manualBtn = this.makeButton('Escribir manualmente', {
      icon: 'keyboard',
      onClick: () => this.enterHandheldState(field),
    });
    const cameraBtn = this.makeButton('Volver al scanner', {
      primary: true,
      icon: 'scan',
      onClick: () => this.enterScanningState(field),
    });
    this.setActions([manualBtn, cameraBtn]);
  }

  mapZxingFormat(fmt) {
    const F = window.ZXing.BarcodeFormat;
    const names = {
      [F.QR_CODE]: 'qr_code', [F.EAN_13]: 'ean_13', [F.EAN_8]: 'ean_8',
      [F.UPC_A]: 'upc_a', [F.UPC_E]: 'upc_e', [F.CODE_128]: 'code_128',
      [F.CODE_39]: 'code_39', [F.CODE_93]: 'code_93', [F.CODABAR]: 'codabar',
      [F.ITF]: 'itf', [F.DATA_MATRIX]: 'data_matrix', [F.PDF_417]: 'pdf417',
      [F.AZTEC]: 'aztec',
    };
    return names[fmt] || 'unknown';
  }

  maybeAddTorchButton() {
    if (!this.scanner || !this.scanner.hasTorch()) return;
    const viewport = this.scannerBody.querySelector('.scanner-viewport');
    if (!viewport) return;
    const torchBtn = document.createElement('button');
    torchBtn.type = 'button';
    torchBtn.className = 'scanner-torch';
    torchBtn.setAttribute('aria-label', 'Linterna');
    torchBtn.innerHTML = Icons.svg('flash', { size: 20 });
    let on = false;
    torchBtn.addEventListener('click', async () => {
      on = !on;
      const ok = await this.scanner.setTorch(on);
      torchBtn.classList.toggle('active', ok && on);
    });
    viewport.appendChild(torchBtn);
  }

  onScanDetected(field, text, format) {
    if (this.scanner) this.scanner.pause();

    const parsed = ScanParser.parse(text, field.idType);
    if (!parsed) {
      this.vibrate(40);
      this.enterScanRejected(field);
      return;
    }

    this.vibrate(60);
    this.enterDetectedState(field, parsed, format);
  }

  idTypeLabel(field) {
    const labels = { hu: 'HU', shipment: 'Shipment ID', plate: 'Patente' };
    return labels[field.idType] || 'código';
  }

  enterScanRejected(field) {
    this.supportEl.textContent = `Código no reconocido. Verifica que sea el ${this.idTypeLabel(field)} correcto.`;
    this.supportEl.classList.add('error');
    setTimeout(() => {
      if (!this.scanner) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = 'Apunta la cámara al código QR o de barras.';
      this.scanner.resume();
    }, 1000);
  }

  enterDetectedState(field, text, format) {
    this.supportEl.textContent = '';
    this.supportEl.classList.remove('error');

    this.scannerBody.innerHTML = `
      <div class="scanner-result">
        <div class="scanner-result-badge">${Icons.svg('checkCircle', { size: 22 })}</div>
        <div class="scanner-result-label">Código detectado</div>
        <div class="scanner-result-value"></div>
        ${format ? `<div class="scanner-result-format">${this.formatLabel(format)}</div>` : ''}
      </div>
    `;
    this.scannerBody.querySelector('.scanner-result-value').textContent = text;

    const retryBtn = this.makeButton('Reintentar', {
      icon: 'refresh',
      onClick: () => this.enterScanningState(field),
    });
    const confirmBtn = this.makeButton(this.isLastStep ? 'Agregar Registro' : 'Confirmar', {
      primary: true,
      icon: this.isLastStep ? 'check' : 'arrowRight',
      iconAfter: true,
      onClick: () => {
        this.values[field.id] = text;
        this.stopScanner();
        this.advance();
      },
    });
    this.setActions([retryBtn, confirmBtn]);
  }


  confirmManual(field) {
    const raw = this.currentInput.value.trim();

    if (field.required && !raw) {
      this.showError('Este campo es obligatorio.');
      return;
    }

    if (!raw) {
      this.values[field.id] = '';
      this.stopScanner();
      this.advance();
      return;
    }

    const parsed = ScanParser.parse(raw, field.idType);
    if (!parsed) {
      const messages = {
        hu: 'Formato inválido. Debe ser el HU (solo dígitos).',
        shipment: 'Formato inválido. Debe ser el Shipment ID (solo dígitos).',
        plate: 'Formato inválido. Debe ser una patente válida.',
      };
      this.showError(messages[field.idType] || 'Formato inválido.');
      return;
    }

    this.values[field.id] = parsed;
    this.stopScanner();
    this.advance();
  }

  formatLabel(format) {
    const labels = {
      qr_code: 'QR', ean_13: 'EAN-13', ean_8: 'EAN-8', upc_a: 'UPC-A', upc_e: 'UPC-E',
      code_128: 'Code 128', code_39: 'Code 39', code_93: 'Code 93', codabar: 'Codabar',
      itf: 'ITF', data_matrix: 'Data Matrix', pdf417: 'PDF417', aztec: 'Aztec',
    };
    return labels[format] || format;
  }

  /* ====================================================================== */
  /* Estatus lookup field */
  /* ====================================================================== */

  renderEstatusLookupStep(field) {
    const sourceValue = this.values[field.sourceField];
    const entry = (this.catalogIndex || {})[sourceValue];

    this.container.innerHTML = '';

    const screen = document.createElement('div');
    screen.className = 'step-screen scanner-screen';

    screen.appendChild(this.buildProgress());

    const h1 = document.createElement('h1');
    h1.className = 'step-question';
    h1.textContent = field.label;
    screen.appendChild(h1);

    const body = document.createElement('div');
    body.className = 'scanner-body';
    screen.appendChild(body);

    const support = document.createElement('div');
    support.className = 'step-support';
    screen.appendChild(support);

    this.container.appendChild(screen);
    this.errorTargetEl = body;
    this.supportEl = support;

    if (!entry) {
      body.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">${Icons.svg('alertCircle', { size: 28 })}</div>
          <p>Shipment no encontrado en el catálogo de estatus.</p>
        </div>
      `;
      const retryBtn = this.makeButton('Reintentar Shipment', {
        icon: 'refresh',
        onClick: () => {
          delete this.values[field.sourceField];
          delete this.values.estatus;
          delete this.values.optimizada;
          delete this.values.resultado;
          this.back();
        },
      });
      this.setActions([retryBtn]);
      return;
    }

    const isInContainer = String(entry.estatus || '').trim().toLowerCase() === 'in_container';
    const resultado = isInContainer ? 'En contenedor' : 'No en contenedor';
    this.values.estatus = entry.estatus;
    this.values.optimizada = entry.optimizada;
    this.values.resultado = resultado;

    body.innerHTML = `
      <div class="scanner-result">
        <div class="scanner-result-badge">${Icons.svg(isInContainer ? 'checkCircle' : 'alertCircle', { size: 22 })}</div>
        <div class="scanner-result-label">${resultado}</div>
        <div class="scanner-result-value">Estatus: ${entry.estatus}</div>
        <div class="scanner-result-format">Optimizada: ${entry.optimizada || '—'}</div>
      </div>
    `;

    const nextBtn = this.makeButton(this.isLastStep ? 'Agregar Registro' : 'Continuar', {
      primary: true,
      icon: this.isLastStep ? 'check' : 'arrowRight',
      iconAfter: true,
      onClick: () => this.advance(),
    });
    this.setActions([nextBtn]);
  }

  /* ====================================================================== */
  /* Photo field */
  /* ====================================================================== */

  renderPhotoStep(field) {
    this.container.innerHTML = '';

    const screen = document.createElement('div');
    screen.className = 'step-screen photo-screen';

    screen.appendChild(this.buildProgress());

    const h1 = document.createElement('h1');
    h1.className = 'step-question';
    h1.textContent = field.label;
    screen.appendChild(h1);

    const body = document.createElement('div');
    body.className = 'photo-body';
    screen.appendChild(body);

    const support = document.createElement('div');
    support.className = 'step-support';
    screen.appendChild(support);

    this.container.appendChild(screen);

    this.photoBody = body;
    this.supportEl = support;
    this.errorTargetEl = body;

    if (this.values[field.id]) {
      this.enterPhotoPreview(field);
    } else {
      this.enterPhotoCapture(field);
    }
  }

  async enterPhotoCapture(field, note) {
    this.stopPhotoCamera();
    this.supportEl.textContent = note || 'Encuadra y toma la foto con la cámara de la app.';
    this.supportEl.classList.toggle('error', !!note);

    // Cámara DENTRO de la app (getUserMedia): en la handheld la cámara
    // externa (input capture) está bloqueada por el MDM, así que se usa un
    // preview en vivo + obturador que captura el frame sin salir de la app.
    this.photoBody.innerHTML = `
      <div class="scanner-viewport">
        <video class="scanner-video" playsinline muted></video>
      </div>
    `;

    if (!PhotoCamera.isSupported()) {
      this.photoCameraUnavailable(field);
      return;
    }

    const video = this.photoBody.querySelector('.scanner-video');
    this.photoCamera = new PhotoCamera();
    try {
      await this.photoCamera.start(video);
    } catch (e) {
      this.photoCameraUnavailable(field);
      return;
    }

    if (this.photoCamera.hasTorch()) {
      const viewport = this.photoBody.querySelector('.scanner-viewport');
      const torchBtn = document.createElement('button');
      torchBtn.type = 'button';
      torchBtn.className = 'scanner-torch';
      torchBtn.setAttribute('aria-label', 'Linterna');
      torchBtn.innerHTML = Icons.svg('flash', { size: 20 });
      let on = false;
      torchBtn.addEventListener('click', async () => {
        on = !on;
        const ok = await this.photoCamera.setTorch(on);
        torchBtn.classList.toggle('active', ok && on);
      });
      viewport.appendChild(torchBtn);
    }

    const shutter = document.createElement('button');
    shutter.type = 'button';
    shutter.className = 'photo-cam-shutter';
    shutter.innerHTML = `${Icons.svg('camera', { size: 20 })}<span>Tomar foto</span>`;
    shutter.addEventListener('click', () => {
      const data = this.photoCamera && this.photoCamera.capture({ maxDim: 1280, quality: 0.6 });
      if (!data) {
        this.supportEl.textContent = 'No se pudo capturar. Intenta de nuevo.';
        this.supportEl.classList.add('error');
        return;
      }
      this.values[field.id] = data;
      this.vibrate(30);
      this.stopPhotoCamera();
      this.enterPhotoPreview(field);
    });
    this.photoBody.appendChild(shutter);

    const buttons = [];
    if (!field.required) {
      buttons.push(this.makeButton('Omitir', {
        onClick: () => {
          this.stopPhotoCamera();
          this.skip();
        },
      }));
    }
    this.setActions(buttons);
  }

  photoCameraUnavailable(field) {
    this.stopPhotoCamera();
    this.photoBody.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${Icons.svg('alertCircle', { size: 48 })}</div>
        <p style="font-size: 1rem; margin-bottom: 16px;">Cámara no disponible</p>
        <p style="font-size: 0.9rem; color: var(--color-text-muted);">No se pudo abrir la cámara de la app. Verifica el permiso de cámara e intenta de nuevo.</p>
      </div>
    `;
    this.supportEl.textContent = 'Cámara no disponible';
    this.supportEl.classList.add('error');

    const retryBtn = this.makeButton('Reintentar', {
      primary: true,
      icon: 'refresh',
      onClick: () => this.enterPhotoCapture(field),
    });
    const buttons = [retryBtn];
    if (!field.required) {
      buttons.unshift(this.makeButton('Omitir', { onClick: () => this.skip() }));
    }
    this.setActions(buttons);
  }

  enterPhotoPreview(field) {
    this.supportEl.textContent = '';
    this.supportEl.classList.remove('error');

    this.photoBody.innerHTML = `
      <div class="photo-preview">
        <img alt="Foto capturada" />
        <div class="photo-preview-badge">${Icons.svg('checkCircle', { size: 20 })}</div>
      </div>
    `;
    this.photoBody.querySelector('img').src = this.values[field.id];

    const retakeBtn = this.makeButton('Retomar', {
      icon: 'refresh',
      onClick: () => {
        delete this.values[field.id];
        this.enterPhotoCapture(field);
      },
    });
    const nextBtn = this.makeButton(this.isLastStep ? 'Agregar Registro' : 'Continuar', {
      primary: true,
      icon: this.isLastStep ? 'check' : 'arrowRight',
      iconAfter: true,
      onClick: () => this.advance(),
    });
    this.setActions([retakeBtn, nextBtn]);
  }

  /* ====================================================================== */
  /* Choice field: lista de opciones grandes, un toque elige y avanza      */
  /* ====================================================================== */

  renderChoiceStep(field) {
    this.container.innerHTML = '';

    const screen = document.createElement('div');
    screen.className = 'step-screen';
    screen.appendChild(this.buildProgress());

    const h1 = document.createElement('h1');
    h1.className = 'step-question';
    h1.textContent = field.label;
    screen.appendChild(h1);

    const options = document.createElement('div');
    options.className = 'choice-options';

    field.options.forEach((opt) => {
      const label = opt.label || opt;
      const value = opt.value || opt;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'choice-btn';
      if (this.values[field.id] === value) btn.classList.add('selected');
      btn.textContent = label;
      btn.addEventListener('click', () => {
        this.values[field.id] = value;
        if (field.resetOnChange) {
          field.resetOnChange.forEach((id) => delete this.values[id]);
        }
        this.advance();
      });
      options.appendChild(btn);
    });

    screen.appendChild(options);
    this.container.appendChild(screen);

    const support = document.createElement('div');
    support.className = 'step-support';
    screen.appendChild(support);
    this.errorTargetEl = options;
    this.supportEl = support;
  }

  /* ====================================================================== */

  readCurrentValue() {
    return this.currentInput ? this.currentInput.value.trim() : '';
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  showError(message) {
    this.vibrate(20);

    if (!this.errorTargetEl) return;
    this.errorTargetEl.classList.add('error');
    this.supportEl.textContent = message;
    this.supportEl.classList.add('error');

    this.errorTargetEl.classList.remove('shake');
    void this.errorTargetEl.offsetWidth;
    this.errorTargetEl.classList.add('shake');
  }

  clearError() {
    if (this.errorTargetEl) this.errorTargetEl.classList.remove('error');
    if (this.supportEl) {
      this.supportEl.textContent = '';
      this.supportEl.classList.remove('error');
    }
  }

  next() {
    const field = this.currentField;
    const value = this.readCurrentValue();

    if (field.required && !value) {
      this.showError('Este campo es obligatorio.');
      return;
    }

    this.values[field.id] = value;
    this.advance();
  }

  skip() {
    this.values[this.currentField.id] = '';
    this.advance();
  }

  advance({ silent } = {}) {
    if (!silent) this.vibrate(10);
    if (this.isLastStep) {
      this.finish();
    } else {
      this.stepIndex++;
      this.renderStep();
    }
  }

  back() {
    this.stopScanner();
    let idx = this.stepIndex - 1;
    while (idx >= 0 && this.isFieldHidden(this.formConfig.fields[idx])) idx--;
    if (idx < 0) {
      if (this.onCancel) this.onCancel();
      return;
    }
    this.stepIndex = idx;
    this.renderStep();
  }

  finish() {
    // Guard contra doble envío: guardar+sincronizar toma uno o dos segundos
    // (red variable) y hasta ahora no había ningún indicio visual de que el
    // toque ya se había registrado, así que un segundo toque mientras
    // todavía estaba procesando duplicaba el registro completo.
    if (this._finished) return;
    this._finished = true;

    this.stopScanner();
    if (this.actionsEl) {
      this.actionsEl.querySelectorAll('button').forEach((btn) => { btn.disabled = true; });
    }
    this.formConfig.fields.forEach((f) => {
      if (this.values[f.id] === undefined) {
        this.values[f.id] = this.isFieldHidden(f) && f.valueWhenHidden ? f.valueWhenHidden(this.values) : '';
      }
    });
    if (this.onComplete) this.onComplete({ ...this.values });
  }
}

/**
 * DestinoDocaSession — flujo de escaneo rápido y continuo para Pre-Missort.
 *
 * La DOCA es lo estable (se fija una vez por sesión, cambia poco — botón
 * "Cambiar" arriba para ajustarla) y el DESTINO cambia por cada HU: el
 * flujo real es doca (una vez) → [escanea HU → elige destino] en loop. No
 * se construye sobre FormEngine (ese motor es para el resto de los logs,
 * un campo por pantalla con confirmación explícita) — acá cada HU válido
 * dispara de inmediato el picker de destino, y al elegirlo se guarda el
 * registro y se vuelve solo al escaneo, sin pedir confirmación aparte.
 */
class DestinoDocaSession {
  constructor(opts = {}) {
    // catalogIndex: { doca: [destino, destino, ...] } — la doca es la
    // clave (fija por sesión), el valor son los destinos válidos ahí.
    this.catalogIndex = opts.catalogIndex || {};
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.initialDoca = opts.initialDoca || null;
    this.doca = null;
    this.pendingHu = null;
    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.count = 0;
    this.scannedHUs = new Set();
  }

  /**
   * Si ya hay una doca previa (persistida entre sesiones), el primer paso
   * es directo a escanear — no se vuelve a preguntar la doca cada vez que
   * se abre el log, se mantiene fija hasta que se cambie a mano con
   * "Cambiar" arriba. Si no hay una previa, se pide una vez.
   */
  render(containerId) {
    this.container = document.getElementById(containerId);
    if (this.initialDoca) {
      this.doca = this.initialDoca;
      this.renderLoop();
    } else {
      this.pickDoca();
    }
  }

  destroy() {
    this.stopScanner();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  isNum(v) {
    return /^[0-9]+$/.test(String(v || '').trim());
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /**
   * Picker de búsqueda genérico (lista fija + filtro), usado tanto para
   * elegir la doca al inicio como el destino después de cada HU. Si
   * allowManual es true, Enter acepta lo escrito aunque no esté en la
   * lista (para la doca: el catálogo puede traer valores no numéricos que
   * ya se filtran de la lista, pero conviene poder escribirla a mano).
   */
  renderPicker({ title, options, placeholder, emptyMessage, onPick, onBack, allowManual }) {
    this.stopScanner();
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain dd-picker-back" aria-label="Atrás">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Pre-Missort</div>
        </div>
        <h1 class="step-question">${title}</h1>
        <div class="picker-search"><input type="text" class="step-input dd-picker-search" placeholder="${placeholder}" /></div>
        <div class="picker-list"></div>
      </div>
    `;

    const search = this.container.querySelector('.dd-picker-search');
    const list = this.container.querySelector('.picker-list');

    const renderList = (filter = '') => {
      list.innerHTML = '';
      const matches = options.filter((o) => o.toLowerCase().includes(filter.toLowerCase()));
      if (!matches.length) {
        const empty = document.createElement('div');
        empty.className = 'picker-empty';
        empty.textContent = emptyMessage || 'Sin coincidencias.';
        list.appendChild(empty);
        return;
      }
      matches.forEach((opt) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'picker-opt';
        row.textContent = opt;
        row.addEventListener('click', () => onPick(opt));
        list.appendChild(row);
      });
    };

    search.addEventListener('input', () => renderList(search.value));
    renderList();
    setTimeout(() => search.focus(), 60);

    if (allowManual) {
      search.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const typed = search.value.trim();
        if (!typed) return;
        e.preventDefault();
        const exact = options.find((o) => o.toLowerCase() === typed.toLowerCase());
        onPick(exact || typed.toUpperCase());
      });
    }

    this.container.querySelector('.dd-picker-back').addEventListener('click', () => {
      if (onBack) onBack();
      else if (this.onExit) this.onExit();
    });
  }

  pickDoca() {
    // Todas las docas del catálogo, sin filtrar — se ordenan numéricas
    // primero (de menor a mayor) y el resto alfabético. Se puede escribir
    // cualquier valor a mano (Enter) si la doca real no aparece listada.
    const docas = Object.keys(this.catalogIndex || {}).sort((a, b) => {
      const an = this.isNum(a);
      const bn = this.isNum(b);
      if (an && bn) return Number(a) - Number(b);
      if (an && !bn) return -1;
      if (!an && bn) return 1;
      return a.localeCompare(b, 'es');
    });

    this.renderPicker({
      title: '¿Cuál es la doca?',
      options: docas,
      placeholder: 'Buscar o escribir la doca...',
      emptyMessage: 'No hay docas en el catálogo — escribe la doca y presiona Enter.',
      allowManual: true,
      onPick: (doca) => {
        this.doca = doca;
        this.initialDoca = doca;
        this.renderLoop();
      },
    });
  }

  pickDestinoForHu(hu) {
    const destinos = ((this.catalogIndex || {})[this.doca] || []).slice().sort((a, b) => a.localeCompare(b, 'es'));

    this.renderPicker({
      title: `Destino para ${hu}`,
      options: destinos,
      placeholder: 'Buscar destino...',
      emptyMessage: 'No hay destinos disponibles para esta doca.',
      onPick: (destino) => this.finishHu(hu, destino),
      onBack: () => {
        this.pendingHu = null;
        this.locked = false;
        this.renderLoop();
      },
    });
  }

  renderLoop() {
    this.stopScanner();
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera
      ? 'Escaneando... apunta la cámara al HU.'
      : '';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Pre-Missort</div>
        </div>
        <div class="session-pill">
          <div class="session-pill-info">Doca: ${this.doca}</div>
          <button type="button" class="btn btn-secondary session-change-btn">Cambiar</button>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el HU</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
        <div class="session-counter">${this.count} HU escaneados en esta sesión</div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.counterEl = this.container.querySelector('.session-counter');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });
    this.container.querySelector('.session-change-btn').addEventListener('click', () => {
      this.pickDoca();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startCamera();
    } else {
      // Hidden HID input
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      // Scan area
      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        const hu = this.parseHu(raw);
        if (!hu) {
          this.supportEl.textContent = `HU inválido: ${this.rawSnippet(raw)}`;
          this.supportEl.classList.add('error');
          lastCodeEl.className = 'hh-last-code';
          hidInput.value = '';
          return;
        }
        this.supportEl.classList.remove('error');
        hidInput.value = '';
        const isDup = this.scannedHUs.has(raw);
        lastCodeEl.textContent = isDup ? `${raw} · ya escaneado` : raw;
        lastCodeEl.className = 'hh-last-code visible';
        lastCodeEl.classList.toggle('duplicate', isDup);
        this.handleHuScanned(hu);
      });

      armHid();

      // Floating manual button
      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      // Bottom-sheet modal
      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">HU</p>
          <input type="text" class="hh-manual-input" placeholder="HU" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim().toUpperCase();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        const hu = this.parseHu(val);
        if (!hu) {
          this.supportEl.textContent = `HU inválido: ${this.rawSnippet(val)}`;
          this.supportEl.classList.add('error');
          return;
        }
        this.supportEl.classList.remove('error');
        this.handleHuScanned(hu);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  async startCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }

    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();

    try {
      await this.scanner.start(video, (text) => this.handleScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  handleScan(rawText) {
    if (this.locked) return;

    const hu = this.parseHu(rawText);
    if (!hu) {
      this.vibrate(40);
      this.flash('error', `HU no reconocido: ${this.rawSnippet(rawText)}`);
      return;
    }

    this.handleHuScanned(hu);
  }

  /**
   * Parsea el HU y, si falla, registra el valor crudo en la consola de
   * debug para poder ver exactamente qué trae el código escaneado (útil
   * cuando el QR es un JSON con una estructura no esperada).
   */
  parseHu(raw) {
    const hu = ScanParser.parse(raw, 'hu');
    if (!hu) {
      DebugConsole.log(`HU no reconocido — valor crudo: ${String(raw)}`, 'warn');
    }
    return hu;
  }

  rawSnippet(raw) {
    const s = String(raw || '').trim();
    return s.length > 40 ? `${s.slice(0, 40)}…` : s;
  }

  enterManualEntry() {
    if (this.scanner) this.scanner.pause();

    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el HU" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el HU y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('input', () => {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.value = input.value.toUpperCase();
      input.setSelectionRange(start, end);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const hu = this.parseHu(input.value);
      if (!hu) {
        this.supportEl.textContent = `HU inválido: ${this.rawSnippet(input.value)}`;
        this.supportEl.classList.add('error');
        return;
      }
      this.handleHuScanned(hu);
    });

    setTimeout(() => input.focus(), 60);
  }

  /**
   * HU válido escaneado (por cámara, handheld o manual): pasa directo al
   * picker de destino para ese HU — el registro se guarda al elegirlo
   * (ver finishHu), no en este punto.
   */
  handleHuScanned(hu) {
    this.locked = true;
    if (this.scanner) this.scanner.pause();
    this.pendingHu = hu;
    this.pickDestinoForHu(hu);
  }

  async finishHu(hu, destino) {
    // Guard contra doble toque: onScan (guardar + sincronizar) tarda un
    // instante y el picker de destino sigue en pantalla mientras tanto, así
    // que un segundo toque rápido duplicaba el registro. savingDestino se
    // libera solo al volver a renderLoop (nueva sesión de escaneo).
    if (this.savingDestino) return;
    this.savingDestino = true;

    const resultado = this.isNum(this.doca) ? 'Sin incidencia' : 'Erroneo';
    this.vibrate(resultado === 'Sin incidencia' ? 60 : [40, 60, 40]);

    if (this.onScan) {
      await this.onScan({ hu, destino, doca: this.doca, resultado });
    }
    this.scannedHUs.add(hu);
    this.count += 1;
    this.pendingHu = null;
    this.locked = false;
    this.savingDestino = false;
    this.renderLoop();
    this.flash(resultado === 'Sin incidencia' ? 'ok' : 'error', `${hu} · ${destino} · ${resultado}`);
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (!this.flashEl) return;
    const cls = kind === 'ok' ? 'active-ok' : 'active-error';
    this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
    this.flashEl.classList.add(cls);
    setTimeout(() => {
      if (this.flashEl) {
        this.flashEl.classList.remove(cls);
        this.flashEl.innerHTML = '';
      }
    }, 550);
  }
}


/**
 * Premissort — escaneo rápido de posición (ej. AS1-1-1-1) que audita en
 * loop continuo contra un catálogo (posición → HU + shipments esperados)
 * cargado UNA VEZ por sesión desde Google Sheets (GridClient.
 * loadPremissortCatalog, ver comentario junto a PREMISSORT_SHEET_ID —
 * reemplaza al Dataset Definition grid_sql que Grid retiró de la
 * plataforma):
 *   - Esperado aquí: guarda directo sin interrumpir el loop (solo
 *     actualiza el contador de faltantes en pantalla).
 *   - No esperado aquí: busca el shipment en el resto del catálogo (ya
 *     cargado en memoria, sin llamada nueva) para saber si pertenece a
 *     otra posición (sobrante ubicable — pausa y pregunta si ya se
 *     reubicó físicamente) o no aparece en absoluto (sobrante no
 *     contenerizado — pide investigar en TMS y elegir una acción).
 * Se puede cambiar de posición en cualquier momento con "Cambiar" para
 * empezar otro HU — reusa el mismo catálogo ya cargado, no dispara una
 * lectura nueva. La deduplicación es global por día (no por posición) y
 * es local (foundToday/anyRecordToday vienen de nuestros propios
 * registros de hoy, no del catálogo): un shipment ya resuelto hoy (en
 * cualquier posición) no se vuelve a preguntar.
 */
class PremissortSession {
  static POSITION_PATTERN = /^[A-Z0-9-]{2,40}$/;

  constructor(opts = {}) {
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.gridClient = opts.gridClient;
    // Se carga una sola vez por sesión (ver ensureCatalog) — abrir de
    // nuevo el log desde el menú crea una instancia nueva y por lo tanto
    // relee el catálogo; cambiar de posición dentro de la misma sesión no.
    this.catalog = null;

    // Dedup del día: found = ya guardado como Encontrado (en cualquier
    // posición); anyRecordToday = cualquier registro de hoy (Encontrado o
    // sobrante ya resuelto), para no volver a preguntar por lo mismo.
    this.foundToday = new Set(opts.foundToday || []);
    this.anyRecordToday = new Set(opts.anyRecordToday || []);

    this.container = null;
    this.scanner = null;
    this.locked = false;
    this.inManualMode = false;
    this.pendingPanelOpen = false;

    this.posicion = null;
    this.hu = '';
    this.pending = new Map();
    this.handled = new Map();
    this.total = 0;
  }

  render(containerId) {
    this.container = document.getElementById(containerId);
    this.renderPositionEntry();
  }

  /** Carga el catálogo la primera vez que se necesita; llamadas siguientes reusan la misma referencia en memoria. */
  async ensureCatalog() {
    if (!this.catalog) {
      this.catalog = await this.gridClient.loadPremissortCatalog();
    }
    return this.catalog;
  }

  destroy() {
    this.stopScanner();
  }

  stopScanner() {
    if (this.scanner) {
      this.scanner.stop();
      this.scanner = null;
    }
  }

  vibrate(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {}
    }
  }

  /**
   * El lector de posición puede traer texto plano (AS17-1-1-3) o un QR/JSON
   * con la posición bajo la clave NAME, ej. {"ID":625195,"NAME":"AS17-1-1-3"}
   * — se busca esa clave sin distinguir mayúsculas/minúsculas, igual que
   * ScanParser.extract con los QR de HU/shipment.
   */
  normalizePosition(raw) {
    const text = String(raw || '').trim();
    if (text.startsWith('{')) {
      try {
        const obj = JSON.parse(text);
        if (obj && typeof obj === 'object') {
          const nameKey = Object.keys(obj).find((k) => k.toLowerCase() === 'name');
          if (nameKey != null && obj[nameKey] != null) {
            return String(obj[nameKey]).trim().toUpperCase();
          }
        }
        return '';
      } catch (e) {
        return '';
      }
    }
    return text.toUpperCase();
  }

  /* ====================================================================== */
  /* Paso 1: escanear/ingresar la posición                                 */
  /* ====================================================================== */

  renderPositionEntry(message) {
    this.stopScanner();
    this.locked = false;
    const camera = ScanUI.mode() === 'camera';

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Premissort Contenerizado</div>
        </div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">${camera ? 'Escanea la posición' : 'Escanea o ingresa la posición'}</h1>
        <div class="scanner-body"></div>
        <div class="step-support ${message ? 'error' : ''}">${message || ''}</div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderPositionEntry()));
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      if (!this.supportEl.textContent) this.supportEl.textContent = 'Apunta la cámara al código de la posición (ej. AS1-1-1-1).';
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Ingresar posición manualmente';
      link.addEventListener('click', () => this.enterManualPositionEntry());
      this.container.querySelector('.step-screen').appendChild(link);
      this.startPositionCamera();
    } else {
      if (!this.supportEl.textContent) this.supportEl.textContent = 'Escanea con el lector o escribe la posición y Enter.';

      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw) return;
        hidInput.value = '';
        lastCodeEl.textContent = raw;
        lastCodeEl.className = 'hh-last-code visible';
        this.resolvePosition(this.normalizePosition(raw));
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Posición</p>
          <input type="text" class="hh-manual-input" placeholder="Ej. AS1-1-1-1" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.resolvePosition(this.normalizePosition(val));
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  enterManualPositionEntry() {
    if (this.scanner) this.scanner.pause();
    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Ej. AS1-1-1-1" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe la posición y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const val = this.normalizePosition(input.value);
      if (!val) return;
      this.resolvePosition(val);
    });
    setTimeout(() => input.focus(), 60);
  }

  async startPositionCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — ingresa la posición manualmente.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handlePositionScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — ingresa la posición manualmente.';
      this.supportEl.classList.add('error');
    }
  }

  handlePositionScan(rawText) {
    const val = this.normalizePosition(rawText);
    if (!val) return;
    this.resolvePosition(val);
  }

  renderPositionLoading(posicion) {
    this.stopScanner();
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <div class="step-progress">Premissort Contenerizado</div>
        </div>
        <h1 class="step-question">Consultando posición ${posicion}…</h1>
        <div class="step-support">${this.catalog ? 'Un momento…' : 'Cargando el catálogo — solo tarda la primera vez de esta sesión.'}</div>
      </div>
    `;
  }

  async resolvePosition(posicion) {
    if (!PremissortSession.POSITION_PATTERN.test(posicion)) {
      this.vibrate([40, 60, 40]);
      this.renderPositionEntry(`Posición "${posicion}" tiene un formato no válido.`);
      return;
    }

    this.renderPositionLoading(posicion);
    let rows;
    try {
      const catalog = await this.ensureCatalog();
      rows = catalog.filter((r) => r.POSICION === posicion);
    } catch (e) {
      this.vibrate([40, 60, 40]);
      this.renderPositionEntry(`No se pudo consultar la posición: ${e.message}`);
      return;
    }

    const shipmentIds = [...new Set(rows.map((r) => r && r.SHIPMENT_ID).filter(Boolean).map(String))];
    if (shipmentIds.length === 0) {
      this.vibrate([40, 60, 40]);
      this.renderPositionEntry(`Posición "${posicion}" no tiene shipments activos (o no existe).`);
      return;
    }

    this.posicion = posicion;
    this.hu = String((rows.find((r) => r && r.HU) || {}).HU || '');
    this.pending = new Map();
    this.handled = new Map();
    shipmentIds.forEach((id) => {
      if (this.foundToday.has(id)) this.handled.set(id, 'Encontrado');
      else this.pending.set(id, { shipment_id: id });
    });
    this.total = shipmentIds.length;

    this.vibrate(60);
    this.renderLoop();
  }

  /* ====================================================================== */
  /* Paso 2: loop de escaneo de shipments esperados en la posición         */
  /* ====================================================================== */

  renderLoop() {
    this.stopScanner();
    this.locked = false;
    this.inManualMode = false;
    const camera = ScanUI.mode() === 'camera';
    this.loopHint = camera ? 'Escaneando... apunta la cámara al shipment.' : '';

    const foundCount = this.handled.size;
    const pendingCount = this.pending.size;

    this.container.innerHTML = `
      <div class="step-screen scanner-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Salir">${Icons.svg('arrowLeft', { size: 28 })}</button>
          <div class="step-progress">Premissort Contenerizado</div>
        </div>
        <div class="session-pill">
          <div class="session-pill-info">Posición ${this.posicion} · HU ${this.hu || '—'}</div>
          <button type="button" class="btn btn-secondary session-change-btn">Cambiar</button>
        </div>
        <button type="button" class="driver-pending-toggle">
          <span>${foundCount} / ${this.total} encontrados · ${pendingCount} faltantes</span>
          ${Icons.svg(this.pendingPanelOpen ? 'arrowDown' : 'arrowRight', { size: 16 })}
        </button>
        <div class="driver-pending-panel" style="display: ${this.pendingPanelOpen ? 'block' : 'none'};"></div>
        <div class="scan-mode-slot"></div>
        <h1 class="step-question">Escanea el shipment</h1>
        <div class="scanner-body"></div>
        <div class="step-support"></div>
      </div>
      <div class="session-flash"></div>
    `;

    this.flashEl = this.container.querySelector('.session-flash');
    this.supportEl = this.container.querySelector('.step-support');
    this.supportEl.textContent = this.loopHint;
    this.pendingToggleEl = this.container.querySelector('.driver-pending-toggle span');
    this.pendingPanelEl = this.container.querySelector('.driver-pending-panel');
    this.renderPendingPanel();
    this.container.querySelector('.scan-mode-slot').replaceWith(ScanUI.buildToggle(() => this.renderLoop()));

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.stopScanner();
      if (this.onExit) this.onExit();
    });
    this.container.querySelector('.session-change-btn').addEventListener('click', () => {
      this.renderPositionEntry();
    });
    this.container.querySelector('.driver-pending-toggle').addEventListener('click', () => {
      this.pendingPanelOpen = !this.pendingPanelOpen;
      this.renderLoop();
    });

    const body = this.container.querySelector('.scanner-body');
    if (camera) {
      body.innerHTML = `
        <div class="scanner-viewport">
          <video class="scanner-video" playsinline muted></video>
          <div class="scanner-frame"><span class="scanner-line"></span></div>
        </div>
      `;
      const link = document.createElement('button');
      link.type = 'button';
      link.className = 'session-manual-link';
      link.textContent = 'Entrada manual';
      link.addEventListener('click', () => this.enterManualShipmentEntry());
      this.supportEl.insertAdjacentElement('afterend', link);
      this.startShipmentCamera();
    } else {
      const hidInput = document.createElement('input');
      hidInput.type = 'text';
      hidInput.className = 'hh-hid-input';
      hidInput.setAttribute('inputmode', 'none');
      body.appendChild(hidInput);

      const scanArea = document.createElement('div');
      scanArea.className = 'hh-scan-area';
      const iconWrap = document.createElement('div');
      iconWrap.className = 'hh-icon idle';
      iconWrap.innerHTML = Icons.svg('scan', { size: 64 });
      scanArea.appendChild(iconWrap);
      const lastCodeEl = document.createElement('div');
      lastCodeEl.className = 'hh-last-code';
      scanArea.appendChild(lastCodeEl);
      body.appendChild(scanArea);
      scanArea.addEventListener('click', () => hidInput.focus({ preventScroll: true }));

      let modalOpen = false;
      const isActive = () => !!body && body.contains(hidInput) && ScanUI.mode() === 'handheld' && !this.locked && !modalOpen;

      let raceArmed = false;
      const armHid = () => {
        if (!isActive()) return;
        if (raceArmed && document.activeElement === hidInput && hidInput.getAttribute('inputmode') === 'text') return;
        raceArmed = false;
        hidInput.setAttribute('inputmode', 'none');
        hidInput.focus({ preventScroll: true });
        setTimeout(() => {
          if (!isActive() || document.activeElement !== hidInput) return;
          hidInput.setAttribute('inputmode', 'text');
          raceArmed = true;
        }, 50);
      };

      hidInput.addEventListener('focus', () => iconWrap.classList.add('armed'));
      hidInput.addEventListener('blur', () => { iconWrap.classList.remove('armed'); raceArmed = false; requestAnimationFrame(armHid); });

      hidInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const raw = hidInput.value.trim();
        if (!raw || this.locked) return;
        hidInput.value = '';
        const isDup = this.handled.has(raw) || this.anyRecordToday.has(raw);
        lastCodeEl.textContent = isDup ? `${raw} · ya escaneado` : raw;
        lastCodeEl.className = 'hh-last-code visible';
        lastCodeEl.classList.toggle('duplicate', isDup);
        this.submitShipmentValue(raw, hidInput);
      });

      armHid();

      const manualBtn = document.createElement('button');
      manualBtn.type = 'button';
      manualBtn.className = 'btn-manual-hid';
      manualBtn.innerHTML = Icons.svg('keyboard', { size: 22 });
      body.appendChild(manualBtn);

      const modal = document.createElement('div');
      modal.className = 'hh-manual-modal';
      modal.innerHTML = `
        <div class="hh-manual-inner">
          <p class="hh-manual-label">Shipment ID</p>
          <input type="text" class="hh-manual-input" placeholder="Shipment ID" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />
          <div class="hh-manual-actions">
            <button type="button" class="hh-manual-cancel">Cancelar</button>
            <button type="button" class="hh-manual-confirm">Confirmar</button>
          </div>
        </div>`;
      this.container.appendChild(modal);

      const modalInput = modal.querySelector('.hh-manual-input');
      const openModal = () => { modalOpen = true; modal.classList.add('open'); setTimeout(() => modalInput.focus(), 60); };
      const closeModal = () => { modalOpen = false; modal.classList.remove('open'); setTimeout(armHid, 80); };
      const confirmModal = () => {
        const val = modalInput.value.trim().toUpperCase();
        if (!val) return;
        modalInput.value = '';
        closeModal();
        this.submitShipmentValue(val, hidInput);
      };

      manualBtn.addEventListener('click', openModal);
      modal.querySelector('.hh-manual-cancel').addEventListener('click', closeModal);
      modal.querySelector('.hh-manual-confirm').addEventListener('click', confirmModal);
      modalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmModal(); } });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    }
  }

  submitShipmentValue(rawText, input) {
    const parsed = ScanParser.parse(rawText, 'shipment');
    if (!parsed) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      if (input) input.value = '';
      return;
    }
    const isKnown = this.pending.has(parsed) || this.handled.has(parsed) || this.anyRecordToday.has(parsed);
    const willNavigate = !isKnown;
    this.processShipment(parsed);
    if (!willNavigate && input && document.body.contains(input)) {
      input.value = '';
      input.focus();
    }
  }

  async startShipmentCamera() {
    if (!ScannerEngine.isSupported()) {
      this.supportEl.textContent = 'Cámara no disponible — usa entrada manual.';
      this.supportEl.classList.add('error');
      return;
    }
    const video = this.container.querySelector('.scanner-video');
    this.scanner = new ScannerEngine();
    try {
      await this.scanner.start(video, (text) => this.handleShipmentScan(text));
    } catch (e) {
      this.supportEl.textContent = 'No se pudo activar la cámara — usa entrada manual.';
      this.supportEl.classList.add('error');
    }
  }

  handleShipmentScan(rawText) {
    if (this.locked) return;
    const parsed = ScanParser.parse(rawText, 'shipment');
    if (!parsed) {
      this.vibrate(40);
      this.flash('error', 'Código no reconocido.');
      return;
    }
    this.processShipment(parsed);
  }

  enterManualShipmentEntry() {
    if (this.scanner) this.scanner.pause();
    this.inManualMode = true;
    this.container.querySelector('.scanner-body').innerHTML = `
      <div class="step-input-wrap">
        <input type="text" class="step-input session-manual-input" placeholder="Escribe el Shipment ID" />
      </div>
    `;
    const input = this.container.querySelector('.session-manual-input');
    this.supportEl.textContent = 'Escribe el Shipment ID y presiona Enter.';
    this.supportEl.classList.remove('error');

    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const parsed = ScanParser.parse(input.value, 'shipment');
      if (!parsed) {
        this.supportEl.textContent = 'Shipment inválido. Verifica el número e intenta de nuevo.';
        this.supportEl.classList.add('error');
        return;
      }
      this.processShipment(parsed);
      input.value = '';
    });
    setTimeout(() => input.focus(), 60);
  }

  renderPendingPanel() {
    if (!this.pendingPanelEl) return;
    if (this.pending.size === 0) {
      this.pendingPanelEl.innerHTML = '<div class="driver-pending-empty">Sin faltantes — todos los shipments esperados fueron encontrados.</div>';
      return;
    }
    this.pendingPanelEl.innerHTML = Array.from(this.pending.keys()).map((sid) => `
      <div class="driver-pending-item">
        <div class="driver-pending-info">
          <div class="driver-pending-id">${sid}</div>
        </div>
      </div>
    `).join('');
  }

  /**
   * Coincide con lo esperado en ESTA posición -> guarda directo, sin
   * interrumpir el loop (ver saveMatch). Ya resuelto hoy (aquí o en otra
   * posición) -> aviso, sigue escaneando. Cualquier otro caso -> pausa y
   * dispara un lookup en vivo por shipment_id (ver resolveSurplus) para
   * saber si pertenece a otra posición o no existe en absoluto.
   */
  processShipment(shipmentId) {
    if (this.pending.has(shipmentId)) {
      this.vibrate(60);
      this.saveMatch(shipmentId);
      return;
    }

    if (this.handled.has(shipmentId) || this.anyRecordToday.has(shipmentId)) {
      this.vibrate(40);
      this.flash('warn', `${shipmentId} · Ya escaneado hoy.`);
      return;
    }

    this.locked = true;
    if (this.scanner) this.scanner.pause();
    this.vibrate([40, 60, 40]);
    this.resolveSurplus(shipmentId);
  }

  renderSurplusLoading(shipmentId) {
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <div class="step-progress">Premissort Contenerizado</div>
        </div>
        <h1 class="step-question">Consultando ${shipmentId}…</h1>
        <div class="step-support">Un momento…</div>
      </div>
    `;
  }

  /**
   * Busca el shipment en el resto del catálogo ya cargado (¿a qué posición
   * pertenece, si a alguna?) — sin llamada nueva, es el mismo array que ya
   * se usó para resolver la posición actual. Con resultado -> sobrante
   * ubicable (renderMisplaced). Sin resultado -> sobrante no contenerizado
   * (renderOutOfCatalog). No hace falta chequear si "en realidad" pertenece
   * a la posición actual: si perteneciera, ya habría quedado en pending/
   * handled al resolver la posición, porque ambos leen el mismo snapshot.
   */
  async resolveSurplus(shipmentId) {
    this.renderSurplusLoading(shipmentId);
    let matches;
    try {
      const catalog = await this.ensureCatalog();
      matches = catalog.filter((r) => r.SHIPMENT_ID === shipmentId);
    } catch (e) {
      this.locked = false;
      this.flash('error', `No se pudo consultar ${shipmentId}: ${e.message}`);
      this.renderLoop();
      return;
    }

    const match = matches[0];
    if (match) {
      this.renderMisplaced(shipmentId, { posicion: String(match.POSICION), hu: String(match.HU || '') });
    } else {
      this.renderOutOfCatalog(shipmentId);
    }
  }

  /**
   * Saca el shipment de pending DE INMEDIATO (antes del await) para que un
   * doble escaneo rapidísimo del mismo ID no dispare dos guardados — pero
   * sin bloquear el guardado de OTRO shipment distinto mientras este está
   * en vuelo (por eso no hay un flag booleano único como en las pantallas
   * de detalle). El guardado real ocurre en segundo plano; la UI ya se
   * actualizó de forma optimista.
   */
  async saveMatch(shipmentId) {
    if (!this.pending.has(shipmentId)) return;
    this.pending.delete(shipmentId);
    this.handled.set(shipmentId, 'Encontrado');
    this.foundToday.add(shipmentId);
    this.anyRecordToday.add(shipmentId);
    this.flash('ok', `${shipmentId} · Follow`);
    if (this.pendingToggleEl) {
      this.pendingToggleEl.textContent = `${this.handled.size} / ${this.total} encontrados · ${this.pending.size} faltantes`;
    }
    this.renderPendingPanel();

    if (this.onScan) {
      try {
        await this.onScan({
          posicion: this.posicion,
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Encontrado',
          detalle: '',
        });
      } catch (e) {
        DebugConsole.log(`Premissort: error al guardar ${shipmentId}: ${e.message}`, 'error');
      }
    }
  }

  /* ====================================================================== */
  /* Sobrante que SÍ se localizó en BigQuery, pero en otra posición        */
  /* ====================================================================== */

  renderMisplaced(shipmentId, elsewhere) {
    const tmsUrl = `https://tms.adminml.com/fos/shipment/details/${encodeURIComponent(shipmentId)}`;
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Sobrante — otra posición</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${shipmentId}</div>
          <div class="driver-shipment-row">
            <span class="driver-badge driver-badge-out">Pertenece a la posición ${elsewhere.posicion}</span>
          </div>
        </div>
        <a href="${tmsUrl}" class="btn btn-secondary btn-block ext-open-link" style="margin: 12px 0; display: block; text-align: center; text-decoration: none;">Corroborar en TMS</a>
        <h1 class="step-question">¿Ya lo colocaste en la posición correcta?</h1>
        <div class="driver-status-actions">
          <button type="button" class="driver-status-btn driver-status-btn-ok">Sí, ya lo coloqué</button>
          <button type="button" class="driver-status-btn driver-status-btn-divergencia">No todavía</button>
        </div>
        <div class="step-support"></div>
      </div>
    `;

    this.supportEl = this.container.querySelector('.step-support');
    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });
    this.container.querySelector('.driver-status-btn-ok').addEventListener('click', () => {
      this.saveMisplaced(shipmentId, elsewhere, true);
    });
    this.container.querySelector('.driver-status-btn-divergencia').addEventListener('click', () => {
      this.saveMisplaced(shipmentId, elsewhere, false);
    });
  }

  async saveMisplaced(shipmentId, elsewhere, alreadyRelocated) {
    if (this.savingMisplaced) return;
    this.savingMisplaced = true;
    try {
      if (this.onScan) {
        await this.onScan(alreadyRelocated ? {
          posicion: elsewhere.posicion,
          hu: elsewhere.hu,
          shipment_id: shipmentId,
          estado: 'Encontrado',
          detalle: `Reubicado desde ${this.posicion}`,
        } : {
          posicion: this.posicion,
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - pendiente reubicar',
          detalle: `Pertenece a la posición ${elsewhere.posicion} (HU ${elsewhere.hu || '—'})`,
        });
      }
      if (alreadyRelocated) this.foundToday.add(shipmentId);
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingMisplaced = false;
    }
  }

  /* ====================================================================== */
  /* Sin match en el catálogo: clasificar (Missort probable vs realmente   */
  /* no contenerizado) antes de decidir la acción                          */
  /* ====================================================================== */

  /**
   * No encontrarlo en el catálogo NO prueba que esté fuera de todo
   * contenedor — el catálogo viene de una Google Sheet conectada a
   * BigQuery, y esa conexión puede tener segundos/minutos de desfase. Dos
   * formas distintas en que el desfase puede engañar:
   *   - El paquete SÍ pertenece a ESTA posición, pero el catálogo todavía
   *     no lo reflejó cuando se cargó al iniciar el escaneo -> falsa
   *     alarma, es "Correcto".
   *   - El paquete está en OTRA posición, pero esa reasignación tampoco se
   *     refleja aún -> es un Missort real, solo que el catálogo no dice
   *     dónde.
   * Por eso no se asume "no contenerizado": se le pregunta al operador,
   * que puede saberlo por observación física aunque el catálogo todavía
   * no lo refleje.
   */
  renderOutOfCatalog(shipmentId) {
    const tmsUrl = `https://tms.adminml.com/fos/shipment/details/${encodeURIComponent(shipmentId)}`;
    this.container.innerHTML = `
      <div class="step-screen step-screen-compact">
        <div class="step-progress-row">
          <button type="button" class="icon-btn-plain step-back-btn" aria-label="Cancelar">${Icons.svg('close', { size: 24 })}</button>
          <div class="step-progress">Sobrante — sin match en catálogo</div>
        </div>
        <div class="driver-shipment-card">
          <div class="driver-shipment-id">${shipmentId}</div>
          <div class="driver-shipment-row">
            <span class="driver-badge driver-badge-out">No aparece en el catálogo</span>
          </div>
        </div>
        <a href="${tmsUrl}" class="btn btn-secondary btn-block ext-open-link" style="margin: 12px 0; display: block; text-align: center; text-decoration: none;">Corroborar en TMS</a>
        <div class="step-support">El catálogo puede tener unos segundos de desfase — puede ser una falsa alarma (sí pertenece aquí), un Missort real (está en otro contenedor) que aún no se refleja, o de verdad no contenerizado.</div>
        <h1 class="step-question">¿Qué es este paquete?</h1>
        <div class="choice-options"></div>
      </div>
    `;

    const options = this.container.querySelector('.choice-options');

    this.container.querySelector('.step-back-btn').addEventListener('click', () => {
      this.locked = false;
      this.renderLoop();
    });

    const correctBtn = document.createElement('button');
    correctBtn.type = 'button';
    correctBtn.className = 'choice-btn';
    correctBtn.textContent = 'Correcto — sí pertenece aquí';
    correctBtn.addEventListener('click', () => this.saveCorrectHere(shipmentId));
    options.appendChild(correctBtn);

    const missortBtn = document.createElement('button');
    missortBtn.type = 'button';
    missortBtn.className = 'choice-btn';
    missortBtn.textContent = 'Missort — está en otro contenedor';
    missortBtn.addEventListener('click', () => this.saveMissortProbable(shipmentId));
    options.appendChild(missortBtn);

    // "No contenerizado" ya es un paso final (a diferencia de Correcto/
    // Missort, no lleva a otra pantalla) — un solo botón, sin preguntar
    // por una acción/canalización específica.
    const outBtn = document.createElement('button');
    outBtn.type = 'button';
    outBtn.className = 'choice-btn';
    outBtn.textContent = 'Fuera de contenedor';
    outBtn.addEventListener('click', () => this.saveOutOfCatalog(shipmentId));
    options.appendChild(outBtn);
  }

  /** Falsa alarma por desfase del catálogo — el operador confirma que sí pertenece a la posición actual. Mismo resultado que un match normal (saveMatch), pero este shipment nunca estuvo en pending. */
  async saveCorrectHere(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      this.handled.set(shipmentId, 'Encontrado');
      this.foundToday.add(shipmentId);
      this.anyRecordToday.add(shipmentId);
      this.flash('ok', `${shipmentId} · Follow`);
      if (this.onScan) {
        try {
          await this.onScan({
            posicion: this.posicion,
            hu: this.hu,
            shipment_id: shipmentId,
            estado: 'Encontrado',
            detalle: 'Confirmado en esta posición — no aparecía en el catálogo (posible desfase de la sheet conectada)',
          });
        } catch (e) {
          DebugConsole.log(`Premissort: error al guardar ${shipmentId}: ${e.message}`, 'error');
        }
      }
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  /** El operador ya sabe/observó que está en otro contenedor — se marca pendiente de reubicar aunque el catálogo no diga dónde. */
  async saveMissortProbable(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      if (this.onScan) {
        await this.onScan({
          posicion: this.posicion,
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - pendiente reubicar',
          detalle: 'Missort — no aparece aún en el catálogo (posible desfase de la sheet conectada)',
        });
      }
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  async saveOutOfCatalog(shipmentId) {
    if (this.savingOut) return;
    this.savingOut = true;
    try {
      if (this.onScan) {
        await this.onScan({
          posicion: this.posicion,
          hu: this.hu,
          shipment_id: shipmentId,
          estado: 'Sobrante - no contenerizado',
          detalle: 'Fuera de contenedor',
        });
      }
      this.anyRecordToday.add(shipmentId);
      this.locked = false;
      this.renderLoop();
    } finally {
      this.savingOut = false;
    }
  }

  flash(kind, message) {
    if (this.supportEl) {
      this.supportEl.textContent = message;
      this.supportEl.classList.toggle('error', kind === 'error');
    }
    if (this.flashEl) {
      const cls = kind === 'ok' ? 'active-ok' : (kind === 'error' ? 'active-error' : '');
      if (cls) {
        this.flashEl.innerHTML = Icons.svg(kind === 'ok' ? 'checkCircle' : 'resultError', { size: 96 });
        this.flashEl.classList.add(cls);
        setTimeout(() => {
          if (this.flashEl) {
            this.flashEl.classList.remove(cls);
            this.flashEl.innerHTML = '';
          }
        }, 550);
      }
    }
    setTimeout(() => {
      if (!this.supportEl) return;
      this.supportEl.classList.remove('error');
      this.supportEl.textContent = this.inManualMode
        ? 'Escribe el Shipment ID y presiona Enter.'
        : (this.loopHint || 'Escaneando... apunta la cámara al shipment.');
    }, 900);
  }
}

/**
 * Contenedor Cerrado — igual espíritu que PremissortSession (catálogo
 * cargado una vez por sesión desde Google Sheets, filtrado en memoria,
 * misma clasificación Correcto/Missort/No contenerizado cuando no hay
 * match), pero para contenedores YA CERRADOS: se escanea el HU del
 * contenedor directo (no una posición física) y el catálogo
 * (GridClient.loadContenedorCerradoCatalog, pestaña CONT_CERRADO) solo
 * tiene HU y SHIPMENT_ID — no hay POSICION porque un contenedor cerrado
 * no tiene una posición física que auditar.
 */
class ContenedorCerradoSession {

  constructor(opts = {}) {
    this.onScan = opts.onScan;
    this.onExit = opts.onExit;
    this.gridClient = opts.gridClient;
    // Se carga una sola vez por sesión (ver ensureCatalog) — abrir de
