  /** ID estable por dispositivo, persistido en IndexedDB. */
  async loadDeviceId() {
    let saved = await RecordStore.getSetting('recoveryDeviceId');
    if (!saved) {
      const raw = (globalThis.crypto && crypto.randomUUID)
        ? crypto.randomUUID().replace(/-/g, '').slice(0, 10)
        : `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`.slice(0, 10);
      saved = `HH_${raw.toUpperCase()}`;
      await RecordStore.setSetting('recoveryDeviceId', saved);
    }
    this.deviceId = saved;
    DebugConsole.log(`Recovery device_id: ${this.deviceId}`, 'info');
  }

  /** bucketName es el nombre real del bucket (ya incluye _master o _master_YYYY-MM-DD). */
  isMasterCircuitOpen(bucketName) {
    const state = this.masterCircuit[bucketName];
    return !!state && Date.now() < state.openUntil;
  }

  openMasterCircuit(bucketName, reason) {
    const current = this.masterCircuit[bucketName];
    const wasOpen = !!current && Date.now() < current.openUntil;
    this.masterCircuit[bucketName] = {
      openedAt: wasOpen ? current.openedAt : Date.now(),
      openUntil: Date.now() + this.MASTER_CIRCUIT_MS,
      reason: reason || 'lectura ambigua',
    };
    if (!wasOpen) {
      DebugConsole.log(`Circuit breaker ${bucketName} ABIERTO: ${reason}`, 'warn');
    }
    return !wasOpen;
  }

  closeMasterCircuit(bucketName) {
    if (this.masterCircuit[bucketName]) {
      DebugConsole.log(`Circuit breaker ${bucketName} CERRADO: master saludable`, 'info');
      delete this.masterCircuit[bucketName];
    }
  }

  startSyncMaintenance() {
    if (this._maintenanceTimer) clearInterval(this._maintenanceTimer);
    // Un minuto es suficientemente espaciado para no bombardear Grid y permite
    // que el master se recupere sin intervención del operador.
    this._maintenanceTimer = setInterval(() => {
      if (!navigator.onLine || this.syncing || this.outboxRecords.length === 0) return;
      this.flushOutbox({ silent: true }).catch((e) =>
        DebugConsole.log(`Mantenimiento de sync: ${e.message}`, 'warn')
      );
    }, 60 * 1000);
  }

  /**
   * Debounce de sincronización para los logs de escaneo en loop (los mismos
   * de SHARDED_FORMS): dispara flushOutbox al primero que ocurra de 10
   * registros pendientes o 5s desde el primer pendiente. Sin esto, cada
   * escaneo dispararía su propio flush casi inmediato si la red responde
   * rápido, perdiendo el ahorro de agrupar varios registros en un solo
   * GET+PUT por shard.
   */
  scheduleSyncDebounced() {
    const totalPending = this.outboxRecords.length;
    if (totalPending >= this.SYNC_BATCH_MAX) {
      clearTimeout(this._syncDebounceTimer);
      this._syncDebounceTimer = null;
      this.flushOutbox({ silent: true }).catch((e) =>
        DebugConsole.log(`Sync (umbral de lote): ${e.message}`, 'warn')
      );
      return;
    }
    if (this._syncDebounceTimer) return;
    this._syncDebounceTimer = setTimeout(() => {
      this._syncDebounceTimer = null;
      this.flushOutbox({ silent: true }).catch((e) =>
        DebugConsole.log(`Sync (debounce): ${e.message}`, 'warn')
      );
    }, this.SYNC_BATCH_DEBOUNCE_MS);
  }

  sanitizeRecordForRemote(record) {
    const clean = {};
    Object.entries(record || {}).forEach(([key, value]) => {
      if (!key.startsWith('__local')) clean[key] = value;
    });
    return clean;
  }

  /**
   * Sube fotos pendientes y PERSISTE sus doc_id en IndexedDB antes de intentar
   * master/recovery. Así un reload no vuelve a subir la misma foto y los CSV
   * de contingencia nunca incluyen data:URL gigantes.
   */
  async prepareRecordAssets(record) {
    const formConfig = FORMS_CONFIG[record.formId];
    const photoFields = formConfig ? formConfig.fields.filter((f) => f.type === 'photo') : [];
    let changed = false;

    for (const field of photoFields) {
      const value = record[field.id];
      if (!value || typeof value !== 'string' || !value.startsWith('data:')) continue;

      const blob = await this.dataUrlToBlob(value);
      const docId = await this.gridClient.uploadPublicDocument(blob, `${field.id}_${record.uid}.jpg`);
      record[field.id] = docId;
      changed = true;

      const folderId = await this.getOrCreateFolderId(record.formId);
      if (folderId && docId) {
        try {
          await this.gridClient._fetchWithTimeout(
            `${location.origin}/api/v1/folders/${folderId}/documents`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ doc_id: docId }),
            }
          );
          DebugConsole.log(`Foto asociada a carpeta: ${docId}`, 'info');
        } catch (e) {
          DebugConsole.log(`No se pudo asociar foto a carpeta: ${e.message}`, 'warn');
        }
      }
    }

    if (changed) await RecordStore.updateData(record.uid, record);
    return record;
  }

  escapeRecoveryCsv(value) {
    if (value === null || value === undefined) return '';
    let str = typeof value === 'object' ? JSON.stringify(value) : String(value);
    if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
      str = '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  buildRecoveryCsv(records, meta) {
    const cleanRecords = records.map((r) => this.sanitizeRecordForRemote(r));
    const dynamicFields = [];
    const seen = new Set();
    cleanRecords.forEach((record) => {
      Object.keys(record).forEach((key) => {
        if (!seen.has(key)) { seen.add(key); dynamicFields.push(key); }
      });
    });

    const fixed = [
      '__recovery_batch_id', '__recovery_device_id', '__recovery_created_at',
      '__recovery_form_id', '__recovery_data_doc_id'
    ];
    const headers = [...fixed, ...dynamicFields, '__record_json'];
    const lines = [headers.map((h) => this.escapeRecoveryCsv(h)).join(',')];

    cleanRecords.forEach((record) => {
      const row = {
        __recovery_batch_id: meta.batchId,
        __recovery_device_id: meta.deviceId,
        __recovery_created_at: meta.createdAt,
        __recovery_form_id: meta.formId,
        __recovery_data_doc_id: this.docId,
        ...record,
        __record_json: JSON.stringify(record),
      };
      lines.push(headers.map((h) => this.escapeRecoveryCsv(row[h])).join(','));
    });
    return '\uFEFF' + lines.join('\n');
  }

  buildRecoveryFilename(formId, batchId, createdAt) {
    const compactTs = createdAt.replace(/[-:.TZ]/g, '').slice(0, 14);
    const safeDevice = String(this.deviceId || 'UNKNOWN').replace(/[^A-Za-z0-9_-]/g, '_');
    return `${this.RECOVERY_PREFIX}__${formId}__${safeDevice}__${compactTs}__${batchId}.csv`;
  }

  /**
   * Crea CSVs inmutables por lote. Primera degradación = respaldo inmediato
   * de todo lo pendiente sin backup. Después, nuevos registros se agrupan
   * hasta 50 filas o 5 minutos (máximo 100 por archivo).
   */
  async backupRecoveryForForm(formId, { force = false } = {}) {
    let totalBackedUp = 0;

    while (true) {
      const pending = this.outboxRecords
        .filter((r) => r.formId === formId && !(r.__localRecovery && r.__localRecovery.docId))
        .sort((a, b) => new Date(a.ts || 0) - new Date(b.ts || 0));

      if (pending.length === 0) break;
      const oldestAge = Date.now() - new Date(pending[0].ts || Date.now()).getTime();
      const due = force || pending.length >= this.RECOVERY_BATCH_THRESHOLD || oldestAge >= this.RECOVERY_MAX_WAIT_MS;
      if (!due) break;

      const candidates = pending.slice(0, this.RECOVERY_BATCH_MAX);
      const ready = [];
      for (const record of candidates) {
        try {
          await this.prepareRecordAssets(record);
          ready.push(record);
        } catch (e) {
          if (e.isNetworkError || e.isTimeout) throw e;
          DebugConsole.log(`Recovery: no se pudo preparar ${record.uid}: ${e.message}`, 'error');
        }
      }
      if (ready.length === 0) break;

      const createdAt = new Date().toISOString();
      const batchId = `RB_${Date.now().toString(36).toUpperCase()}_${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
      const filename = this.buildRecoveryFilename(formId, batchId, createdAt);
      const csv = this.buildRecoveryCsv(ready, {
        batchId,
        deviceId: this.deviceId,
        createdAt,
        formId,
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const docId = await this.gridClient.uploadDocument(blob, filename, {
        description: `AUDITORIAS_RECOVERY | form=${formId} | device=${this.deviceId} | batch=${batchId} | data_doc_id=${this.docId}`,
        visibility: 'public',
      });

      for (const record of ready) {
        record.__localRecovery = { docId, batchId, filename, backedUpAt: createdAt };
        await RecordStore.updateData(record.uid, record);
      }
      totalBackedUp += ready.length;
      DebugConsole.log(`Recovery CSV subido: ${filename} (${ready.length} registros, doc_id=${docId})`, 'warn');

      // force respalda todo lo acumulado; en modo normal basta un lote por tick.
      if (!force) break;
    }

    this.updatePendingBadge();
    return totalBackedUp;
  }

  /**
   * Última doca de Pre-Missort, persistida por dispositivo para que
   * reabrir el log (o recargar la app) vaya directo a escanear en vez de
   * forzar a re-elegirla cada vez — "Cambiar" arriba sigue permitiendo
   * ajustarla cuando haga falta. El destino no se persiste: cambia por
   * cada HU, se pregunta siempre.
   */
  async loadLastDoca() {
    try {
      const saved = await RecordStore.getSetting('lastDoca');
      if (saved) this.lastDoca = saved;
    } catch (e) {
      DebugConsole.log(`No se pudo leer la doca guardada: ${e.message}`, 'warn');
    }
  }

  async saveLastDoca(doca) {
    try {
      await RecordStore.setSetting('lastDoca', doca);
    } catch (e) {
      DebugConsole.log(`No se pudo guardar la doca: ${e.message}`, 'warn');
    }
  }

  updatePendingBadge() {
    const badge = document.getElementById('status-badge');
    if (badge) {
      const backed = this.outboxRecords.filter((r) => r.__localRecovery && r.__localRecovery.docId).length;
      badge.textContent = backed > 0
        ? `${this.outboxRecords.length} pendientes · ${backed} respaldados`
        : `${this.outboxRecords.length} pendientes`;
    }
  }

            </p>

            </button>

        <div style="margin-top: 32px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">

            <select id="history-window-select" style="background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 6px; padding: 4px 8px; font-size: 0.8rem;">
              <option value="5" ${this._historyWindowMinutes === 5 ? 'selected' : ''}>Últimos 5 min</option>
              <option value="15" ${this._historyWindowMinutes === 15 ? 'selected' : ''}>Últimos 15 min</option>
              <option value="30" ${this._historyWindowMinutes === 30 ? 'selected' : ''}>Últimos 30 min</option>
              <option value="60" ${this._historyWindowMinutes === 60 ? 'selected' : ''}>Última hora</option>
            </select>

    `;

    document.getElementById('history-window-select').addEventListener('change', (e) => {

    // El botón acaba de pintarse desde cero — si había una sincronización
    // en curso al momento de re-renderizar el menú, refleja ese estado de

    this.setSyncButtonState(this.syncing);

    await this.renderHistoryList();
  }

  async renderHistoryList() {
    const container = document.getElementById('history-list');
    if (!container) return;

    try {
      const entries = await RecordStore.getRecentHistory(this._historyWindowMinutes);

      if (entries.length === 0) {
        container.innerHTML = `<div style="color: var(--color-text-muted); font-size: 0.85rem; padding: 12px 0;">Sin capturas en los últimos ${this._historyWindowMinutes} minutos</div>`;
        return;
      }

      container.innerHTML = entries.map((entry) => {
        const time = new Date(entry.ts).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const statusClass = entry.synced ? 'status-success' : 'status-warn';
        const statusIcon = Icons.svg(entry.synced ? 'checkCircle' : 'infoCircle', { size: 12 });
        const statusLabel = entry.synced ? 'Sincronizado' : 'Pendiente';
        const formTitle = FORMS_CONFIG[entry.formId]?.title || entry.formId;

        return `
          <div style="background: var(--color-surface); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 600; font-size: 0.9rem;">${entry.identifier || '(sin ID)'}</div>
              <div style="font-size: 0.78rem; color: var(--color-text-muted);">${formTitle}${entry.result ? ' · ' + entry.result : ''}</div>
            </div>
            <div style="text-align: right; flex-shrink: 0;">
              <div style="font-size: 0.78rem; color: var(--color-text-muted);">${time}</div>
              <span class="status-text ${statusClass}" style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; margin-top: 2px;">${statusIcon}${statusLabel}</span>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      DebugConsole.log(`Error al cargar historial: ${e.message}`, 'error');
      container.innerHTML = `<div style="color: var(--color-text-muted); font-size: 0.85rem;">No se pudo cargar el historial</div>`;
    }
  }

  startForm(formId) {
    const formConfig = FORMS_CONFIG[formId];
    if (!formConfig) {
      DebugConsole.log(`Formulario no encontrado: ${formId}`, 'error');
      return;
    }
    if (formConfig.disabled) {
      this.showToast('Este log está deshabilitado temporalmente', 'warn');
      return;
    }

    if (formId === 'destino_doca' && Object.keys(this.catalogIndex).length === 0) {
      this.showToast(
        this.catalogAccessDenied
          ? 'Sin permiso para leer el catálogo de destino/doca'
          : 'Catálogo de destino/doca no publicado — súbelo desde el dashboard',
        'warn'
      );
      return;
    }

    // Barredura necesita leer los registros recientes (dedup 12h) antes de
    // arrancar la sesión, así que se maneja por una ruta async aparte.
    if (formId === 'barredura') {
      this.startBarredura();
      return;
    }

    // Premissort también necesita leer lo escaneado hoy (dedup global) antes
    // de arrancar la sesión.
    if (formId === 'premissort') {
      this.startPremissort();
      return;
    }

    // Contenedor Cerrado: mismo dedup global que Premissort, dispositivo aparte.
    if (formId === 'cont_cerrado') {
      this.startContCerrado();
      return;
    }

    // Auditoría HV: lee el catálogo AUDITORIA_HV antes de arrancar la sesión.
    if (formId === 'auditoria_hv') {
      this.startAuditoriaHV();
      return;
    }

    // Registro de Shipment's: lee lo ya registrado (dedup permanente) antes de arrancar la sesión.
    if (formId === 'registro_shipments') {
      this.startRegistroShipments();
      return;
    }

    this._screen = 'form';
    this.ensureBackGuard();

    const root = document.getElementById('app-root');
    root.innerHTML = '<div id="form-container"></div>';

    // Pre-Missort no usa el wizard genérico de un campo por pantalla: el
    // destino y la doca se declaran una vez por sesión y el HU se escanea
    // en loop continuo (ver DestinoDocaSession), ya que ahí la velocidad
    // contrarreloj es el punto — no tiene sentido reconfirmar destino/doca
    // en cada HU.
    if (formId === 'destino_doca') {
      this.hideNavbar();
      this.currentEngine = new DestinoDocaSession({
        catalogIndex: this.catalogIndex,
        initialDoca: this.lastDoca,
        onScan: (values) => this.onFormComplete(formId, values, { stayInSession: true }),
        onExit: () => this.renderMenu(),
      });
      this.currentEngine.render('form-container');
      return;
    }

    this.hideNavbar();
    this.currentEngine = new FormEngine(formConfig, {
      catalogIndex: this.catalogIndex,
      onComplete: (values) => this.onFormComplete(formId, values),
      onCancel: () => this.renderMenu(),
    });

    this.currentEngine.render('form-container');
  }

    const onHoldCaptured = await this.loadRecentAuditoriaHV();

    // Si el usuario ya salió mientras cargaba, no montar la sesión.
    if (this._screen !== 'form') return;

    this.hideNavbar();
    this.currentEngine = new AuditoriaHVSession({
      catalog,
      onHoldCaptured,
      onScan: (values) => this.onFormComplete('auditoria_hv', values, { stayInSession: true }),
      onExit: () => this.renderMenu(),
    });
    this.currentEngine.render('form-container');
  }

  /**
   * Arranque de Registro de Shipment's: lee lo ya registrado (dedup
   * permanente) mostrando un placeholder, y luego instancia la sesión.
   */
  async startRegistroShipments() {
    this._screen = 'form';
    this.ensureBackGuard();

    const root = document.getElementById('app-root');
    root.innerHTML = `
      <div id="form-container">
        <div class="step-screen">
          <div class="step-progress-row">
            <div class="step-progress">Registro de Shipment's</div>
          </div>
          <h1 class="step-question">Cargando…</h1>
          <div class="step-support">Leyendo lo ya registrado para la deduplicación.</div>
        </div>
      </div>
    `;

    const registered = await this.loadRecentRegistroShipments();

    // Si el usuario ya salió mientras cargaba, no montar la sesión.
    if (this._screen !== 'form') return;

    this.hideNavbar();
    this.currentEngine = new RegistroShipmentsSession({
      registered,
      onScan: (values) => this.onFormComplete('registro_shipments', values, { stayInSession: true }),
      onExit: () => this.renderMenu(),
    });
    this.currentEngine.render('form-container');
  }

  async onFormComplete(formId, values, { stayInSession = false } = {}) {
    try {
      DebugConsole.log('Procesando registro...', 'info');
      if (!stayInSession) LoadingOverlay.show('Guardando...');

      if (formId === 'destino_doca') {
        this.lastDoca = values.doca;
        this.saveLastDoca(values.doca);
      }

      if (formId === 'barredura') {
        this.lastLugar = values.lugar;
        this.saveLastLugar(values.lugar);
      }

      const ts = new Date().toISOString();
      const uid = RecordStore.genUid(formId);

      // dedupe_key: identidad de negocio del artículo (no del evento de
      // captura) — ver comentario en DEDUPE_FIELD_MAP.
      const dedupeInfo = DEDUPE_FIELD_MAP[formId];
      const dedupeKey = dedupeInfo ? buildDedupeKey(formId, dedupeInfo.type, values[dedupeInfo.field]) : null;

      const record = {
        uid,
        ts,
        formId,
        ...values,
        auditoria: this.userLdap,
        ...(dedupeKey ? { dedupe_key: dedupeKey } : {}),
      };

      // Store locally
      await RecordStore.put(uid, formId, record);
      this.outboxRecords.push(record);
      this.updatePendingBadge();

      // Historial del dispositivo (independiente de la cola de sync). Cada
      // log usa nombres de campo distintos para su identificador/resultado
      // (HISTORY_FIELD_MAP), así que el historial no puede asumir
      // "shipment"/"resultado" a secas como hacía el log único original.
      const historyFields = HISTORY_FIELD_MAP[formId] || {};
      await RecordStore.addHistory({
        uid,
        ts,
        formId,
        identifier: record[historyFields.id] || '',
        result: record[historyFields.result] || '',
        synced: false,
      });

      DebugConsole.log(`Registro guardado localmente (${uid})`, 'info');

      // Try to sync immediately if online. En modo loop (stayInSession) NO
      // se espera la sincronización: el operador debe poder seguir
      // escaneando de inmediato mientras flushOutbox corre en segundo
      // plano — esperar aquí bloqueaba cada escaneo con el round-trip de
      // red completo de TODA la cola pendiente, no solo de este registro.
      if (navigator.onLine) {
        if (!stayInSession) {
          LoadingOverlay.show('Sincronizando con Grid...');
          await this.flushOutbox();
          LoadingOverlay.success('Guardado');
        } else {
          // Debounce (10 pendientes o 5s) en vez de flush inmediato: agrupa
          // varios escaneos seguidos en un solo GET+PUT por shard.
          this.scheduleSyncDebounced();
        }
      } else if (!stayInSession) {
        LoadingOverlay.success('Guardado local');
        this.showToast('Guardado local — se sincronizará al reconectar', 'info');
      }

      if (!stayInSession) this.renderMenu();
    } catch (e) {
      DebugConsole.log(`Error al guardar: ${e.message}`, 'error');
      if (!stayInSession) LoadingOverlay.error('Error al guardar');
      this.showToast('Error al guardar el registro', 'error');
    }
  }

  /**
   * Bucket protegido para escribir: shard diario si el formId está
   * shardeado (con el atajo de "shard nuevo legítimo" vía shard_registry),
   * o el {formId}_master de siempre para el resto. dateKey es la fecha
   * (hora de México) de los registros que se van a escribir — todos los
   * registros de un mismo lote comparten shard porque flushOutbox ya los
   * agrupa por bucketName antes de llamar aquí.
   */
  async getProtectedBucketForWrite(formId, bucketName, dateKey) {
    if (this._knownShards.has(bucketName)) {
      return this.gridClient.getStateBucketForProtectedMasterWrite(bucketName, 3);
    }
    if (!SHARDED_FORMS.has(formId)) {
      return this.gridClient.getMasterBucketForWrite(formId, bucketName, 3);
    }
    return this.gridClient.getShardBucketForWrite(formId, bucketName, dateKey, 3);
  }

  /**
   * Sube un lote de registros (todos del mismo formId + mismo bucket) con
   * fail-closed + OCC + confirmación de UIDs. Reemplaza al syncOneRecord de
   * antes: para formularios no shardeados el "lote" casi siempre es de 1
   * registro (se comporta igual que antes), y para los de escaneo en loop
   * agrupa varios escaneos en un solo GET+PUT en vez de uno por registro.
   * Nunca convierte null/[] ambiguo en {records:[]}.
   */
  async syncRecordsBatch(formId, bucketName, dateKey, records, attempt = 0) {
    for (const record of records) await this.prepareRecordAssets(record);

    if (this.isMasterCircuitOpen(bucketName)) {
      const err = new Error(`Circuit breaker abierto para ${bucketName}`);
      err.isMasterCircuitOpen = true;
      err.formId = formId;
      throw err;
    }

    let bucket;
    try {
      bucket = await this.getProtectedBucketForWrite(formId, bucketName, dateKey);
    } catch (e) {
      if (e.isAmbiguousMaster) {
        e.formId = formId;
        e.circuitJustOpened = this.openMasterCircuit(bucketName, e.message);
      }
      throw e;
    }

    const existing = new Set(bucket.records.map((r) => r && r.uid).filter(Boolean));
    const toAdd = records.filter((r) => !existing.has(r.uid));
    const alreadyThereUids = records.filter((r) => existing.has(r.uid)).map((r) => r.uid);

    if (toAdd.length === 0) {
      this.closeMasterCircuit(bucketName);
      this._knownShards.add(bucketName);
      return alreadyThereUids;
    }

    bucket.initialized = true;
    if (!bucket.version) bucket.version = 1;
    bucket.records.push(...toAdd.map((r) => this.sanitizeRecordForRemote(r)));

    const result = await this.gridClient.setStateBucket(bucketName, bucket);
    if (result?.conflict) {
      if (attempt >= 5) throw new Error('Demasiados conflictos de escritura simultánea — intenta de nuevo');
      await new Promise((r) => setTimeout(r, 400 + Math.random() * 400));
      return this.syncRecordsBatch(formId, bucketName, dateKey, records, attempt + 1);
    }
    if (!result?.ok) throw new Error(`No se confirmó la escritura de ${bucketName}`);

    const confirmed = await this.gridClient.confirmRecordsPresent(bucketName, toAdd.map((r) => r.uid), 3);
    if (!confirmed) {
      const err = new Error(`PUT aceptado pero algunos UID aún no son visibles en ${bucketName}`);
      err.isWriteUnconfirmed = true;
      err.formId = formId;
      err.circuitJustOpened = this.openMasterCircuit(bucketName, err.message);
      throw err;
    }

    this.closeMasterCircuit(bucketName);
    this._knownShards.add(bucketName);
    if (SHARDED_FORMS.has(formId)) {
      this.gridClient.markShardCreated(formId, dateKey).catch((e) =>
        DebugConsole.log(`markShardCreated ${formId}/${dateKey}: ${e.message}`, 'warn')
      );
    } else {
      this.gridClient.markMasterCreated(formId).catch((e) =>
        DebugConsole.log(`markMasterCreated ${formId}: ${e.message}`, 'warn')
      );
    }
    return [...alreadyThereUids, ...toAdd.map((r) => r.uid)];
  }

  // Alterna el estado visual del botón "Sincronizar Ahora" (deshabilitado +
  // ícono girando) mientras hay una sincronización en curso. Se llama tanto
  // desde flushOutbox como al final de renderMenu, por si el menú se
  // vuelve a pintar mientras this.syncing sigue en true.
  setSyncButtonState(syncing) {
    const btn = document.getElementById('btn-sync-now');
    if (!btn) return;
    btn.disabled = syncing;
    btn.style.opacity = syncing ? '0.6' : '';
    btn.style.cursor = syncing ? 'not-allowed' : '';
    const label = btn.querySelector('.btn-sync-now-label');
    if (label) label.textContent = syncing ? 'Sincronizando...' : 'Reintentar ahora';
    const icon = btn.querySelector('svg');
    if (icon) icon.classList.toggle('spinning', syncing);
  }

  async flushOutbox({ silent = false } = {}) {
    if (this.outboxRecords.length === 0) {
      if (!silent) this.showToast('No hay registros pendientes', 'info');
      return;
    }

    if (!navigator.onLine) {
      if (!silent) this.showToast('Sin conexión — se reintentará al reconectar', 'warn');
      return;
    }

    if (this.syncing) {
      DebugConsole.log('Sincronización ya en curso — se ignora la llamada duplicada', 'info');
      return;
    }

    this.syncing = true;
    this.setSyncButtonState(true);

    try {
      DebugConsole.log('Sincronizando registros...', 'info');
      const synced = [];
      const blockedForms = new Set();
      const forceRecoveryForms = new Set();
      let networkDown = false;
      let rateLimited = false;
      let recoveryBacked = 0;

      // Agrupar por (formId, bucketName real) — para los formularios
      // shardeados, bucketName incluye la fecha del registro, así que un
      // mismo formId puede tener varios grupos si el lote cruza medianoche.
      // El grupo entero se sube en un solo GET+PUT en vez de uno por
      // registro (ver syncRecordsBatch).
      const groups = new Map(); // bucketName -> { formId, dateKey, records[] }
      for (const record of [...this.outboxRecords]) {
        if (blockedForms.has(record.formId)) continue;
        const dateKey = shardDateKeyMexico(record.ts);
        const bucketName = masterBucketNameFor(record.formId, dateKey);
        if (!groups.has(bucketName)) groups.set(bucketName, { formId: record.formId, dateKey, records: [] });
        groups.get(bucketName).records.push(record);
      }

      for (const [bucketName, group] of groups) {
        if (networkDown || rateLimited) break;
        if (blockedForms.has(group.formId)) continue;
        try {
          const okUids = await this.syncRecordsBatch(group.formId, bucketName, group.dateKey, group.records);
          synced.push(...okUids);
          for (const uid of okUids) await RecordStore.markHistorySynced(uid);
          DebugConsole.log(`Sincronizados ${okUids.length} en ${bucketName}`, 'info');
        } catch (e) {
          if (e.isNetworkError || e.isTimeout) {
            DebugConsole.log(`Sin conexión real con Grid: ${e.message} — se detiene el lote`, 'warn');
            networkDown = true;
            break;
          }

          // Rate limit no significa que el master sea ambiguo — no abrir
          // circuito ni forzar recovery (eso solo generaría más peticiones
          // durante la ráfaga). Solo detener el lote; el freno global de
          // GridClient ya está pausando las próximas peticiones.
          if (e.isRateLimited) {
            DebugConsole.log(`${bucketName}: 429 — se detiene el lote, reintenta el freno global`, 'warn');
            rateLimited = true;
            break;
          }

          if (e.isAmbiguousMaster || e.isMasterCircuitOpen || e.isWriteUnconfirmed) {
            const formId = e.formId || group.formId;
            blockedForms.add(formId);
            if (e.circuitJustOpened) forceRecoveryForms.add(formId);
            DebugConsole.log(`${bucketName}: master no confiable — se conmuta a recovery sin escribir el master`, 'warn');
            continue;
          }

          DebugConsole.log(`Error al sincronizar lote de ${bucketName}: ${e.message}`, 'error');
        }
      }

      // Eliminar SOLO UIDs confirmados presentes en master.
      for (const uid of synced) await RecordStore.delete(uid);
      this.outboxRecords = this.outboxRecords.filter((r) => !synced.includes(r.uid));

      // Segunda vía automática: un master degradado nunca recibe PUT; los
      // pendientes se respaldan como CSV inmutable en Grid. No se dispara
      // durante un rate limit — sería más tráfico justo cuando Grid pidió
      // frenar.
      if (!networkDown && !rateLimited) {
        for (const formId of blockedForms) {
          try {
            recoveryBacked += await this.backupRecoveryForForm(formId, {
              force: forceRecoveryForms.has(formId),
            });
          } catch (e) {
            if (e.isNetworkError || e.isTimeout) {
              networkDown = true;
              DebugConsole.log(`Recovery sin conexión: ${e.message}`, 'warn');
              break;
            }
            if (e.isRateLimited) {
              rateLimited = true;
              DebugConsole.log(`Recovery: 429 — se detiene`, 'warn');
              break;
            }
            DebugConsole.log(`Recovery ${formId} falló: ${e.message}`, 'error');
          }
        }
      }

      this.updatePendingBadge();

      if (!silent) {
        if (rateLimited) {
          this.showToast(`Grid está limitando las peticiones — ${this.outboxRecords.length} pendiente(s), reintenta en unos segundos`, 'warn');
        } else if (networkDown) {
          this.showToast(`Sin conexión con Grid — ${this.outboxRecords.length} pendiente(s) locales`, 'warn');
        } else if (recoveryBacked > 0) {
          this.showToast(`${recoveryBacked} registro(s) respaldados en Grid; master pendiente`, 'warn');
        } else if (synced.length > 0) {
          this.showToast(`${synced.length} registros sincronizados`, 'success');
        } else if (blockedForms.size > 0) {
          const backed = this.outboxRecords.filter((r) => r.__localRecovery && r.__localRecovery.docId).length;
          this.showToast(`Master temporalmente no confiable · ${backed} pendiente(s) ya respaldados`, 'info');
        } else if (this.outboxRecords.length > 0) {
          this.showToast('Sincronización pendiente — se reintentará automáticamente', 'warn');
        }
      }

      if (synced.length > 0) DebugConsole.log(`${synced.length} registros sincronizados`, 'info');
      if (document.getElementById('history-list')) this.renderHistoryList();
    } finally {
      this.syncing = false;
      this.setSyncButtonState(false);
    }
  }

  /**
   * Convierte una data: URL a Blob sin usar fetch(). fetch(dataUrl) no
   * toca la red (el navegador la resuelve localmente), pero el CSP/sandbox
   * del iframe donde Grid monta el documento bloquea igual esa llamada y
   * revienta con el mismo "TypeError: Failed to fetch" que un fallo de red
   * real — decodificar el base64 a mano evita el fetch por completo.
   */
  dataUrlToBlob(dataUrl) {
    const commaIdx = dataUrl.indexOf(',');
    const header = dataUrl.slice(5, commaIdx); // quita "data:"
    const data = dataUrl.slice(commaIdx + 1);
    const mime = (header.split(';')[0] || 'application/octet-stream') || 'application/octet-stream';
    const isBase64 = header.includes('base64');

    if (isBase64) {
      const binary = atob(data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    }
    return new Blob([decodeURIComponent(data)], { type: mime });
  }

  showToast(message, type = 'info') {
    const iconByType = { error: 'alertCircle', success: 'checkCircle', warn: 'alertCircle', info: 'infoCircle' };
    const toast = document.createElement('div');
    toast.className = `alert alert-${type}`;
    toast.innerHTML = `
      <span class="alert-icon">${Icons.svg(iconByType[type] || 'infoCircle', { size: 16 })}</span>
      <span>${message}</span>
    `;

    const root = document.getElementById('app-root');
    if (root) {
      root.insertBefore(toast, root.firstChild);
      setTimeout(() => toast.remove(), 3000);
    }
  }

  renderError(message) {
    const root = document.getElementById('app-root');
    root.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">${Icons.svg('alertCircle', { size: 48 })}</div>
        <p style="font-size: 1rem; margin-bottom: 16px;">${message}</p>
        <button onclick="location.reload()" class="btn btn-primary">Reintentar</button>
      </div>
    `;
  }
}

// Initialize app
window.app = new CapturaApp();
window.app.init();

// Handle online/offline
window.addEventListener('online', () => {
  DebugConsole.log('Reconectado a internet', 'info');
  window.app.flushOutbox();
});

window.addEventListener('offline', () => {
  DebugConsole.log('Perdida de conexión', 'warn');
});
</script>

<script>
/* Grid: only allow approved Grid domains to open unsandboxed tabs */
(function(){
  var allowedHosts = ["figma.com", "www.figma.com", "furydocs.io", "zeroheight.com", "google.com", "docs.google.com", "meet.google.com", "grid.adminml.com", "grid-artifacts.adminml.com", "mercadolibre.atlassian.net", "mercadolibre-opsgenie.atlassian.net", "app.datadoghq.com", "grafana-service.furycloud.io", "web.furycloud.io", "nasdaq-meli.app.opsgenie.com", "meli.enterprise.slack.com"];
  var allowedSuffixes = [".adminml.com", ".atlassian.net", ".google.com", ".furycloud.io", ".melioffice.com", ".melisystems.com"];
  var allowedPathPrefixes = {"github.com": ["/melisource/"], "www.github.com": ["/melisource/"]};
  function normalizeUrl(rawUrl){
    try {
      return new URL(String(rawUrl || ""), window.location.href);
    } catch (_err) {
      return null;
    }
  }
  function isAllowedUrl(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed) return false;
    if(parsed.protocol === "slack:") return true;
    if(parsed.protocol !== "https:") return false;
    var h = (parsed.hostname || "").toLowerCase();
    if(!h) return false;
    if(allowedHosts.indexOf(h) !== -1) return true;
    for(var i = 0; i < allowedSuffixes.length; i++){
      var s = allowedSuffixes[i];
      if(h === s.slice(1) || (h.length > s.length && h.slice(-s.length) === s)) return true;
    }
    var pathPrefixes = allowedPathPrefixes[h];
    if(pathPrefixes){
      var p = parsed.pathname || "/";
      for(var j = 0; j < pathPrefixes.length; j++){
        if(p.slice(0, pathPrefixes[j].length) === pathPrefixes[j]) return true;
      }
    }
    return false;
  }
  function requestParentPopup(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed || !window.parent || window.parent === window) return false;
    try {
      window.parent.postMessage({type: "grid-open-safe-popup", url: parsed.href}, window.location.origin);
      return true;
    } catch (_err) {
      return false;
    }
  }

  document.addEventListener("click", function(event){
    var target = event.target;
    var anchor = target && target.closest ? target.closest("a[href]") : null;
    if(!anchor) return;
    var href = anchor.getAttribute("href") || "";
    if(!href || href.charAt(0) === "#") return;
    var opensNewTab = anchor.target === "_blank" || event.ctrlKey || event.metaKey || event.button === 1;
    if(!opensNewTab) return;
    if(!isAllowedUrl(href)) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    if(requestParentPopup(href)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  var nativeOpen = window.open;
  window.open = function(rawUrl, target, features){
    if(!isAllowedUrl(rawUrl)) return null;
    if(requestParentPopup(rawUrl)) return null;
    return nativeOpen ? nativeOpen.call(window, normalizeUrl(rawUrl).href, target, features) : null;
  };
})();
</script>
<script>
/* Grid: video/audio embed diagnostics & proxy fallback */
(function(){
  var TAG='[Grid:media-diag]';
  function patchMedia(el){
    if(el._gridPatched) return;
    el._gridPatched=true;
    el.addEventListener('error',function handler(ev){
      var src=el.currentSrc||el.src||'';
      var code=el.error?el.error.code:'?';
      var msg=el.error?el.error.message:'unknown';
      console.warn(TAG,'load failed',{tag:el.tagName,src:src,code:code,message:msg});
      var origSrc=el.getAttribute('src')||'';
      if(origSrc && origSrc.indexOf('proxy=1')===-1 && origSrc.indexOf('://')===-1){
        var proxySrc=origSrc+(origSrc.indexOf('?')!==-1?'&':'?')+'proxy=1';
        console.info(TAG,'retrying via proxy',proxySrc);
        el.removeEventListener('error',handler);
        el.src=proxySrc;
        el.load();
      }
    },true);
  }
  document.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
  var obs=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType!==1)return;
        if(/^(VIDEO|AUDIO|SOURCE)$/.test(n.tagName))patchMedia(n);
        if(n.querySelectorAll){
          n.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
        }
      });
    });
  });
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>
/* Grid: sync iframe URL mutations to parent address bar */
(function(){
  function notifyParent(search, hash){
    if(!window.parent || window.parent === window) return;
    try{
      window.parent.postMessage(
        {type:"grid-url-sync", search:search, hash:hash},
        window.location.origin
      );
    }catch(_){}
  }
  function parseAndNotify(url){
    try{
      var p = new URL(String(url), window.location.href);
      notifyParent(p.search, p.hash);
    }catch(_){}
  }
  var _push = history.pushState.bind(history);
  var _replace = history.replaceState.bind(history);
  history.pushState = function(state, title, url){
    _push(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  history.replaceState = function(state, title, url){
    _replace(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  window.addEventListener("hashchange", function(){
    notifyParent(window.location.search, window.location.hash);
  });
})();
</script>

    if(!parsed) return false;
    if(parsed.protocol === "slack:") return true;
    if(parsed.protocol !== "https:") return false;
    var h = (parsed.hostname || "").toLowerCase();
    if(!h) return false;
    if(allowedHosts.indexOf(h) !== -1) return true;
    for(var i = 0; i < allowedSuffixes.length; i++){
      var s = allowedSuffixes[i];
      if(h === s.slice(1) || (h.length > s.length && h.slice(-s.length) === s)) return true;
    }
    var pathPrefixes = allowedPathPrefixes[h];
    if(pathPrefixes){
      var p = parsed.pathname || "/";
      for(var j = 0; j < pathPrefixes.length; j++){
        if(p.slice(0, pathPrefixes[j].length) === pathPrefixes[j]) return true;
      }
    }
    return false;
  }
  function requestParentPopup(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed || !window.parent || window.parent === window) return false;
    try {
      window.parent.postMessage({type: "grid-open-safe-popup", url: parsed.href}, window.location.origin);
      return true;
    } catch (_err) {
      return false;
    }
  }
  /* Open synchronously from the parent window, inside the click's call stack, so
     the browser keeps the transient user activation (a click in a same-origin
     child propagates activation to its ancestors). Forwarding via postMessage
     runs window.open in an async handler, which popup blockers reject.
     We deliberately open WITHOUT the "noopener" feature: with it the browser
     returns null even on success, so a genuinely blocked popup would be
     indistinguishable from a successful one. Instead we detect a real block via a
     null handle and sever the opener ourselves.
     Returns true only when a tab actually opened; false when there is no
     accessible parent, the call throws (opaque/cross-origin), or the popup was
     blocked — the caller then lets the native target="_blank" run.
     SECURITY: rawUrl is always gated by isAllowedUrl() first, and popup.opener is
     nulled to prevent reverse tabnabbing (equivalent guarantee to "noopener"). */
  function openInParent(rawUrl){
    if(!window.parent || window.parent === window) return false;
    var parsed = normalizeUrl(rawUrl);
    if(!parsed) return false;
    try {
      var popup = window.parent.open(parsed.href, "_blank");
      if(!popup) return false;
      try { popup.opener = null; } catch (_e) {}
      return true;
    } catch (_err) {
      return false;
    }
  }

  document.addEventListener("click", function(event){
    var target = event.target;
    var anchor = target && target.closest ? target.closest("a[href]") : null;
    if(!anchor) return;
    var href = anchor.getAttribute("href") || "";
    if(!href || href.charAt(0) === "#") return;
    var opensNewTab = anchor.target === "_blank" || event.ctrlKey || event.metaKey || event.button === 1;
    if(!opensNewTab) return;
    // SECURITY: only allowlisted destinations may escape the sandbox.
    if(!isAllowedUrl(href)) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    /* Open a clean tab from the unsandboxed parent, within the click gesture.
       Suppress the native navigation ONLY when the parent open actually
       succeeded; otherwise (no parent, cross-origin, or popup blocked) let the
       native target="_blank" proceed so the allowed link still opens. We do NOT
       fall back to the async postMessage bridge here: by the time it runs the
       user activation is gone, so it cannot reopen a blocked popup — it would
       just swallow the click and leave the link dead. */
    if(openInParent(href)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  var nativeOpen = window.open;
  window.open = function(rawUrl, target, features){
    if(!isAllowedUrl(rawUrl)) return null;
    if(openInParent(rawUrl)) return null;
    if(requestParentPopup(rawUrl)) return null;
    return nativeOpen ? nativeOpen.call(window, normalizeUrl(rawUrl).href, target, features) : null;
  };
})();
</script>
<script>
/* Grid: video/audio embed diagnostics & proxy fallback */
(function(){
  var TAG='[Grid:media-diag]';
  function patchMedia(el){
    if(el._gridPatched) return;
    el._gridPatched=true;
    el.addEventListener('error',function handler(ev){
      var src=el.currentSrc||el.src||'';
      var code=el.error?el.error.code:'?';
      var msg=el.error?el.error.message:'unknown';
      console.warn(TAG,'load failed',{tag:el.tagName,src:src,code:code,message:msg});
      var origSrc=el.getAttribute('src')||'';
      if(origSrc && origSrc.indexOf('proxy=1')===-1 && origSrc.indexOf('://')===-1){
        var proxySrc=origSrc+(origSrc.indexOf('?')!==-1?'&':'?')+'proxy=1';
        console.info(TAG,'retrying via proxy',proxySrc);
        el.removeEventListener('error',handler);
        el.src=proxySrc;
        el.load();
      }
    },true);
  }
  document.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
  var obs=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType!==1)return;
        if(/^(VIDEO|AUDIO|SOURCE)$/.test(n.tagName))patchMedia(n);
        if(n.querySelectorAll){
          n.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
        }
      });
    });
  });
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>
/* Grid: sync iframe URL mutations to parent address bar */
(function(){
  function notifyParent(search, hash){
    if(!window.parent || window.parent === window) return;
    try{
      window.parent.postMessage(
        {type:"grid-url-sync", search:search, hash:hash},
        window.location.origin
      );
    }catch(_){}
  }
  function parseAndNotify(url){
    try{
      var p = new URL(String(url), window.location.href);
      notifyParent(p.search, p.hash);
    }catch(_){}
  }
  var _push = history.pushState.bind(history);
  var _replace = history.replaceState.bind(history);
  history.pushState = function(state, title, url){
    _push(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  history.replaceState = function(state, title, url){
    _replace(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  window.addEventListener("hashchange", function(){
    notifyParent(window.location.search, window.location.hash);
  });
})();
</script>
