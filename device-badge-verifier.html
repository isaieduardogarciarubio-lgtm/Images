<script>(function(){function _ok(r,onOk){return r.json().then(function(b){if(!r.ok)throw b;onOk(b);return b;});}window.GRID=window.GRID||{};window.GRID._stateUpdatedAtByName=window.GRID._stateUpdatedAtByName||{};window.GRID.states={get:function(name){var n=String(name||'').trim();if(!n)return Promise.reject({error:'validation_error',detail:'state name is required'});return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/states/'+encodeURIComponent(n)).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAtByName[n]=b.updated_at||'';});});},set:function(name,data,ifUpdatedAt){var n=String(name||'').trim();if(!n)return Promise.reject({error:'validation_error',detail:'state name is required'});return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/states/'+encodeURIComponent(n),{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:data,if_updated_at:(typeof ifUpdatedAt==='string'?ifUpdatedAt:(window.GRID._stateUpdatedAtByName[n]||''))})}).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAtByName[n]=b.updated_at||'';});});},patch:function(name,patchData,ifUpdatedAt){var n=String(name||'').trim();if(!n)return Promise.reject({error:'validation_error',detail:'state name is required'});return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/states/'+encodeURIComponent(n),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({patch:patchData,if_updated_at:(typeof ifUpdatedAt==='string'?ifUpdatedAt:(window.GRID._stateUpdatedAtByName[n]||''))})}).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAtByName[n]=b.updated_at||'';});});}};window.GRID.state={get:function(){return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/state',{credentials:'include'}).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAt=b.updated_at||'';});});},set:function(data,ifUpdatedAt){return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/state',{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:data,if_updated_at:(typeof ifUpdatedAt==='string'?ifUpdatedAt:(window.GRID._stateUpdatedAt||''))})}).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAt=b.updated_at||'';});});},patch:function(patchData,ifUpdatedAt){return fetch('/api/v1/documents/'+encodeURIComponent(window.GRID.docId)+'/state',{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({patch:patchData,if_updated_at:(typeof ifUpdatedAt==='string'?ifUpdatedAt:(window.GRID._stateUpdatedAt||''))})}).then(function(r){return _ok(r,function(b){window.GRID._stateUpdatedAt=b.updated_at||'';});});}};}());</script></head>

  <script>
/* ──────────────────────────────────────────────────────────────── */
/* MELI CRYPTOGRAPHY LIBRARY                                        */
/* WebCrypto-based ECDSA P-256, AES-256-GCM, PBKDF2, SHA-256       */
/* ──────────────────────────────────────────────────────────────── */

const CryptoLib = (() => {
  const ITERATIONS = 310000;
  const ALGORITHM_ECDSA = { name: 'ECDSA', namedCurve: 'P-256' };
  const HASH_ALGO = 'SHA-256';

  return {
    /* Generate random passphrase in format MELI-XXXX-XXXX-XXXX-XXXX */
    generatePassphrase() {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let passphrase = 'MELI-';
      for (let i = 0; i < 4; i++) {
        let segment = '';
        for (let j = 0; j < 4; j++) {
          const idx = Math.floor(Math.random() * chars.length);
          segment += chars[idx];
        }
        passphrase += segment;
        if (i < 3) passphrase += '-';
      }
      return passphrase;
    },

    /* Generate ECDSA P-256 key pair */
    async generateKeyPair() {
      return await crypto.subtle.generateKey(
        ALGORITHM_ECDSA,
        true,
        ['sign', 'verify']
      );
    },

    /* Export public key to JWK */
    async exportPublicKey(publicKey) {
      return await crypto.subtle.exportKey('jwk', publicKey);
    },

    /* Import public key from JWK */
    async importPublicKey(jwk) {
      return await crypto.subtle.importKey(
        'jwk',
        jwk,
        ALGORITHM_ECDSA,
        false,
        ['verify']
      );
    },

    /* Import private key from JWK */
    async importPrivateKey(jwk) {
      return await crypto.subtle.importKey(
        'jwk',
        jwk,
        ALGORITHM_ECDSA,
        false,
        ['sign']
      );
    },

    /* Encrypt private key with passphrase using PBKDF2 + AES-256-GCM */
    async encryptPrivateKey(privateKey, passphrase) {
      const privateJwk = await crypto.subtle.exportKey('jwk', privateKey);
      const privateJsonStr = JSON.stringify(privateJwk);
      const privateBytes = new TextEncoder().encode(privateJsonStr);

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const passphraseKey = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(passphrase),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: ITERATIONS,
          hash: HASH_ALGO
        },
        passphraseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt']
      );

      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        aesKey,
        privateBytes
      );

      return {
        ciphertext: this._toBase64Url(new Uint8Array(ciphertext)),
        salt: this._toBase64Url(salt),
        iv: this._toBase64Url(iv)
      };
    },

    /* Decrypt private key with passphrase */
    async decryptPrivateKey(ciphertextB64, passphrase, saltB64, ivB64) {
      const ciphertext = this._fromBase64Url(ciphertextB64);
      const salt = this._fromBase64Url(saltB64);
      const iv = this._fromBase64Url(ivB64);

      const passphraseKey = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(passphrase),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: ITERATIONS,
          hash: HASH_ALGO
        },
        passphraseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      // AES-GCM's authentication tag check fails (throws OperationError) when
      // the passphrase is wrong, since it derives a different key. Surface
      // that as a clear message instead of a cryptic browser crypto error.
      let privateBytes;
      try {
        privateBytes = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv },
          aesKey,
          ciphertext
        );
      } catch {
        throw new Error('Passphrase incorrecta');
      }

      const privateJsonStr = new TextDecoder().decode(privateBytes);
      return JSON.parse(privateJsonStr);
    },

    /* Canonical JSON (deterministic) */
    canonicalize(value) {
      if (value === null) return 'null';
      if (typeof value === 'string') return JSON.stringify(value);
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (Array.isArray(value)) {
        return '[' + value.map(v => this.canonicalize(v)).join(',') + ']';
      }
      if (typeof value === 'object') {
        const keys = Object.keys(value).sort();
        const items = keys.map(k => JSON.stringify(k) + ':' + this.canonicalize(value[k]));
        return '{' + items.join(',') + '}';
      }
      return '';
    },

    /* Sign payload with private key */
    async signPayload(payload, privateKey) {
      const canonical = this.canonicalize(payload);
      const message = new TextEncoder().encode(canonical);

      const signature = await crypto.subtle.sign(
        { name: 'ECDSA', hash: HASH_ALGO },
        privateKey,
        message
      );

      return this._toBase64Url(new Uint8Array(signature));
    },

    /* Verify payload signature with public key */
    async verifySignature(payload, signature, publicKey) {
      try {
        const canonical = this.canonicalize(payload);
        const message = new TextEncoder().encode(canonical);
        const signatureBytes = this._fromBase64Url(signature);

        return await crypto.subtle.verify(
          { name: 'ECDSA', hash: HASH_ALGO },
          publicKey,
          signatureBytes,
          message
        );
      } catch {
        return false;
      }
    },

    /* SHA-256 hash */
    async sha256(data) {
      let bytes;
      if (typeof data === 'string') {
        bytes = new TextEncoder().encode(data);
      } else {
        bytes = data;
      }

      const hashBuffer = await crypto.subtle.digest(HASH_ALGO, bytes);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    },

    /* Base64URL encode/decode */
    _toBase64Url(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    },

    _fromBase64Url(str) {
      str = str
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }
  };
})();

/* ──────────────────────────────────────────────────────────────── */
/* MELI GRID API WRAPPER                                            */
/* Unified interface for reading/writing state buckets and states   */
/* ──────────────────────────────────────────────────────────────── */

const GridAPI = (() => {
  const MAX_RETRIES = 3;
  const RETRY_DELAY = 500;

  async function retry(fn) {
    for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
      try {
        return await fn();
      } catch (err) {
        if (attempt < MAX_RETRIES - 1 && err.status === 409) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * Math.pow(2, attempt)));
        } else {
          throw err;
        }
      }
    }
  }

  async function fetchJson(url, options = {}) {
    const opts = {
      credentials: 'include',
      ...options
    };
    // Mutate opts itself (not the discarded `options`) so the serialized
    // body and Content-Type header actually reach the fetch() call below.
    if (opts.body && typeof opts.body === 'object') {
      opts.headers = { ...opts.headers, 'Content-Type': 'application/json' };
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(url, opts);
    if (!res.ok) {
      // Surface Grid's actual error detail instead of just the status code,
      // so validation failures (e.g. 422) are actionable instead of opaque.
      let detail = '';
      try {
        const body = await res.json();
        detail = body && (body.detail || body.error || body.message)
          ? (typeof (body.detail || body.error || body.message) === 'string'
              ? (body.detail || body.error || body.message)
              : JSON.stringify(body.detail || body.error || body.message))
          : JSON.stringify(body);
      } catch {
        try { detail = await res.text(); } catch {}
      }
      const err = new Error(`HTTP ${res.status}${detail ? ': ' + detail : ''}`);
      err.status = res.status;
      err.detail = detail;
      throw err;
    }
    return res.json();
  }

  return {
    /* Get current user info from /api/v1/me */
    async getMe() {
      return fetchJson('/api/v1/me');
    },

    /* Read state bucket by name. defaultValue is returned when the bucket
       has never been written (Grid returns 200 with state: null, not 404). */
    async readState(name, defaultValue = null) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }
      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      let res;
      try {
        res = await fetchJson(url);
      } catch (err) {
        // Some Grid deployments 404 a state bucket that was never written.
        if (err.status === 404) return defaultValue;
        throw err;
      }
      if (window.GRID._stateUpdatedAtByName) {
        window.GRID._stateUpdatedAtByName[name] = res.updated_at;
      }
      const state = res.state;
      if (state === undefined || state === null) return defaultValue;
      // Shape mismatch (e.g. Grid returned {} for a bucket we expect as an
      // array) means the bucket hasn't really been initialized with our data.
      if (Array.isArray(defaultValue) && !Array.isArray(state)) return defaultValue;
      return state;
    },

    /* Grid's named state buckets must be top-level JSON objects — a bucket
       whose meaningful content is an array (issuer_keys, badge_ledger_*)
       is stored wrapped as { list: [...] } and unwrapped here so callers
       can keep treating it as a plain array. */
    async readList(name) {
      const wrapped = await this.readState(name, { list: [] });
      return Array.isArray(wrapped.list) ? wrapped.list : [];
    },

    async writeList(name, arr) {
      return this.setState(name, { list: arr });
    },

    /* Write state bucket (PUT with control optimistic) */
    async setState(name, state) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }

      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      const ifUpdatedAt = window.GRID._stateUpdatedAtByName && window.GRID._stateUpdatedAtByName[name];

      const fn = async () => {
        const res = await fetchJson(url, {
          method: 'PUT',
          body: { state, if_updated_at: ifUpdatedAt || '' }
        });
        if (window.GRID._stateUpdatedAtByName) {
          window.GRID._stateUpdatedAtByName[name] = res.updated_at;
        }
        return res;
      };

      return retry(fn);
    },

    /* Patch state bucket */
    async patchState(name, patch) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }

      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      const ifUpdatedAt = window.GRID._stateUpdatedAtByName && window.GRID._stateUpdatedAtByName[name];

      const fn = async () => {
        const res = await fetchJson(url, {
          method: 'PATCH',
          body: { patch, if_updated_at: ifUpdatedAt || '' }
        });
        if (window.GRID._stateUpdatedAtByName) {
          window.GRID._stateUpdatedAtByName[name] = res.updated_at;
        }
        return res;
      };

      return retry(fn);
    },

    /* Default shapes for each named bucket (used both for reads before the
       bucket has ever been written, and for lazy initialization). */
    BUCKET_DEFAULTS: {
      trusted_issuers: { issuers: [], signature: null, signed_by_root_at: null },
      issuer_keys: { list: [] },
      pending_issuers: {},
      badge_registry: {},
      checkpoints: {},
      public_config: {}
    },

    /* Initialize default state buckets if needed */
    async initDefaultBuckets() {
      const buckets = ['trusted_issuers', 'issuer_keys', 'pending_issuers', 'badge_registry', 'checkpoints', 'public_config'];
      for (const bucket of buckets) {
        const existing = await this.readState(bucket, undefined);
        if (existing === undefined) {
          await this.setState(bucket, this.BUCKET_DEFAULTS[bucket]);
        }
      }
    }
  };
})();

  <script>
window.GRID.docId = "01KWJ24WNJEXCH6CE59ZW152EK";

/* ──────────────────────────────────────────────────────────────── */
/* ROOT PUBLIC KEY PIN                                              */
/* Trusting whatever public_config.root_public_key says at read-time */
/* means anyone with editor access to that bucket could swap in their */
/* own root key and mint a fake trusted_issuers list. Pin the real   */
/* root public key here (copy the JWK from the admin app's "Root Key" */
/* tab after generating it) so this file itself is the source of    */
/* trust, not a mutable Grid bucket.                                 */
/*                                                                    */
/* Rotating the root key (e.g. after a forgotten root passphrase)    */
/* requires updating this constant and redeploying this file. This   */
/* does NOT apply to issuer key resets — those are re-approved by    */
/* the admin re-signing trusted_issuers with the same root key, no   */
/* redeploy needed.                                                  */
/* ──────────────────────────────────────────────────────────────── */
const PINNED_ROOT_PUBLIC_KEY_JWK = null; // e.g. {"kty":"EC","crv":"P-256","x":"...","y":"..."}

function jwkKeysMatch(a, b) {
  if (!a || !b) return false;
  return a.kty === b.kty && a.crv === b.crv && a.x === b.x && a.y === b.y;
}

async function init() {
  try {
    await GridAPI.initDefaultBuckets();
    setupEventListeners();
    if (!PINNED_ROOT_PUBLIC_KEY_JWK) {
      showAlert(
        'alert-verify',
        'Este verificador aún no tiene la root key fijada en el código (PINNED_ROOT_PUBLIC_KEY_JWK). ' +
        'Copia la root public key desde la app de Admin y pégala en este archivo, o la verificación ' +
        'confía en public_config sin protección contra alteraciones.',
        'warning'
      );
    }
  } catch (err) {
    showAlert('alert-verify', 'Error al inicializar: ' + err.message, 'error');
  }
}

function setupEventListeners() {
  document.getElementById('btn-verify').addEventListener('click', verifyBadge);
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('badge-id-input').value = '';
    document.getElementById('result-container').style.display = 'none';
    showAlert('alert-verify', '', '');
  });

  document.getElementById('badge-id-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') verifyBadge();
  });
}

async function verifyBadge() {
  const input = document.getElementById('badge-id-input').value.trim();
  if (!input) {
    showAlert('alert-verify', 'Ingresa un Badge ID', 'error');
    return;
  }

  let badgeId = input;
  if (badgeId.startsWith('meli-device-badge://')) {
    badgeId = badgeId.replace('meli-device-badge://', '');
  }

  try {
    document.getElementById('btn-verify').disabled = true;

    const registry = await GridAPI.readState('badge_registry', {});
    const badge = registry[badgeId];

    if (!badge) {
      showResult('BADGE NO ENCONTRADA', 'invalid', {
        'Badge ID': badgeId,
        'Estado': 'No existe en el registro'
      });
      return;
    }

    const config = await GridAPI.readState('public_config', {});
    const trustedIssuers = await GridAPI.readState('trusted_issuers', { issuers: [], signature: null, signed_by_root_at: null });

    // Root of trust: prefer the key pinned in this file over whatever
    // public_config says live, since public_config is a mutable Grid
    // bucket that anyone with editor access could tamper with. If the
    // live key doesn't match the pinned one, treat it as compromised
    // rather than silently falling back to trusting it.
    let rootValid = false;
    if (PINNED_ROOT_PUBLIC_KEY_JWK) {
      if (config.root_public_key && !jwkKeysMatch(config.root_public_key, PINNED_ROOT_PUBLIC_KEY_JWK)) {
        showResult('ROOT KEY ALTERADA', 'invalid', {
          'Badge ID': badgeId,
          'Error': 'public_config.root_public_key no coincide con la root key fijada en este verificador'
        });
        return;
      }
      if (trustedIssuers.signature && trustedIssuers.signed_by_root_at) {
        const rootPubKey = await CryptoLib.importPublicKey(PINNED_ROOT_PUBLIC_KEY_JWK);
        const trustedPayload = {
          issuers: trustedIssuers.issuers,
          signed_by_root_at: trustedIssuers.signed_by_root_at
        };
        rootValid = await CryptoLib.verifySignature(trustedPayload, trustedIssuers.signature, rootPubKey);
      }
    } else if (config.root_public_key && trustedIssuers.signature && trustedIssuers.signed_by_root_at) {
      // No pinned key configured yet (fresh deployment before the operator
      // has copied it in) — fall back to trusting public_config live.
      // This is weaker; see the PINNED_ROOT_PUBLIC_KEY_JWK comment above.
      const rootPubKey = await CryptoLib.importPublicKey(config.root_public_key);
      const trustedPayload = {
        issuers: trustedIssuers.issuers,
        signed_by_root_at: trustedIssuers.signed_by_root_at
      };
      rootValid = await CryptoLib.verifySignature(trustedPayload, trustedIssuers.signature, rootPubKey);
    }

    if (!rootValid) {
      showResult('LISTA DE EMISORES NO VÁLIDA', 'invalid', {
        'Badge ID': badgeId,
        'Error': 'trusted_issuers no tiene firma root válida'
      });
      return;
    }

    // Validar que el issuer esté en trusted_issuers
    const issuerInTrusted = trustedIssuers.issuers && trustedIssuers.issuers.find(i => i.key_id === badge.key_id && i.status === 'active');
    if (!issuerInTrusted) {
      showResult('EMISOR NO CONFIABLE', 'invalid', {
        'Badge ID': badgeId,
        'Key ID': badge.key_id,
        'Error': 'Emisor no está en la lista de confianza'
      });
      return;
    }

    // Cargar el evento de la badge desde el ledger del issuer
    const ledgerName = `badge_ledger_${badge.key_id}`;
    let ledger = [];
    try {
      ledger = await GridAPI.readList(ledgerName);
    } catch {}

    const event = ledger.find(e => e.payload && e.payload.badge_id === badgeId);
    if (!event) {
      showResult('EVENTO NO ENCONTRADO', 'invalid', {
        'Badge ID': badgeId,
        'Error': 'El evento de emisión no está en el ledger'
      });
      return;
    }

    // Validar firma del evento
    const issuerPubJwk = issuerInTrusted.public_key_jwk;
    const issuerPubKey = await CryptoLib.importPublicKey(issuerPubJwk);
    const signatureValid = await CryptoLib.verifySignature(event.payload, event.signature, issuerPubKey);

    if (!signatureValid) {
      showResult('FIRMA INVÁLIDA', 'invalid', {
        'Badge ID': badgeId,
        'Payload': JSON.stringify(event.payload).substring(0, 50) + '...',
        'Error': 'La firma no coincide con el payload'
      });
      return;
    }

    // Validar estado en registry
    if (badge.status === 'legacy_unsigned') {
      showResult('REGISTRO LEGACY SIN FIRMA', 'warning', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id || 'N/A',
        'Emisor': badge.issued_by_ldap,
        'Nota': 'Este registro se migró del sistema anterior y no tiene firma criptográfica.'
      });
      return;
    }

    if (badge.status === 'superseded') {
      showResult('REEMPLAZADA', 'warning', {
        'Badge ID': badgeId,
        'Nueva Badge': badge.superseded_by,
        'Dispositivo': badge.device_id,
        'Reemplazada Por': badge.superseded_by
      });
      return;
    }

    if (badge.status === 'revoked') {
      showResult('REVOCADA', 'invalid', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id,
        'Motivo': 'La badge fue revocada'
      });
      return;
    }

    if (badge.status === 'invalid_key_revoked') {
      showResult('LLAVE REVOCADA', 'invalid', {
        'Badge ID': badgeId,
        'Key ID': badge.key_id,
        'Error': 'La llave del emisor fue revocada por compromiso sospechado'
      });
      return;
    }

    // Validar vencimiento
    const expiresAt = new Date(badge.expires_at);
    const now = new Date();
    if (now > expiresAt) {
      showResult('VENCIDA', 'warning', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id,
        'Modelo': event.payload.model,
        'Vencimiento': expiresAt.toLocaleString(),
        'Estado': 'Expirada'
      });
      return;
    }

    // Validar hash chain si existe checkpoint
    const checkpoints = await GridAPI.readState('checkpoints', {});
    const checkpoint = checkpoints[badge.key_id];
    if (checkpoint && event.previous_event_hash) {
      if (checkpoint.latest_event_hash && event.event_hash !== checkpoint.latest_event_hash) {
        const possibleAlteration = ledger.filter(e => e.event_hash === checkpoint.latest_event_hash);
        if (!possibleAlteration.length && event.previous_event_hash !== checkpoint.latest_event_hash) {
          showResult('REGISTRY ALTERADO', 'invalid', {
            'Badge ID': badgeId,
            'Error': 'Hash chain no coincide con el checkpoint firmado'
          });
          return;
        }
      }
    }

    // TODO: Verificación de hash chain en todo el ledger
    // Por ahora simplificado: verificar el evento existe y su firma es válida

    // Badge válida
    showResult('VÁLIDA', 'valid', {
      'Badge ID': badgeId,
      'Dispositivo': badge.device_id,
      'Marca': event.payload.brand,
      'Modelo': event.payload.model,
      'Dueño': event.payload.owner_name,
      'Emisor': badge.issued_by_ldap,
      'Emitida': new Date(badge.issued_at).toLocaleString(),
      'Vence': expiresAt.toLocaleString(),
      'Tipo': event.payload.device_type
    });
  } catch (err) {
    showAlert('alert-verify', 'Error: ' + err.message, 'error');
    console.error(err);
  } finally {
    document.getElementById('btn-verify').disabled = false;
  }
}

function showResult(title, type, details) {
  const container = document.getElementById('result-container');
  const display = document.getElementById('result-display');

  let html = `<div class="result-box ${type}">`;
  html += `<div class="result-title">${title}</div>`;

  if (Object.keys(details).length) {
    html += '<div class="result-details">';
    for (const [key, value] of Object.entries(details)) {
      html += `
        <div class="result-detail-row">
          <div class="result-detail-label">${key}</div>
          <div class="result-detail-value">${escapeHtml(String(value))}</div>
        </div>
      `;
    }
    html += '</div>';
  }

  html += '</div>';
  display.innerHTML = html;
  container.style.display = 'block';
}

function showAlert(containerId, message, type) {
  const container = document.getElementById(containerId);
  if (!message) {
    container.innerHTML = '';
    return;
  }
  const icon = type === 'success' ? '✓' : type === 'warning' ? '⚠' : '✕';
  container.innerHTML = `<div class="alert ${type}">${icon} ${message}</div>`;
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, c => map[c]);
}

init();
