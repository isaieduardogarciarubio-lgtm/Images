  <script>
/* ──────────────────────────────────────────────────────────────── */
/* MELI CRYPTOGRAPHY LIBRARY                                        */
/* WebCrypto-based ECDSA P-256, AES-256-GCM, PBKDF2, SHA-256       */
/* ──────────────────────────────────────────────────────────────── */

const CryptoLib = (() => {
  const ITERATIONS = 310000;
  const ALGORITHM_ECDSA = { name: 'ECDSA', namedCurve: 'P-256' };
  const HASH_ALGO = 'SHA-256';

  return {
    /* Generate random passphrase in format MELI-XXXX-XXXX-XXXX-XXXX */
    generatePassphrase() {
      const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let passphrase = 'MELI-';
      for (let i = 0; i < 4; i++) {
        let segment = '';
        for (let j = 0; j < 4; j++) {
          const idx = Math.floor(Math.random() * chars.length);
          segment += chars[idx];
        }
        passphrase += segment;
        if (i < 3) passphrase += '-';
      }
      return passphrase;
    },

    /* Generate ECDSA P-256 key pair */
    async generateKeyPair() {
      return await crypto.subtle.generateKey(
        ALGORITHM_ECDSA,
        true,
        ['sign', 'verify']
      );
    },

    /* Export public key to JWK */
    async exportPublicKey(publicKey) {
      return await crypto.subtle.exportKey('jwk', publicKey);
    },

    /* Import public key from JWK */
    async importPublicKey(jwk) {
      return await crypto.subtle.importKey(
        'jwk',
        jwk,
        ALGORITHM_ECDSA,
        false,
        ['verify']
      );
    },

    /* Import private key from JWK */
    async importPrivateKey(jwk) {
      return await crypto.subtle.importKey(
        'jwk',
        jwk,
        ALGORITHM_ECDSA,
        false,
        ['sign']
      );
    },

    /* Encrypt private key with passphrase using PBKDF2 + AES-256-GCM */
    async encryptPrivateKey(privateKey, passphrase) {
      const privateJwk = await crypto.subtle.exportKey('jwk', privateKey);
      const privateJsonStr = JSON.stringify(privateJwk);
      const privateBytes = new TextEncoder().encode(privateJsonStr);

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));

      const passphraseKey = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(passphrase),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: ITERATIONS,
          hash: HASH_ALGO
        },
        passphraseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt']
      );

      const ciphertext = await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        aesKey,
        privateBytes
      );

      return {
        ciphertext: this._toBase64Url(new Uint8Array(ciphertext)),
        salt: this._toBase64Url(salt),
        iv: this._toBase64Url(iv)
      };
    },

    /* Decrypt private key with passphrase */
    async decryptPrivateKey(ciphertextB64, passphrase, saltB64, ivB64) {
      const ciphertext = this._fromBase64Url(ciphertextB64);
      const salt = this._fromBase64Url(saltB64);
      const iv = this._fromBase64Url(ivB64);

      const passphraseKey = await crypto.subtle.importKey(
        'raw',
        new TextEncoder().encode(passphrase),
        'PBKDF2',
        false,
        ['deriveKey']
      );

      const aesKey = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: ITERATIONS,
          hash: HASH_ALGO
        },
        passphraseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const privateBytes = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        aesKey,
        ciphertext
      );

      const privateJsonStr = new TextDecoder().decode(privateBytes);
      return JSON.parse(privateJsonStr);
    },

    /* Canonical JSON (deterministic) */
    canonicalize(value) {
      if (value === null) return 'null';
      if (typeof value === 'string') return JSON.stringify(value);
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (Array.isArray(value)) {
        return '[' + value.map(v => this.canonicalize(v)).join(',') + ']';
      }
      if (typeof value === 'object') {
        const keys = Object.keys(value).sort();
        const items = keys.map(k => JSON.stringify(k) + ':' + this.canonicalize(value[k]));
        return '{' + items.join(',') + '}';
      }
      return '';
    },

    /* Sign payload with private key */
    async signPayload(payload, privateKey) {
      const canonical = this.canonicalize(payload);
      const message = new TextEncoder().encode(canonical);

      const signature = await crypto.subtle.sign(
        { name: 'ECDSA', hash: HASH_ALGO },
        privateKey,
        message
      );

      return this._toBase64Url(new Uint8Array(signature));
    },

    /* Verify payload signature with public key */
    async verifySignature(payload, signature, publicKey) {
      try {
        const canonical = this.canonicalize(payload);
        const message = new TextEncoder().encode(canonical);
        const signatureBytes = this._fromBase64Url(signature);

        return await crypto.subtle.verify(
          { name: 'ECDSA', hash: HASH_ALGO },
          publicKey,
          signatureBytes,
          message
        );
      } catch {
        return false;
      }
    },

    /* SHA-256 hash */
    async sha256(data) {
      let bytes;
      if (typeof data === 'string') {
        bytes = new TextEncoder().encode(data);
      } else {
        bytes = data;
      }

      const hashBuffer = await crypto.subtle.digest(HASH_ALGO, bytes);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    },

    /* Base64URL encode/decode */
    _toBase64Url(bytes) {
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    },

    _fromBase64Url(str) {
      str = str
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      while (str.length % 4) str += '=';
      const binary = atob(str);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }
  };
})();

/* ──────────────────────────────────────────────────────────────── */
/* MELI GRID API WRAPPER                                            */
/* Unified interface for reading/writing state buckets and states   */
/* ──────────────────────────────────────────────────────────────── */

const GridAPI = (() => {
  const MAX_RETRIES = 3;
  const RETRY_DELAY = 500;

  async function retry(fn) {
    for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
      try {
        return await fn();
      } catch (err) {
        if (attempt < MAX_RETRIES - 1 && err.status === 409) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * Math.pow(2, attempt)));
        } else {
          throw err;
        }
      }
    }
  }

  async function fetchJson(url, options = {}) {
    const opts = {
      credentials: 'include',
      ...options
    };
    if (options.body && typeof options.body === 'object') {
      options.headers = { ...options.headers, 'Content-Type': 'application/json' };
      options.body = JSON.stringify(options.body);
    }
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = new Error(`HTTP ${res.status}`);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  return {
    /* Get current user info from /api/v1/me */
    async getMe() {
      return fetchJson('/api/v1/me');
    },

    /* Read state bucket by name. defaultValue is returned when the bucket
       has never been written (Grid returns 200 with state: null, not 404). */
    async readState(name, defaultValue = null) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }
      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      const res = await fetchJson(url);
      if (window.GRID._stateUpdatedAtByName) {
        window.GRID._stateUpdatedAtByName[name] = res.updated_at;
      }
      return (res.state !== undefined && res.state !== null) ? res.state : defaultValue;
    },

    /* Write state bucket (PUT with control optimistic) */
    async setState(name, state) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }

      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      const ifUpdatedAt = window.GRID._stateUpdatedAtByName && window.GRID._stateUpdatedAtByName[name];

      const fn = async () => {
        const body = { state };
        if (ifUpdatedAt) body.if_updated_at = ifUpdatedAt;
        const res = await fetchJson(url, {
          method: 'PUT',
          body
        });
        if (window.GRID._stateUpdatedAtByName) {
          window.GRID._stateUpdatedAtByName[name] = res.updated_at;
        }
        return res;
      };

      return retry(fn);
    },

    /* Patch state bucket */
    async patchState(name, patch) {
      if (!window.GRID || !window.GRID.docId) {
        throw new Error('GRID.docId not set');
      }

      const url = `/api/v1/documents/${window.GRID.docId}/states/${encodeURIComponent(name)}`;
      const ifUpdatedAt = window.GRID._stateUpdatedAtByName && window.GRID._stateUpdatedAtByName[name];

      const fn = async () => {
        const body = { patch };
        if (ifUpdatedAt) body.if_updated_at = ifUpdatedAt;
        const res = await fetchJson(url, {
          method: 'PATCH',
          body
        });
        if (window.GRID._stateUpdatedAtByName) {
          window.GRID._stateUpdatedAtByName[name] = res.updated_at;
        }
        return res;
      };

      return retry(fn);
    },

    /* Default shapes for each named bucket (used both for reads before the
       bucket has ever been written, and for lazy initialization). */
    BUCKET_DEFAULTS: {
      trusted_issuers: { issuers: [], signature: null, signed_by_root_at: null },
      issuer_keys: [],
      pending_issuers: {},
      badge_registry: {},
      checkpoints: {},
      public_config: {}
    },

    /* Initialize default state buckets if needed */
    async initDefaultBuckets() {
      const buckets = ['trusted_issuers', 'issuer_keys', 'pending_issuers', 'badge_registry', 'checkpoints', 'public_config'];
      for (const bucket of buckets) {
        const existing = await this.readState(bucket, undefined);
        if (existing === undefined) {
          await this.setState(bucket, this.BUCKET_DEFAULTS[bucket]);
        }
      }
    }
  };
})();

  </script>
  <script>
window.GRID.docId = "01KWJ24WNJEXCH6CE59ZW152EK";

async function init() {
  try {
    await GridAPI.initDefaultBuckets();
    setupEventListeners();
  } catch (err) {
    showAlert('alert-verify', 'Error al inicializar: ' + err.message, 'error');
  }
}

function setupEventListeners() {
  document.getElementById('btn-verify').addEventListener('click', verifyBadge);
  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('badge-id-input').value = '';
    document.getElementById('result-container').style.display = 'none';
    showAlert('alert-verify', '', '');
  });

  document.getElementById('badge-id-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') verifyBadge();
  });
}

async function verifyBadge() {
  const input = document.getElementById('badge-id-input').value.trim();
  if (!input) {
    showAlert('alert-verify', 'Ingresa un Badge ID', 'error');
    return;
  }

  let badgeId = input;
  if (badgeId.startsWith('meli-device-badge://')) {
    badgeId = badgeId.replace('meli-device-badge://', '');
  }

  try {
    document.getElementById('btn-verify').disabled = true;

    const registry = await GridAPI.readState('badge_registry', {});
    const badge = registry[badgeId];

    if (!badge) {
      showResult('BADGE NO ENCONTRADA', 'invalid', {
        'Badge ID': badgeId,
        'Estado': 'No existe en el registro'
      });
      return;
    }

    const config = await GridAPI.readState('public_config', {});
    const trustedIssuers = await GridAPI.readState('trusted_issuers', { issuers: [], signature: null, signed_by_root_at: null });

    // Validar timestamp de root signature en trusted_issuers
    let rootValid = false;
    if (config.root_public_key && trustedIssuers.signature && trustedIssuers.signed_by_root_at) {
      const rootPubKey = await CryptoLib.importPublicKey(config.root_public_key);
      const trustedPayload = {
        issuers: trustedIssuers.issuers,
        signed_by_root_at: trustedIssuers.signed_by_root_at
      };
      rootValid = await CryptoLib.verifySignature(trustedPayload, trustedIssuers.signature, rootPubKey);
    }

    if (!rootValid) {
      showResult('LISTA DE EMISORES NO VÁLIDA', 'invalid', {
        'Badge ID': badgeId,
        'Error': 'trusted_issuers no tiene firma root válida'
      });
      return;
    }

    // Validar que el issuer esté en trusted_issuers
    const issuerInTrusted = trustedIssuers.issuers && trustedIssuers.issuers.find(i => i.key_id === badge.key_id && i.status === 'active');
    if (!issuerInTrusted) {
      showResult('EMISOR NO CONFIABLE', 'invalid', {
        'Badge ID': badgeId,
        'Key ID': badge.key_id,
        'Error': 'Emisor no está en la lista de confianza'
      });
      return;
    }

    // Cargar el evento de la badge desde el ledger del issuer
    const ledgerName = `badge_ledger_${badge.key_id}`;
    let ledger = [];
    try {
      ledger = await GridAPI.readState(ledgerName, []);
    } catch {}

    const event = ledger.find(e => e.payload && e.payload.badge_id === badgeId);
    if (!event) {
      showResult('EVENTO NO ENCONTRADO', 'invalid', {
        'Badge ID': badgeId,
        'Error': 'El evento de emisión no está en el ledger'
      });
      return;
    }

    // Validar firma del evento
    const issuerPubJwk = issuerInTrusted.public_key_jwk;
    const issuerPubKey = await CryptoLib.importPublicKey(issuerPubJwk);
    const signatureValid = await CryptoLib.verifySignature(event.payload, event.signature, issuerPubKey);

    if (!signatureValid) {
      showResult('FIRMA INVÁLIDA', 'invalid', {
        'Badge ID': badgeId,
        'Payload': JSON.stringify(event.payload).substring(0, 50) + '...',
        'Error': 'La firma no coincide con el payload'
      });
      return;
    }

    // Validar estado en registry
    if (badge.status === 'legacy_unsigned') {
      showResult('REGISTRO LEGACY SIN FIRMA', 'warning', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id || 'N/A',
        'Emisor': badge.issued_by_ldap,
        'Nota': 'Este registro se migró del sistema anterior y no tiene firma criptográfica.'
      });
      return;
    }

    if (badge.status === 'superseded') {
      showResult('REEMPLAZADA', 'warning', {
        'Badge ID': badgeId,
        'Nueva Badge': badge.superseded_by,
        'Dispositivo': badge.device_id,
        'Reemplazada Por': badge.superseded_by
      });
      return;
    }

    if (badge.status === 'revoked') {
      showResult('REVOCADA', 'invalid', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id,
        'Motivo': 'La badge fue revocada'
      });
      return;
    }

    if (badge.status === 'invalid_key_revoked') {
      showResult('LLAVE REVOCADA', 'invalid', {
        'Badge ID': badgeId,
        'Key ID': badge.key_id,
        'Error': 'La llave del emisor fue revocada por compromiso sospechado'
      });
      return;
    }

    // Validar vencimiento
    const expiresAt = new Date(badge.expires_at);
    const now = new Date();
    if (now > expiresAt) {
      showResult('VENCIDA', 'warning', {
        'Badge ID': badgeId,
        'Dispositivo': badge.device_id,
        'Modelo': event.payload.model,
        'Vencimiento': expiresAt.toLocaleString(),
        'Estado': 'Expirada'
      });
      return;
    }

    // Validar hash chain si existe checkpoint
    const checkpoints = await GridAPI.readState('checkpoints', {});
    const checkpoint = checkpoints[badge.key_id];
    if (checkpoint && event.previous_event_hash) {
      if (checkpoint.latest_event_hash && event.event_hash !== checkpoint.latest_event_hash) {
        const possibleAlteration = ledger.filter(e => e.event_hash === checkpoint.latest_event_hash);
        if (!possibleAlteration.length && event.previous_event_hash !== checkpoint.latest_event_hash) {
          showResult('REGISTRY ALTERADO', 'invalid', {
            'Badge ID': badgeId,
            'Error': 'Hash chain no coincide con el checkpoint firmado'
          });
          return;
        }
      }
    }

    // TODO: Verificación de hash chain en todo el ledger
    // Por ahora simplificado: verificar el evento existe y su firma es válida

    // Badge válida
    showResult('VÁLIDA', 'valid', {
      'Badge ID': badgeId,
      'Dispositivo': badge.device_id,
      'Marca': event.payload.brand,
      'Modelo': event.payload.model,
      'Dueño': event.payload.owner_name,
      'Emisor': badge.issued_by_ldap,
      'Emitida': new Date(badge.issued_at).toLocaleString(),
      'Vence': expiresAt.toLocaleString(),
      'Tipo': event.payload.device_type
    });
  } catch (err) {
    showAlert('alert-verify', 'Error: ' + err.message, 'error');
    console.error(err);
  } finally {
    document.getElementById('btn-verify').disabled = false;
  }
}

function showResult(title, type, details) {
  const container = document.getElementById('result-container');
  const display = document.getElementById('result-display');

  let html = `<div class="result-box ${type}">`;
  html += `<div class="result-title">${title}</div>`;

  if (Object.keys(details).length) {
    html += '<div class="result-details">';
    for (const [key, value] of Object.entries(details)) {
      html += `
        <div class="result-detail-row">
          <div class="result-detail-label">${key}</div>
          <div class="result-detail-value">${escapeHtml(String(value))}</div>
        </div>
      `;
    }
    html += '</div>';
  }

  html += '</div>';
  display.innerHTML = html;
  container.style.display = 'block';
}

function showAlert(containerId, message, type) {
  const container = document.getElementById(containerId);
  if (!message) {
    container.innerHTML = '';
    return;
  }
  const icon = type === 'success' ? '✓' : type === 'warning' ? '⚠' : '✕';
  container.innerHTML = `<div class="alert ${type}">${icon} ${message}</div>`;
}

function escapeHtml(text) {
  const map = {
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#039;'
  };
  return text.replace(/[&<>"']/g, c => map[c]);
}

init();
  </script>
