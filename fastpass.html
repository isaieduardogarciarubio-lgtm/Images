<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Pass - Descarga de Identificadores de Hardware</title>
    <style>
        :root {
            --meli-blue: #3483fa;
            --meli-yellow: #FFD100;
            --bg-color: #ebebeb;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 0.95rem;
        }
        button {
            background-color: var(--meli-blue);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
        }
        button.download {
            background-color: #00a650;
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #sessionHint {
            font-size: 0.78rem;
            color: #666;
            margin: -6px 0 14px 0;
            text-align: left;
        }
        #verifyError {
            display: none;
            font-size: 0.82rem;
            color: #c0392b;
            background: #fdecea;
            border: 1px solid #f5c6cb;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
            text-align: left;
        }
        canvas {
            display: block;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
            margin: 20px auto 0 auto;
            /* Responsive: el canvas mantiene su resolución interna (nítida para
               escanear) pero se escala al ancho disponible en pantallas chicas. */
            width: 100%;
            max-width: 564px;
            height: auto;
        }
    </style>

<body>

<div class="container">
    <h3>Fast Pass — Registro de Hardware</h3>

    <div id="formSection">
        <div class="form-group">
            <label for="deviceType">Tipo de Dispositivo:</label>
            <select id="deviceType" onchange="onDeviceTypeChange()">
                <option value="phone">Teléfono</option>
                <option value="speaker">Bocina</option>
                <option value="watch">Reloj Inteligente</option>
            </select>
        </div>
        <div class="form-group">
            <label for="deviceBrand">Marca:</label>
            <select id="deviceBrand"></select>
        </div>
        <div id="sessionHint">Sesión detectada: <span id="sessionLabel">consultando…</span></div>
        <div id="verifyError"></div>
        <button id="btnGenerate" onclick="generateFastPass()">1. Generar Pase</button>
        <button class="download" id="btnDownload" onclick="downloadPng()" style="display:none;">2. Descargar Imagen PNG</button>
    </div>

    <canvas id="fastPassCanvas" width="564" height="1240" style="display:none;"></canvas>
</div>

                { id: "honor", name: "Honor", color: "#B98A46" },
                { id: "oneplus", name: "OnePlus", color: "#EB0028" },
                { id: "infinix", name: "Infinix", color: "#2E9E00" },
                { id: "tecno", name: "Tecno", color: "#0052FF" },
                { id: "sony", name: "Sony", color: "#111111" },
                { id: "nothing", name: "Nothing", color: "#000000" }
            ]
        },
        speaker: {
            label: "Bocina",
            brands: [
                { id: "jbl", name: "JBL", color: "#FF6600" },
                { id: "sony", name: "Sony", color: "#111111" },
                { id: "bose", name: "Bose", color: "#000000" },
                { id: "marshall", name: "Marshall", color: "#6B4226" },
                { id: "harman_kardon", name: "Harman Kardon", color: "#B5790A" },
                { id: "amazon_echo", name: "Amazon Echo", color: "#0097A7" },
                { id: "google_nest", name: "Google Nest", color: "#4285F4" },
                { id: "xiaomi", name: "Xiaomi", color: "#FF6700" },
                { id: "soundcore", name: "Anker Soundcore", color: "#0057B8" },
                { id: "ultimate_ears", name: "Ultimate Ears", color: "#E4002B" }
            ]
        },
        watch: {
            label: "Reloj Inteligente",
            brands: [
                { id: "apple_watch", name: "Apple Watch", color: "#3A3A3C" },
                { id: "galaxy_watch", name: "Samsung Galaxy Watch", color: "#034EA2" },
                { id: "garmin", name: "Garmin", color: "#007CC3" },
                { id: "xiaomi_watch", name: "Xiaomi Watch / Mi Band", color: "#FF6700" },
                { id: "amazfit", name: "Amazfit", color: "#FF5000" },
                { id: "fitbit", name: "Fitbit (Google)", color: "#00B0B9" },
                { id: "huawei_watch", name: "Huawei Watch", color: "#E50012" },
                { id: "honor_watch", name: "Honor Watch", color: "#B98A46" },
                { id: "fossil", name: "Fossil", color: "#1B1B1B" },
                { id: "oneplus_watch", name: "OnePlus Watch", color: "#EB0028" }
            ]
        }
    };

    const TYPE_LABEL_UPPER = { phone: "TELÉFONO", speaker: "BOCINA", watch: "RELOJ INTELIGENTE" };

    // =======================================================
    // MODO DE VERIFICACIÓN
    // Hoy: MOCK — genera serial/signkey de prueba en el cliente,
    //      sin llamar a ningún backend. Sirve para pruebas de UI.
    // Producción: cuando exista el servicio real de verificación
    //      de hardware, cambiar VERIFICATION_MODE a "api" y completar
    //      VERIFICATION_ENDPOINT. No hace falta tocar nada más:
    //      generateFastPass() y renderEngine() ya consumen el
    //      resultado de getVerificationData() sin importar su origen.
    // =======================================================
    const VERIFICATION_MODE = "mock"; // "mock" | "api"
    const VERIFICATION_ENDPOINT = ""; // ej: el endpoint real que defina el equipo de seguridad

    // Contrato esperado de la respuesta real (documentarlo con el equipo
    // que construya el backend antes de activar VERIFICATION_MODE="api"):
    //   { verified: boolean, serial: string, signkey: string, reason?: string }
    async function getVerificationData(type, brandId, brandName) {
        if (VERIFICATION_MODE === "mock") {
            const hash = Array.from(brandId).reduce(function (acc, ch) { return acc + ch.charCodeAt(0); }, 0);
            return {
                verified: true,
                serial: "01KWSN-DEV-" + (1000 + hash % 8999) + "X-991A",
                signkey: "MELI_SEC_MOCK_" + hash.toString(16).toUpperCase().padStart(4, "0")
            };
        }

        if (!VERIFICATION_ENDPOINT) {
            throw new Error("VERIFICATION_ENDPOINT no está configurado. Definilo antes de usar VERIFICATION_MODE='api'.");
        }

        const response = await fetch(VERIFICATION_ENDPOINT, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                device_type: type,
                brand_id: brandId,
                brand_name: brandName,
                requested_by: currentSession.ldap || currentSession.email || null
            })
        });

        if (!response.ok) {
            throw new Error("El servicio de verificación respondió " + response.status);
        }

        const data = await response.json();
        if (!data.verified) {
            throw new Error(data.reason || "El dispositivo no pudo ser verificado.");
        }
        return data;
    }

    // Intenta usar una librería de QR ya publicada en /d/_libs/ (si Grid la agrega
    // en el futuro); si no existe, cae a la copia vendorizada embebida arriba.
    async function ensureQrFactory() {
        if (window.qrcode) return window.qrcode;
        try {
            const resp = await fetch("/d/_libs/qrcode.min.js", { credentials: "include" });
            if (resp.ok) {
                const src = await resp.text();
                const script = document.createElement("script");
                script.textContent = src;
                document.head.appendChild(script);
                if (window.qrcode) return window.qrcode;
            }
        } catch (_) { /* usar el respaldo embebido */ }
        return window.__qrcodeEmbedded;
    }

    let currentSession = { full_name: "INVITADO", ldap: "invitado" };

    // Regla de Oro Biblia: identidad SIEMPRE vía /api/v1/me, nunca hardcodeada.
    fetch("/api/v1/me", { credentials: "include" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (me) {
            if (me) {
                currentSession = me;
                document.getElementById("sessionLabel").textContent =
                    (me.full_name || me.ldap || me.email || "usuario detectado");
            } else {
                document.getElementById("sessionLabel").textContent = "no disponible (invitado)";
            }
        })
        .catch(function () {
            document.getElementById("sessionLabel").textContent = "no disponible (invitado)";
        });

    function populateBrandSelect(type) {
        const brandSelect = document.getElementById('deviceBrand');
        brandSelect.innerHTML = "";
        DEVICE_CATALOG[type].brands.forEach(function (b) {
            const opt = document.createElement('option');
            opt.value = b.id;
            opt.textContent = b.name;
            brandSelect.appendChild(opt);
        });
    }

    function onDeviceTypeChange() {
        populateBrandSelect(document.getElementById('deviceType').value);
    }

    populateBrandSelect('phone');

    let currentType = "";
    let currentBrand = "";

    async function generateFastPass() {
        currentType = document.getElementById('deviceType').value;
        currentBrand = document.getElementById('deviceBrand').value;
        const catalogEntry = DEVICE_CATALOG[currentType].brands.find(function (b) { return b.id === currentBrand; });
        const brandName = catalogEntry ? catalogEntry.name : currentBrand;

        const btnGenerate = document.getElementById('btnGenerate');
        const errorBox = document.getElementById('verifyError');
        errorBox.style.display = 'none';
        btnGenerate.disabled = true;
        btnGenerate.textContent = VERIFICATION_MODE === "mock" ? "Generando (mock)…" : "Verificando hardware…";

        try {
            const verification = await getVerificationData(currentType, currentBrand, brandName);
            const qrFactory = await ensureQrFactory();

            const canvas = document.getElementById('fastPassCanvas');
            const ctx = canvas.getContext('2d');
            canvas.style.display = 'block';
            document.getElementById('btnDownload').style.display = 'block';

            renderEngine(ctx, canvas, currentType, currentBrand, verification, qrFactory);
        } catch (err) {
            errorBox.textContent = "No se pudo generar el pase: " + err.message;
            errorBox.style.display = 'block';
        } finally {
            btnGenerate.disabled = false;
            btnGenerate.textContent = "1. Generar Pase";
        }
    }

    // =======================================================
    // UTILIDADES DE DIBUJO
    // =======================================================
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
    }

    function pickTextColor(hex) {
        const c = hex.replace('#', '');
        const r = parseInt(c.substring(0, 2), 16), g = parseInt(c.substring(2, 4), 16), b = parseInt(c.substring(4, 6), 16);
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum > 0.6 ? '#111111' : '#FFFFFF';
    }

    function drawDeviceIcon(ctx, type, x, y, s, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = 2;
        if (type === 'phone') {
            roundRect(ctx, -s * 0.28, -s * 0.5, s * 0.56, s, s * 0.14);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(0, s * 0.36, s * 0.05, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'speaker') {
            ctx.beginPath(); ctx.arc(0, 0, s * 0.5, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, s * 0.26, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, s * 0.06, 0, Math.PI * 2); ctx.fill();
        } else if (type === 'watch') {
            roundRect(ctx, -s * 0.32, -s * 0.32, s * 0.64, s * 0.64, s * 0.16);
            ctx.stroke();
            ctx.fillRect(-s * 0.12, -s * 0.62, s * 0.24, s * 0.22);
            ctx.fillRect(-s * 0.12, s * 0.4, s * 0.24, s * 0.22);
        }
        ctx.restore();
    }

    function drawRow(ctx, xLeft, y, label, value, valueFont) {
        ctx.textAlign = 'left';
        ctx.fillStyle = '#9a9a9a';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(label, xLeft, y);
        ctx.fillStyle = '#111111';
        ctx.font = valueFont || 'bold 22px sans-serif';
        ctx.fillText(value, xLeft, y + 30);
    }

    function drawDivider(ctx, xLeft, xRight, y) {
        ctx.strokeStyle = '#ececec';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(xLeft, y); ctx.lineTo(xRight, y); ctx.stroke();
    }

    function drawPerforation(ctx, canvas, y) {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, y, 14, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(canvas.width, y, 14, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.strokeStyle = '#cfcfcf';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }

    // Marca la esquina 7x7 de un patrón de anclaje (finder). Estos 3 bloques (arriba-izq,
    // arriba-der, abajo-izq) son los que la cámara usa para ubicar y orientar el QR: NO se
    // convierten en puntos, se dibujan sólidos y estilizados para preservar la detección.
    function isFinderModule(r, c, count) {
        return (r < 7 && c < 7) || (r < 7 && c >= count - 7) || (r >= count - 7 && c < 7);
    }

    // Tamaño de celda y zona de silencio del QR — compartidos por measureQrBox y drawBrandedQr.
    const QR_CELL = 6;          // px por módulo (entero, para no antialiasar bordes)
    const QR_QUIET = 4 * QR_CELL; // zona de silencio: 4 módulos

    // Calcula el tamaño de la caja del QR sin dibujarlo (para ajustar el layout antes).
    function measureQrBox(qrFactory, text) {
        const qr = qrFactory(0, 'H');
        qr.addData(text);
        qr.make();
        return qr.getModuleCount() * QR_CELL + QR_QUIET * 2;
    }

    function drawFinderPattern(ctx, x, y, cell, dark) {
        ctx.fillStyle = dark;
        roundRect(ctx, x, y, cell * 7, cell * 7, cell * 2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, x + cell, y + cell, cell * 5, cell * 5, cell * 1.4); ctx.fill();
        ctx.fillStyle = dark;
        roundRect(ctx, x + cell * 2, y + cell * 2, cell * 3, cell * 3, cell); ctx.fill();
    }

    // QR ARTÍSTICO (estilo "marca de agua"): módulos de datos como puntos redondeados con
    // color de marca, anclajes estilizados. Sigue siendo un QR estándar 100% escaneable con
    // cualquier cámara — validado con lector independiente hasta 50% de reducción de escala
    // (misma robustez que módulos sólidos). Reglas críticas que respeta:
    //  - Nivel de corrección "H" (~30%) para máxima robustez.
    //  - Celda de tamaño ENTERO en píxeles: un tamaño fraccionario haría que el canvas
    //    antialiase los bordes y genere grises que rompen la lectura.
    // Devuelve el tamaño real de la caja (varía según el largo del payload) para posicionar
    // lo que va debajo sin quedar pegado ni separado.
    function drawBrandedQr(ctx, qrFactory, centerX, topY, text, brandColor) {
        const DOT_RATIO = 0.85;   // diámetro del punto respecto a la celda
        const qr = qrFactory(0, 'H');
        qr.addData(text);
        qr.make();
        const count = qr.getModuleCount();
        const cellInt = QR_CELL;
        const quiet = QR_QUIET; // zona de silencio: 4 módulos
        const inner = count * cellInt;
        const boxSize = inner + quiet * 2;
        const x = centerX - boxSize / 2;
        const y = topY;

        ctx.fillStyle = '#ffffff';
        roundRect(ctx, x, y, boxSize, boxSize, 14);
        ctx.fill();
        ctx.strokeStyle = '#e5e5e5';
        ctx.lineWidth = 1;
        roundRect(ctx, x, y, boxSize, boxSize, 14);
        ctx.stroke();

        // Anclajes sólidos (3 esquinas)
        drawFinderPattern(ctx, x + quiet, y + quiet, cellInt, brandColor);
        drawFinderPattern(ctx, x + quiet + (count - 7) * cellInt, y + quiet, cellInt, brandColor);
        drawFinderPattern(ctx, x + quiet, y + quiet + (count - 7) * cellInt, cellInt, brandColor);

        // Módulos de datos como puntos en color de marca
        ctx.fillStyle = brandColor;
        const rad = (cellInt / 2) * DOT_RATIO;
        for (let r = 0; r < count; r++) {
            for (let c = 0; c < count; c++) {
                if (!qr.isDark(r, c) || isFinderModule(r, c, count)) continue;
                const dcx = x + quiet + c * cellInt + cellInt / 2;
                const dcy = y + quiet + r * cellInt + cellInt / 2;
                ctx.beginPath(); ctx.arc(dcx, dcy, rad, 0, Math.PI * 2); ctx.fill();
            }
        }

        return boxSize;
    }

    // =======================================================
    // MOTOR DE RENDER — diseño tipo "ticket" moderno Meli
    // =======================================================
    function renderEngine(ctx, canvas, type, brandId, verification, qrFactory) {
        const W = canvas.width;
        const cx = W / 2;
        const catalogEntry = DEVICE_CATALOG[type].brands.find(function (b) { return b.id === brandId; });
        const brandName = catalogEntry ? catalogEntry.name : brandId;

        // Payload del QR (se arma antes para poder medir el tamaño del QR y ajustar
        // la altura del canvas dinámicamente, evitando espacio en blanco sobrante).
        const qrPayload = JSON.stringify({
            device_type: type,
            brand: brandName,
            serial: verification.serial,
            signkey: verification.signkey,
            worker: currentSession.ldap || currentSession.full_name || 'invitado',
            issued_at: new Date().toISOString()
        });
        const qrTopY = 606;
        const qrBoxSize = measureQrBox(qrFactory, qrPayload);
        // Ajustar altura del canvas al contenido real (footer incluido).
        canvas.height = qrTopY + qrBoxSize + 74;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, W, canvas.height);

        // Header
        const headerH = 120;
        ctx.fillStyle = '#FFD100';
        ctx.fillRect(0, 0, W, headerH);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#111';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText('MELI', 32, 38);
        ctx.textAlign = 'center';
        ctx.font = '900 38px sans-serif';
        ctx.fillText('FAST PASS', cx, 78);
        ctx.font = 'bold 13px monospace';
        ctx.fillText('HARDWARE VERIFIED', cx, 102);

        // Chip de marca + icono de tipo de dispositivo
        const chipY = 200, chipW = 340, chipH = 66;
        ctx.fillStyle = catalogEntry.color;
        roundRect(ctx, cx - chipW / 2, chipY - chipH / 2, chipW, chipH, chipH / 2);
        ctx.fill();
        const textColor = pickTextColor(catalogEntry.color);
        drawDeviceIcon(ctx, type, cx - chipW / 2 + 44, chipY, 30, textColor);
        ctx.fillStyle = textColor;
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(brandName, cx - chipW / 2 + 74, chipY + 8);

        ctx.fillStyle = '#9a9a9a';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TIPO: ' + TYPE_LABEL_UPPER[type], cx, chipY + 58);

        // Filas de datos
        const xL = 48, xR = W - 48;
        drawDivider(ctx, xL, xR, 282);
        drawRow(ctx, xL, 318, 'ID SERIAL UNICO', verification.serial, 'bold 22px monospace');
        drawDivider(ctx, xL, xR, 366);
        drawRow(ctx, xL, 402, 'SIGNKEY', verification.signkey, 'bold 19px monospace');
        drawDivider(ctx, xL, xR, 450);
        drawRow(ctx, xL, 486, 'SESION DE TRABAJADOR', (currentSession.full_name || currentSession.ldap || 'INVITADO').toUpperCase());
        drawDivider(ctx, xL, xR, 534);

        // Perforación estilo ticket
        drawPerforation(ctx, canvas, 566);

        // QR artístico grande con payload completo del pase (pintado en color de marca)
        drawBrandedQr(ctx, qrFactory, cx, qrTopY, qrPayload, catalogEntry.color);

        ctx.fillStyle = '#666';
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Escanea para verificar', cx, qrTopY + qrBoxSize + 34);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#aaa';
        ctx.fillText('Generado: ' + new Date().toLocaleString('es-MX'), cx, qrTopY + qrBoxSize + 54);

        // Cinta "MODO PRUEBA" en la esquina (no interfiere con el QR) mientras esté en mock.
        if (VERIFICATION_MODE === "mock") {
            ctx.save();
            ctx.beginPath(); ctx.rect(0, 0, W, headerH); ctx.clip();
            ctx.translate(W - 40, 40);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(-100, -12, 200, 24);
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('MODO PRUEBA', 0, 4);
            ctx.restore();
        }
    }

    function downloadPng() {
        const canvas = document.getElementById('fastPassCanvas');
        const imageUri = canvas.toDataURL("image/png");

        const link = document.createElement('a');
        link.download = `FASTPASS_${currentType.toUpperCase()}_${currentBrand.toUpperCase()}_01KWSN.png`;
        link.href = imageUri;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

<script>
/* Grid: only allow approved Grid domains to open unsandboxed tabs */
(function(){
  var allowedHosts = ["figma.com", "www.figma.com", "furydocs.io", "zeroheight.com", "google.com", "docs.google.com", "meet.google.com", "grid.adminml.com", "grid-artifacts.adminml.com", "mercadolibre.atlassian.net", "mercadolibre-opsgenie.atlassian.net", "app.datadoghq.com", "grafana-service.furycloud.io", "web.furycloud.io", "nasdaq-meli.app.opsgenie.com", "meli.enterprise.slack.com"];
  var allowedSuffixes = [".adminml.com", ".atlassian.net", ".google.com", ".furycloud.io", ".melioffice.com", ".melisystems.com"];
  var allowedPathPrefixes = {"github.com": ["/melisource/"], "www.github.com": ["/melisource/"]};
  function normalizeUrl(rawUrl){
    try {
      return new URL(String(rawUrl || ""), window.location.href);
    } catch (_err) {
      return null;
    }
  }
  function isAllowedUrl(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed) return false;
    if(parsed.protocol === "slack:") return true;
    if(parsed.protocol !== "https:") return false;
    var h = (parsed.hostname || "").toLowerCase();
    if(!h) return false;
    if(allowedHosts.indexOf(h) !== -1) return true;
    for(var i = 0; i < allowedSuffixes.length; i++){
      var s = allowedSuffixes[i];
      if(h === s.slice(1) || (h.length > s.length && h.slice(-s.length) === s)) return true;
    }
    var pathPrefixes = allowedPathPrefixes[h];
    if(pathPrefixes){
      var p = parsed.pathname || "/";
      for(var j = 0; j < pathPrefixes.length; j++){
        if(p.slice(0, pathPrefixes[j].length) === pathPrefixes[j]) return true;
      }
    }
    return false;
  }
  function requestParentPopup(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed || !window.parent || window.parent === window) return false;
    try {
      window.parent.postMessage({type: "grid-open-safe-popup", url: parsed.href}, window.location.origin);
      return true;
    } catch (_err) {
      return false;
    }
  }

  document.addEventListener("click", function(event){
    var target = event.target;
    var anchor = target && target.closest ? target.closest("a[href]") : null;
    if(!anchor) return;
    var href = anchor.getAttribute("href") || "";
    if(!href || href.charAt(0) === "#") return;
    var opensNewTab = anchor.target === "_blank" || event.ctrlKey || event.metaKey || event.button === 1;
    if(!opensNewTab) return;
    if(!isAllowedUrl(href)) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    if(requestParentPopup(href)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  var nativeOpen = window.open;
  window.open = function(rawUrl, target, features){
    if(!isAllowedUrl(rawUrl)) return null;
    if(requestParentPopup(rawUrl)) return null;
    return nativeOpen ? nativeOpen.call(window, normalizeUrl(rawUrl).href, target, features) : null;
  };
})();
</script>
<script>
/* Grid: video/audio embed diagnostics & proxy fallback */
(function(){
  var TAG='[Grid:media-diag]';
  function patchMedia(el){
    if(el._gridPatched) return;
    el._gridPatched=true;
    el.addEventListener('error',function handler(ev){
      var src=el.currentSrc||el.src||'';
      var code=el.error?el.error.code:'?';
      var msg=el.error?el.error.message:'unknown';
      console.warn(TAG,'load failed',{tag:el.tagName,src:src,code:code,message:msg});
      var origSrc=el.getAttribute('src')||'';
      if(origSrc && origSrc.indexOf('proxy=1')===-1 && origSrc.indexOf('://')===-1){
        var proxySrc=origSrc+(origSrc.indexOf('?')!==-1?'&':'?')+'proxy=1';
        console.info(TAG,'retrying via proxy',proxySrc);
        el.removeEventListener('error',handler);
        el.src=proxySrc;
        el.load();
      }
    },true);
  }
  document.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
  var obs=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if(n.nodeType!==1)return;
        if(/^(VIDEO|AUDIO|SOURCE)$/.test(n.tagName))patchMedia(n);
        if(n.querySelectorAll){
          n.querySelectorAll('video,audio,video source,audio source').forEach(patchMedia);
        }
      });
    });
  });
  obs.observe(document.body,{childList:true,subtree:true});
})();
</script>
<script>
/* Grid: sync iframe URL mutations to parent address bar */
(function(){
  function notifyParent(search, hash){
    if(!window.parent || window.parent === window) return;
    try{
      window.parent.postMessage(
        {type:"grid-url-sync", search:search, hash:hash},
        window.location.origin
      );
    }catch(_){}
  }
  function parseAndNotify(url){
    try{
      var p = new URL(String(url), window.location.href);
      notifyParent(p.search, p.hash);
    }catch(_){}
  }
  var _push = history.pushState.bind(history);
  var _replace = history.replaceState.bind(history);
  history.pushState = function(state, title, url){
    _push(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  history.replaceState = function(state, title, url){
    _replace(state, title, url);
    if(url != null) parseAndNotify(url);
  };
  window.addEventListener("hashchange", function(){
    notifyParent(window.location.search, window.location.hash);
  });
})();
</script>
