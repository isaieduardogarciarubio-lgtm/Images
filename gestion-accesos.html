<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gestión de Accesos</title>
<style>
  /* ====== Design System Meli / Atlas (Biblia Sección 6) ====== */
  :root{
    --primary:#3D33FF; --primary-light:#A8B9FF; --primary-bg:#EEF0FF; --primary-dark:#2A1FCC;
    --text:#1A1A1A; --text-2:#737373; --text-muted:#9E9E9E;
    --surface:#F5F5F5; --border:#E8E8E8; --border-strong:#E0E0E0;
    --success:#00A650; --success-bg:#E6F7EE; --success-bd:#B3E6C8;
    --error:#F23D4F; --error-bg:#FFEBEE; --error-bd:#FFB3BB;
    --warning:#F7A800; --warning-bg:#FFF8E6; --warning-bd:#FFE0B2;
    --yellow:#FFD100; --page:#EBEBEB;
    --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:20px; --r-full:999px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Proxima Nova","Segoe UI",Roboto,sans-serif;
    background:var(--page); color:var(--text);
    font-size:14px; line-height:1.4;
  }
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input,select,textarea{font-family:inherit; font-size:14px;}

  /* ====== App shell (mobile-first, máx 480px centrado) ====== */
  #app{
    max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
    background:var(--page); position:relative; display:flex; flex-direction:column;
    box-shadow:0 0 24px rgba(0,0,0,.06);
  }

  /* ====== Header ====== */
  header{
    position:sticky; top:0; z-index:40; background:#fff;
    border-top:3px solid var(--yellow);
    border-bottom:1px solid var(--border);
    padding:12px 16px; display:flex; align-items:center; gap:12px;
  }
  header .brand-bar{width:4px; height:34px; background:var(--yellow); border-radius:var(--r-full);}
  header .titles{flex:1; min-width:0;}
  header .titles h1{font-size:18px; font-weight:800; margin:0; color:var(--text); letter-spacing:-.2px;}
  header .titles p{font-size:13px; color:var(--text-2); margin:2px 0 0;}
  .avatar{
    width:38px; height:38px; border-radius:var(--r-full); flex:none;
    background:var(--primary-bg); color:var(--primary);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; border:1px solid var(--primary-light);
  }

  /* ====== Sub-header (búsqueda + contador) ====== */
  .subhead{padding:14px 16px 6px; background:var(--page); position:sticky; top:62px; z-index:30;}
  .search{
    display:flex; align-items:center; gap:8px; background:#fff;
    border:1px solid var(--border); border-radius:var(--r-md); padding:10px 12px;
  }
  .search svg{flex:none;}
  .search input{border:none; outline:none; flex:1; background:transparent; color:var(--text);}
  .search input::placeholder{color:var(--text-muted);}
  .eyebrow{font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.6px; text-transform:uppercase; margin:14px 2px 8px;}

  /* ====== Lista / contenido ====== */
  main{flex:1; overflow-y:auto; padding:0 16px 90px;}
  .list{display:flex; flex-direction:column; gap:12px;}

  /* ====== Card ====== */
  .card{
    background:#fff; border:1px solid var(--border); border-radius:var(--r-lg);
    padding:16px; cursor:pointer; transition:transform .08s ease, box-shadow .15s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .card:active{transform:scale(.99);}
  .card-top{display:flex; gap:12px; align-items:flex-start;}
  .photo{
    width:48px; height:48px; border-radius:var(--r-md); flex:none;
    background:var(--surface); display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--text-2); font-size:15px; overflow:hidden;
  }
  .photo.lg{width:96px; height:96px; font-size:28px; border-radius:var(--r-lg);}
  .card-id{flex:1; min-width:0;}
  .card-id .name{font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-id .company{font-size:13px; color:var(--text-2); margin-top:1px;}
  .card-id .role{font-size:13px; color:var(--text-muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-divider{height:1px; background:var(--border); margin:12px 0;}
  .meta{display:flex; flex-wrap:wrap; gap:12px;}
  .meta .chip{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--text-2);}
  .card-extra{font-size:13px; margin-top:10px;}
  .card-extra.reject{color:var(--error); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-extra.expire{color:var(--text-2);}

  /* ====== Badges ====== */
  .badge{
    display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:var(--r-sm);
    font-size:12px; font-weight:500; border:1px solid; white-space:nowrap;
  }
  .badge.pendiente{background:var(--warning-bg); border-color:var(--warning-bd); color:var(--warning);}
  .badge.aceptado{background:var(--success-bg); border-color:var(--success-bd); color:var(--success);}
  .badge.rechazado{background:var(--error-bg); border-color:var(--error-bd); color:var(--error);}
  .badge.vigente{background:var(--success-bg); border-color:var(--success-bd); color:var(--success);}
  .badge.porvencer{background:var(--warning-bg); border-color:var(--warning-bd); color:var(--warning);}
  .badge.vencido{background:var(--error-bg); border-color:var(--error-bd); color:var(--error);}
  .badge.gray{background:var(--surface); border-color:var(--border-strong); color:var(--text-2);}

  /* ====== Empty state ====== */
  .empty{text-align:center; padding:64px 24px; color:var(--text-muted);}
  .empty .ico{font-size:44px; margin-bottom:12px;}
  .empty h3{font-size:16px; font-weight:600; color:var(--text-2); margin:0 0 4px;}
  .empty p{font-size:13px; margin:0;}

  /* ====== Tab bar ====== */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--border);
    display:flex; z-index:40; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabbar button{
    flex:1; padding:9px 0 10px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-muted); position:relative;
  }
  nav.tabbar button .lbl{font-size:11px; font-weight:600;}
  nav.tabbar button.active{color:var(--primary);}
  .tab-badge{
    position:absolute; top:2px; left:calc(50% + 8px); min-width:17px; height:17px; padding:0 4px;
    border-radius:var(--r-full); color:#fff; font-size:10px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .tab-badge.warn{background:var(--warning);}
  .tab-badge.gray{background:var(--text-2);}

  /* ====== Detalle (full-screen overlay) ====== */
  .screen{
    position:fixed; inset:0; max-width:480px; margin:0 auto; background:var(--page);
    z-index:60; display:flex; flex-direction:column; transform:translateX(100%);
    transition:transform .22s ease; visibility:hidden;
  }
  .screen.open{transform:translateX(0); visibility:visible;}
  .screen header{justify-content:flex-start;}
  .icon-btn{width:36px; height:36px; border-radius:var(--r-md); display:flex; align-items:center; justify-content:center; color:var(--text);}
  .icon-btn:active{background:var(--surface);}
  .detail-body{flex:1; overflow-y:auto; padding:24px 16px 110px;}
  .detail-hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; margin-bottom:8px;}
  .detail-hero .name{font-size:18px; font-weight:800;}
  .detail-hero .company{font-size:14px; color:var(--text-2);}
  .detail-section{background:#fff; border:1px solid var(--border); border-radius:var(--r-lg); padding:8px 16px; margin-top:16px;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:11px 0; border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row .k{font-size:13px; color:var(--text-2); flex:none;}
  .row .v{font-size:14px; color:var(--text); text-align:right; word-break:break-word;}
  .docs{display:flex; gap:10px; padding:12px 0;}
  .doc-thumb{
    flex:1; aspect-ratio:1/1; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-md); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--text-2); font-size:12px; cursor:pointer;
  }
  .doc-thumb:active{background:#ededed;}
  .doc-thumb.empty-doc{opacity:.5;}

  /* QR */
  .qr-wrap{display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 0;}
  .qr-box{width:140px; height:140px; border:1px solid var(--border); border-radius:var(--r-md); padding:8px; background:#fff;}
  .qr-id{font-size:13px; color:var(--text-2); font-weight:600;}

  /* Action bar */
  .action-bar{
    position:absolute; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; gap:12px;
  }
  .btn{flex:1; padding:13px; border-radius:var(--r-md); font-size:15px; font-weight:600; text-align:center;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-danger-outline{background:#fff; color:var(--error); border:1px solid var(--error-bd);}
  .btn-danger-outline:active{background:var(--error-bg);}
  .btn-ghost{background:var(--surface); color:var(--text-2); border:1px solid var(--border-strong);}
  .btn-secondary{background:var(--primary-bg); color:var(--primary); border:1px solid var(--primary-light);}

  /* ====== Modales ====== */
  .overlay{
    position:fixed; inset:0; background:rgba(26,26,26,.5); z-index:80;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; visibility:hidden; transition:opacity .15s ease;
  }
  .overlay.open{opacity:1; visibility:visible;}
  .modal{
    background:#fff; border-radius:var(--r-lg); width:100%; max-width:380px;
    padding:20px; transform:translateY(12px); transition:transform .18s ease; max-height:90vh; overflow-y:auto;
  }
  .overlay.open .modal{transform:translateY(0);}
  .modal h3{font-size:18px; font-weight:700; margin:0;}
  .modal .sub{font-size:13px; color:var(--text-2); margin:2px 0 0;}
  .modal-divider{height:1px; background:var(--border); margin:16px 0;}
  .field-label{font-size:13px; font-weight:600; color:var(--text); margin-bottom:6px; display:block;}
  .field-label .req{color:var(--error);}
  .input, .select, .textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border-strong); border-radius:var(--r-md);
    color:var(--text); background:#fff; outline:none;
  }
  .input:focus, .select:focus, .textarea:focus{border-color:var(--primary);}
  .textarea{resize:vertical; min-height:70px;}
  .quick-chips{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .quick-chips button{
    padding:6px 12px; border-radius:var(--r-full); background:var(--primary-bg);
    color:var(--primary); font-size:13px; font-weight:600; border:1px solid var(--primary-light);
  }
  .quick-chips button:active{background:#e0e4ff;}
  .alert-inline{
    display:flex; gap:10px; padding:12px 14px; border-radius:var(--r-md); margin-top:16px;
    background:var(--primary-bg); border:1px solid var(--primary-light); font-size:13px; color:var(--text);
  }
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .field-error{color:var(--error); font-size:12px; margin-top:6px; display:none;}
  .field-error.show{display:block;}

  /* Visor de documento */
  .doc-viewer .modal{max-width:420px; text-align:center;}
  .doc-viewer .doc-image{
    width:100%; aspect-ratio:3/4; background:var(--surface); border-radius:var(--r-md);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-muted);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-bar"></div>
    <div class="titles">
      <h1>Gestión de Accesos</h1>
      <p id="greeting">Hola, ISAI EDUARDO</p>
    </div>
    <div class="avatar" id="avatar">IG</div>
  </header>

  <div class="subhead">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Buscar por nombre, empresa o sitio…" oninput="render()">
    </div>
    <div class="eyebrow" id="listEyebrow">Solicitudes</div>
  </div>

  <main>
    <div class="list" id="list"></div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="pendiente" class="active" onclick="setTab('pendiente')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span class="lbl">Pendientes</span>
      <span class="tab-badge warn" id="badge-pendiente"></span>
    </button>
    <button data-tab="aceptado" onclick="setTab('aceptado')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      <span class="lbl">Aceptados</span>
      <span class="tab-badge gray" id="badge-aceptado"></span>
    </button>
    <button data-tab="rechazado" onclick="setTab('rechazado')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>
      <span class="lbl">Rechazados</span>
      <span class="tab-badge gray" id="badge-rechazado"></span>
    </button>
  </nav>
</div>

<!-- ====== Pantalla Detalle ====== -->
<div class="screen" id="detailScreen">
  <header>
    <button class="icon-btn" onclick="closeDetail()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="titles" style="margin-left:4px;"><h1 style="font-size:17px;">Detalle de solicitud</h1></div>
    <span id="detailBadge"></span>
  </header>
  <div class="detail-body" id="detailBody"></div>
  <div class="action-bar" id="detailActions"></div>
</div>

<!-- ====== Modal Aceptar ====== -->
<div class="overlay" id="acceptModal">
  <div class="modal">
    <h3>Aceptar acceso</h3>
    <p class="sub" id="acceptName">—</p>
    <div class="modal-divider"></div>
    <label class="field-label">Fecha de vencimiento <span class="req">*</span></label>
    <input type="date" class="input" id="expireDate">
    <div class="field-error" id="expireError">Selecciona una fecha futura válida.</div>
    <div class="quick-chips">
      <button onclick="setExpire(30)">30 días</button>
      <button onclick="setExpire(90)">90 días</button>
      <button onclick="setExpire(365)">1 año</button>
    </div>
    <div class="alert-inline">
      <span>ℹ️</span><span>Se generará un código QR de acceso al confirmar.</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('acceptModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmAccept()">Aceptar</button>
    </div>
  </div>
</div>

<!-- ====== Modal Rechazar ====== -->
<div class="overlay" id="rejectModal">
  <div class="modal">
    <h3>Rechazar acceso</h3>
    <p class="sub" id="rejectName">—</p>
    <div class="modal-divider"></div>
    <label class="field-label">Motivo del rechazo <span class="req">*</span></label>
    <select class="select" id="rejectReason">
      <option value="">Selecciona un motivo…</option>
      <option>Documentación incompleta</option>
      <option>Datos inválidos</option>
      <option>No autorizado por el líder</option>
      <option>Fuera de política de acceso</option>
      <option>Otro</option>
    </select>
    <div class="field-error" id="rejectError">Selecciona un motivo.</div>
    <label class="field-label" style="margin-top:14px;">Comentario adicional</label>
    <textarea class="textarea" id="rejectComment" placeholder="Opcional…"></textarea>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('rejectModal')">Cancelar</button>
      <button class="btn btn-danger-outline" onclick="confirmReject()">Rechazar</button>
    </div>
  </div>
</div>

<!-- ====== Visor de documento ====== -->
<div class="overlay doc-viewer" id="docModal">
  <div class="modal">
    <h3 id="docTitle">Documento</h3>
    <p class="sub" id="docOwner">—</p>
    <div class="modal-divider"></div>
    <div class="doc-image">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#9E9E9E" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span>Vista previa (placeholder)</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal('docModal')">Cerrar</button>
    </div>
  </div>
</div>

/* =========================================================
   Identidad del usuario — GET /api/v1/me (Biblia Sección 3)
   ========================================================= */
(function loadUser(){
  if (typeof fetch !== 'function') return;
  fetch('/api/v1/me', { credentials:'include' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u) return;
      var first = (u.full_name || u.ldap || '').split(' ')[0] || '';
      document.getElementById('greeting').textContent = 'Hola, ' + (u.full_name || u.ldap || '');
      var initials = (u.email || '').split('@')[0].split('.').map(function(p){return p.charAt(0);}).join('').slice(0,2).toUpperCase();
      if (initials) document.getElementById('avatar').textContent = initials;
    })
    .catch(function(){ /* sin VPN: se queda el placeholder */ });
})();

/* =========================================================
   Helpers
   ========================================================= */
function fullName(s){ return [s.nombre, s.apPaterno, s.apMaterno].filter(Boolean).join(' '); }
function initials(s){ return (s.nombre.charAt(0) + (s.apPaterno||'').charAt(0)).toUpperCase(); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function timeAgo(iso){
  var diff = (Date.now() - new Date(iso).getTime())/1000;
  if (diff < 3600) return 'hace ' + Math.max(1,Math.floor(diff/60)) + ' min';
  if (diff < 86400) return 'hace ' + Math.floor(diff/3600) + ' h';
  return 'hace ' + Math.floor(diff/86400) + ' d';
}
function fmtDate(iso){
  if (!iso) return '—';
  var meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var d=new Date(iso+ (iso.length<=10?'T00:00:00':''));
  return d.getDate()+' '+meses[d.getMonth()]+' '+d.getFullYear();
}
function vigencia(iso){
  if (!iso) return null;
  var dias = Math.ceil((new Date(iso+'T23:59:59').getTime() - Date.now())/86400000);
  if (dias < 0) return {cls:'vencido', txt:'Vencido'};
  if (dias <= 15) return {cls:'porvencer', txt:'Por vencer ('+dias+'d)'};
  return {cls:'vigente', txt:'Vigente'};
}
var STATUS_LABEL = {pendiente:'⏳ Pendiente', aceptado:'✅ Aceptado', rechazado:'❌ Rechazado'};

/* =========================================================
   Render principal
   ========================================================= */
function setTab(tab){
  currentTab = tab;
  var btns = document.querySelectorAll('nav.tabbar button');
  for (var i=0;i<btns.length;i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab')===tab);
  render();
}

function render(){
  updateBadges();
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var items = solicitudes.filter(function(s){ return s.estatus===currentTab; });
  if (q){
    items = items.filter(function(s){
      return (fullName(s)+' '+s.empresa+' '+s.sitio).toLowerCase().indexOf(q) !== -1;
    });
  }
  var labels = {pendiente:'pendientes', aceptado:'aceptadas', rechazado:'rechazadas'};
  document.getElementById('listEyebrow').textContent = items.length + ' SOLICITUD' + (items.length===1?'':'ES') + ' ' + labels[currentTab].toUpperCase();

  var list = document.getElementById('list');
  if (!items.length){ list.innerHTML = emptyState(); return; }

  list.innerHTML = items.map(cardHTML).join('');
}

function updateBadges(){
  ['pendiente','aceptado','rechazado'].forEach(function(st){
    var n = solicitudes.filter(function(s){return s.estatus===st;}).length;
    var el = document.getElementById('badge-'+st);
    el.textContent = n; el.style.display = n ? 'flex' : 'none';
  });
}

function emptyState(){
  var map = {
    pendiente:{i:'🎉', h:'Todo al día', p:'No hay solicitudes pendientes.'},
    aceptado:{i:'✅', h:'Sin accesos aceptados', p:'Los accesos que aceptes aparecerán aquí.'},
    rechazado:{i:'🗂️', h:'Sin rechazos', p:'Los accesos que rechaces aparecerán aquí.'}
  };
  var e = map[currentTab];
  return '<div class="empty"><div class="ico">'+e.i+'</div><h3>'+e.h+'</h3><p>'+e.p+'</p></div>';
}

function cardHTML(s){
  var extra = '';
  if (s.estatus==='aceptado'){
    var v = vigencia(s.fechaVencimiento);
    extra = '<div class="card-extra expire">🗓️ Vence: '+fmtDate(s.fechaVencimiento)+
            (v?' &nbsp; <span class="badge '+v.cls+'">'+v.txt+'</span>':'')+'</div>';
  } else if (s.estatus==='rechazado'){
    extra = '<div class="card-extra reject">Motivo: '+esc(s.motivoRechazo||'—')+'</div>';
  }
  return ''+
    '<div class="card" onclick="openDetail(\''+s.id+'\')">'+
      '<div class="card-top">'+
        '<div class="photo">'+initials(s)+'</div>'+
        '<div class="card-id">'+
          '<div class="name">'+esc(fullName(s))+'</div>'+
          '<div class="company">'+esc(s.empresa)+'</div>'+
          '<div class="role">'+esc(s.puesto)+'</div>'+
        '</div>'+
        '<span class="badge '+s.estatus+'">'+STATUS_LABEL[s.estatus]+'</span>'+
      '</div>'+
      '<div class="card-divider"></div>'+
      '<div class="meta">'+
        '<span class="chip">📍 '+esc(s.sitio)+'</span>'+
        (s.esDriver?'<span class="chip">🚚 Driver</span>':'')+
        '<span class="chip">🕑 '+timeAgo(s.fechaSolicitud)+'</span>'+
      '</div>'+
      extra+
    '</div>';
}

/* =========================================================
   Detalle full-screen
   ========================================================= */
function getById(id){ for (var i=0;i<solicitudes.length;i++) if (solicitudes[i].id===id) return solicitudes[i]; return null; }

function openDetail(id){
  currentDetailId = id;
  var s = getById(id); if (!s) return;
  document.getElementById('detailBadge').innerHTML = '<span class="badge '+s.estatus+'">'+STATUS_LABEL[s.estatus]+'</span>';
  document.getElementById('detailBody').innerHTML = detailHTML(s);
  document.getElementById('detailActions').innerHTML = actionsHTML(s);
  document.getElementById('detailScreen').classList.add('open');
}
function closeDetail(){
  document.getElementById('detailScreen').classList.remove('open');
  currentDetailId = null;
}

function detailHTML(s){
  var html = '';
  html += '<div class="detail-hero">'+
            '<div class="photo lg">'+initials(s)+'</div>'+
            '<div class="name">'+esc(fullName(s))+'</div>'+
            '<div class="company">'+esc(s.empresa)+' · '+esc(s.puesto)+'</div>'+
            '<div style="font-size:12px;color:var(--text-muted)">ID '+esc(s.id)+' · solicitado '+fmtDate(s.fechaSolicitud)+'</div>'+
          '</div>';

  // Resultado de gestión (si aplica)
  if (s.estatus==='aceptado'){
    var v = vigencia(s.fechaVencimiento);
    html += '<div class="detail-section">'+
              '<div class="qr-wrap">'+ qrSVG(s.qr) +
                '<div class="qr-id">'+esc(s.qr)+'</div>'+
                '<div class="row" style="width:100%"><span class="k">Vencimiento</span><span class="v">'+fmtDate(s.fechaVencimiento)+(v?' <span class="badge '+v.cls+'">'+v.txt+'</span>':'')+'</span></div>'+
                '<button class="btn btn-secondary" style="width:100%" onclick="alert_placeholder()">Compartir QR</button>'+
              '</div>'+
            '</div>';
  } else if (s.estatus==='rechazado'){
    html += '<div class="detail-section"><div class="row"><span class="k">Motivo de rechazo</span><span class="v" style="color:var(--error)">'+esc(s.motivoRechazo||'—')+'</span></div></div>';
  }

  html += section('Datos personales', [
    ['Correo', esc(s.correo)],
    ['CURP', esc(s.curp)],
    ['Nacionalidad', esc(s.nacionalidad)],
    ['Driver', s.esDriver?'Sí 🚚':'No']
  ]);
  html += section('Datos laborales', [
    ['Puesto', esc(s.puesto)],
    ['Sitio', esc(s.sitio)],
    ['Líder que justifica', esc(s.liderJustifica)]
  ]);

  // Documentos
  html += '<div class="eyebrow" style="margin:18px 2px 8px">Documentos</div>'+
          '<div class="detail-section"><div class="docs">'+
            docThumb('Foto', s.foto, s) +
            docThumb('INE', s.ine, s) +
            docThumb('Pasaporte', s.pasaporte, s) +
          '</div></div>';

  return html;
}

function section(title, rows){
  var inner = rows.map(function(r){
    return '<div class="row"><span class="k">'+r[0]+'</span><span class="v">'+r[1]+'</span></div>';
  }).join('');
  return '<div class="eyebrow" style="margin:18px 2px 8px">'+title+'</div><div class="detail-section">'+inner+'</div>';
}

function docThumb(label, has, s){
  if (!has) return '<div class="doc-thumb empty-doc"><span>📄</span><span>'+label+'</span><span style="font-size:11px">No adjunto</span></div>';
  return '<div class="doc-thumb" onclick="openDoc(\''+label+'\',\''+esc(fullName(s))+'\')">'+
           '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#737373" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>'+
           '<span>'+label+'</span></div>';
}

function qrSVG(id){
  // QR placeholder determinístico (no es un QR real escaneable)
  var seed = 0; for (var i=0;i<(id||'').length;i++) seed += (id.charCodeAt(i)*(i+7));
  var n=11, cells='';
  for (var y=0;y<n;y++) for (var x=0;x<n;x++){
    var on = ((x*31 + y*17 + seed) % 3) === 0;
    // marcadores de esquina
    var corner = (x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
    var edge = (x===0||y===0||x===2||y===2)||(x===n-1||x===n-3)||(y===n-1||y===n-3);
    if (corner) on = edge ? true : (x===1&&y===1)||(x>n-3&&y===1)||(x===1&&y>n-3);
    if (on) cells += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#1A1A1A"/>';
  }
  return '<svg class="qr-box" viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges">'+cells+'</svg>';
}

/* =========================================================
   Acciones (barra inferior del detalle)
   ========================================================= */
function actionsHTML(s){
  if (s.estatus==='pendiente'){
    return '<button class="btn btn-danger-outline" onclick="openReject(\''+s.id+'\')">❌ Rechazar</button>'+
           '<button class="btn btn-primary" onclick="openAccept(\''+s.id+'\')">✅ Aceptar</button>';
  }
  return '<button class="btn btn-ghost" onclick="revert(\''+s.id+'\')">↩︎ Revertir a pendiente</button>';
}

function revert(id){
  var s = getById(id); if (!s) return;
  s.estatus='pendiente'; s.motivoRechazo=null; s.fechaVencimiento=null; s.qr=null;
  closeDetail(); setTab('pendiente');
}

/* ---- Aceptar ---- */
function openAccept(id){
  pendingAction = id;
  var s = getById(id);
  document.getElementById('acceptName').textContent = fullName(s);
  document.getElementById('expireDate').value = '';
  document.getElementById('expireError').classList.remove('show');
  openModal('acceptModal');
}
function setExpire(days){
  var d = new Date(); d.setDate(d.getDate()+days);
  document.getElementById('expireDate').value = d.toISOString().slice(0,10);
  document.getElementById('expireError').classList.remove('show');
}
function confirmAccept(){
  var val = document.getElementById('expireDate').value;
  var today = new Date().toISOString().slice(0,10);
  if (!val || val <= today){ document.getElementById('expireError').classList.add('show'); return; }
  var s = getById(pendingAction);
  s.estatus='aceptado'; s.fechaVencimiento=val; s.qr=s.id; s.motivoRechazo=null;
  closeModal('acceptModal'); closeDetail(); setTab('aceptado');
}

/* ---- Rechazar ---- */
function openReject(id){
  pendingAction = id;
  var s = getById(id);
  document.getElementById('rejectName').textContent = fullName(s);
  document.getElementById('rejectReason').value = '';
  document.getElementById('rejectComment').value = '';
  document.getElementById('rejectError').classList.remove('show');
  openModal('rejectModal');
}
function confirmReject(){
  var reason = document.getElementById('rejectReason').value;
  if (!reason){ document.getElementById('rejectError').classList.add('show'); return; }
  var comment = document.getElementById('rejectComment').value.trim();
  var s = getById(pendingAction);
  s.estatus='rechazado'; s.motivoRechazo = reason + (comment?' — '+comment:''); s.fechaVencimiento=null; s.qr=null;
  closeModal('rejectModal'); closeDetail(); setTab('rechazado');
}

/* ---- Visor doc ---- */
function openDoc(label, owner){
  document.getElementById('docTitle').textContent = label;
  document.getElementById('docOwner').textContent = owner;
  openModal('docModal');
}
function alert_placeholder(){ /* placeholder: compartir QR (sin backend) */ }

/* ---- Modal helpers ---- */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
// cerrar modal al tocar overlay
document.querySelectorAll('.overlay').forEach(function(ov){
  ov.addEventListener('click', function(e){ if (e.target===ov) ov.classList.remove('open'); });
});

/* Init */
render();
</script>
