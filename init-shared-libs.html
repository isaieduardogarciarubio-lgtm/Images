<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Badge - Inicializar Shared Libraries</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    p {
      color: #666;
      margin: 10px 0;
    }
    button {
      padding: 12px 24px;
      background: #FFD100;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-top: 20px;
    }
    button:hover {
      background: #E6BC00;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
      font-weight: 500;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Inicializar Shared Libraries</h1>
    <p>Este script carga el código compartido (CryptoLib + GridAPI)</p>
    <p>desde device-badge-shared-lib.js y lo guarda en Grid.</p>

    <button id="init-btn" onclick="initializeSharedLibs()">Inicializar Shared Libraries</button>

    <div id="status" class="status"></div>
  </div>

  <script>
    const DOC_ID = "01KWJ24WNJEXCH6CE59ZW152EK";
    const STATE_NAME = "shared_libs_code";

    function showStatus(message, type = 'loading') {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    async function initializeSharedLibs() {
      const btn = document.getElementById('init-btn');
      btn.disabled = true;

      try {
        showStatus('📥 Leyendo device-badge-shared-lib.js...', 'loading');

        // Cargar el archivo shared-lib
        const response = await fetch('/device-badge-shared-lib.js');
        if (!response.ok) {
          throw new Error(`No se puede cargar device-badge-shared-lib.js: ${response.status}`);
        }
        const libCode = await response.text();

        showStatus('💾 Guardando en Grid...', 'loading');

        // Guardar en Grid
        const gridRes = await fetch(`/api/v1/documents/${DOC_ID}/states/${encodeURIComponent(STATE_NAME)}`, {
          method: 'PUT',
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            state: libCode,
            if_updated_at: ''
          })
        });

        if (!gridRes.ok) {
          const error = await gridRes.json().catch(() => ({}));
          throw new Error(error.detail || `HTTP ${gridRes.status}`);
        }

        showStatus('✅ ¡Shared libraries inicializadas correctamente! Ahora todas las apps cargarán el código desde Grid. Recarga las apps para verlo en efecto.', 'success');
      } catch (err) {
        showStatus(`❌ Error: ${err.message}`, 'error');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
