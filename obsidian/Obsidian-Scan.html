/* ---------------- idempotent append + durable classification --------------- */
function obsFindWriteId(writeId){
  return GridClient.readSheet(CFG.SCAN_SHEET_ID,CFG.DOC_ADMIN,CFG.SCAN_TAB+'!B:B').then(function(rows){var count=0,rowNum=null;for(var i=1;i<rows.length;i++){if(String((rows[i]&&rows[i][0])||'')===writeId){count++;rowNum=i+1;}}return {count:count,row:rowNum};});
}
function obsResolveAmbiguousWrite(writeId){var tries=0;function check(){tries++;return obsFindWriteId(writeId).then(function(x){if(x.count||tries>=4)return x;return obsSleep(400*Math.pow(2,tries-1)).then(check);});}return check();}
function obsUpdatedRange(body){return body&&(body.updatedRange||(body.updates&&body.updates.updatedRange)||(body.data&&body.data.updates&&body.data.updates.updatedRange))||'';}
function obsVerifyRange(range,writeId,stable){
  if(!range)return obsResolveAmbiguousWrite(writeId).then(function(x){if(!x.count)return false;if(!stable)return true;return obsSleep(OBS_STABLE_MS).then(function(){return obsFindWriteId(writeId);}).then(function(y){return y.count>0;});});
  return GridClient.readSheet(CFG.SCAN_SHEET_ID,CFG.DOC_ADMIN,range).then(function(rows){var ok=!!(rows[0]&&String(rows[0][1]||'')===writeId);if(!ok||!stable)return ok;return obsSleep(OBS_STABLE_MS).then(function(){return GridClient.readSheet(CFG.SCAN_SHEET_ID,CFG.DOC_ADMIN,range);}).then(function(r2){return !!(r2[0]&&String(r2[0][1]||'')===writeId);});});
}
WriteQueue=(function(){
  var chain=Promise.resolve();
  function enqueue(task){var p=chain.then(task,task);chain=p.catch(function(){});return p;}
  function commit(bucket,evento,key,writeId,options){
    options=options||{};var row=[key,writeId,evento.qr||'',evento.nombre||'',evento.empresa||'',evento.sitio||'',evento.resultado||'',evento.razon||'',evento.guardia_hash||'',evento.guardia_source_field||'',evento.ts||'',evento.tz||'',evento.app||''],attempt=0;
    function appendRun(){
      attempt++;
      return GridClient.appendSheet(CFG.SCAN_SHEET_ID,CFG.DOC_ADMIN,CFG.SCAN_TAB,[row]).then(function(x){var res=x.res,range=obsUpdatedRange(x.body);
        if(res.ok)return obsVerifyRange(range,writeId,true).then(function(ok){if(ok)return {ok:true,key:key,writeId:writeId,attempts:attempt};var e=new Error('append 2xx no verificable');e.ambiguous=true;throw e;});
        if(res.status===403){var e403=new Error('permission_denied');e403.status=403;throw e403;}
        if(res.status===429||res.status===502||res.status===503||res.status===504){var ea=new Error('append ambiguo '+res.status);ea.ambiguous=true;throw ea;}
        return res.text().then(function(t){var ep=new Error('append permanente '+res.status+' '+t);ep.status=res.status;ep.permanent=true;throw ep;});
      }).catch(function(err){
        if(err&&err.status===403)throw err;if(err&&err.permanent)return {ok:false,key:key,writeId:writeId,attempts:attempt,error:String(err.message||err),permanent:true};
        return obsResolveAmbiguousWrite(writeId).then(function(check){if(check.count){if(check.count>1)console.error('[Scan] write_id duplicado '+writeId+' x'+check.count);return {ok:true,key:key,writeId:writeId,recovered:true,attempts:attempt};}if(attempt<CFG.MAX_ATTEMPTS)return obsSleep(jitter(500*attempt)).then(appendRun);return {ok:false,key:key,writeId:writeId,attempts:attempt,error:String(err&&err.message||err)};});
      });
    }
    if(options.precheck)return obsResolveAmbiguousWrite(writeId).then(function(existing){if(existing.count){if(existing.count>1)console.error('[Scan] write_id duplicado '+writeId+' x'+existing.count);return {ok:true,key:key,writeId:writeId,recovered:true,attempts:0};}return appendRun();});
    return appendRun();
  }
  return {write:function(bucket,evento,key,writeId,options){return enqueue(function(){return commit(bucket,evento,key,writeId,options);});}};
})();

/* Outbox v3: an entry is marked appendStarted BEFORE the network request.
   A normal first attempt avoids a costly B:B scan. Only resumed/ambiguous
   entries perform the full idempotency lookup. Unknown QR events remain in
   IndexedDB and cannot drain until the guard classifies them explicitly. */
Outbox=(function(){
  var STORE='outbox',draining=false,retryTimer=null,permissionDeniedHandler=null,queueChangeHandler=null,classifyTimer=null;
  function store(mode){return LocalDB.open().then(function(db){return db.transaction(STORE,mode).objectStore(STORE);});}
  function put(entry){return store('readwrite').then(function(os){return new Promise(function(resolve,reject){var q=os.put(entry);q.onsuccess=function(){resolve();};q.onerror=function(){reject(q.error);};});});}
  function get(id){return store('readonly').then(function(os){return new Promise(function(resolve){var q=os.get(id);q.onsuccess=function(){resolve(q.result||null);};q.onerror=function(){resolve(null);};});});}
  function remove(id){return store('readwrite').then(function(os){return new Promise(function(resolve){var q=os['delete'](id);q.onsuccess=function(){resolve();};q.onerror=function(){resolve();};});});}
  function ordered(){return store('readonly').then(function(os){return new Promise(function(resolve){var out=[],q=os.index('createdAt').openCursor();q.onsuccess=function(e){var c=e.target.result;if(!c){resolve(out);return;}out.push(c.value);c.continue();};q.onerror=function(){resolve(out);};});});}
  function notify(){if(!queueChangeHandler)return;ordered().then(function(items){queueChangeHandler(items.length);}).catch(function(){});}
  function escHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var classDefs={
    snapshot_stale_possible:{label:'Puede ser desfase del catálogo',reason:'Posible desfase del catálogo; requiere recarga o verificación adicional.'},
    ubicacion_desconocida:{label:'Existe, pero falta ubicación',reason:'El operador reconoce la credencial, pero la ubicación/autorización no está disponible en el snapshot.'},
    no_existe_confirmado:{label:'Confirmo que no existe',reason:'El operador confirmó que la credencial no existe en el catálogo vigente.'}
  };
  function renderClassification(entry,tries){
    tries=tries||0;var verdict=ge('verdict');
    if(!verdict||!verdict.classList.contains('on')){if(tries<40)setTimeout(function(){renderClassification(entry,tries+1);},100);return;}
    window.__obsidianClassificationGate=true;var input=ge('scan-field');if(input)input.disabled=true;
    verdict.classList.remove('ok','err');verdict.classList.add('warn');ge('v-title').textContent='Clasifica el código desconocido';ge('v-why').textContent='QR: '+(entry.evento&&entry.evento.qr||'—');
    var host=ge('v-notice'),id=String(entry.id||'');host.innerHTML='<div class="notice warn"><span>El snapshot no basta para concluir. Selecciona qué observaste antes de continuar.</span></div><div style="display:grid;gap:8px;margin:12px 0">'+Object.keys(classDefs).map(function(code){return '<button type="button" class="btn btn-ghost btn-block" onclick="obsClassifyPending(\''+escHtml(id)+'\',\''+code+'\')">'+escHtml(classDefs[code].label)+'</button>';}).join('')+'</div>';
    var close=ge('v-close');close.disabled=true;close.textContent='Clasifica el caso';
  }
  function showNextClassification(){
    if(classifyTimer)return;classifyTimer=setTimeout(function(){classifyTimer=null;ordered().then(function(items){var item=items.filter(function(x){return !!x.needsClassification;})[0];if(item)renderClassification(item,0);});},0);
  }
  window.obsClassifyPending=function(id,code){
    var def=classDefs[code];if(!def)return;get(id).then(function(entry){if(!entry||!entry.needsClassification)return;entry.evento=entry.evento||{};entry.evento.resultado=code;entry.evento.razon=def.reason;entry.needsClassification=false;entry.classifiedAt=Date.now();return put(entry).then(function(){notify();kick();return ordered();});}).then(function(items){items=items||[];var next=items.filter(function(x){return !!x.needsClassification;})[0];if(next){renderClassification(next,0);return;}window.__obsidianClassificationGate=false;var input=ge('scan-field');if(input)input.disabled=false;var close=ge('v-close');if(close){close.disabled=false;close.textContent='Siguiente escaneo';}toast('Clasificación guardada en la cola local.','ok');}).catch(function(e){toast('No se pudo guardar la clasificación: '+(e&&e.message||e),'err');});
  };
  async function enqueueEvent(bucket,evento){var entry={id:'evt_'+uuid(),writeId:uuid(),bucket:bucket,evento:evento,attempts:0,createdAt:Date.now(),appendStarted:false,needsClassification:evento&&evento.resultado==='desconocido'};await put(entry);notify();if(entry.needsClassification)showNextClassification();else kick();return entry;}
  function kick(){if(draining)return;draining=true;drainLoop();}
  async function drainLoop(){var stopRetrying=false;try{while(true){var items=await ordered(),item=items.filter(function(x){return !x.needsClassification;})[0];if(!item){if(items.some(function(x){return x.needsClassification;}))showNextClassification();return;}var precheck=!!item.appendStarted;item.appendStarted=true;await put(item);var res;try{res=await WriteQueue.write(item.bucket,item.evento,item.id,item.writeId,{precheck:precheck});}catch(e){if(e.status===403){stopRetrying=true;if(permissionDeniedHandler)permissionDeniedHandler(e,item);return;}res={ok:false,error:String(e&&e.message||e)};}if(res.ok){await remove(item.id);notify();continue;}item.attempts=(item.attempts||0)+1;item.lastError=res.error||'no confirmado';await put(item);return;}}finally{draining=false;if(!stopRetrying)scheduleRetry();}}
  function scheduleRetry(){if(retryTimer)return;retryTimer=setTimeout(function(){retryTimer=null;ordered().then(function(items){if(items.some(function(x){return !x.needsClassification;}))kick();if(items.some(function(x){return x.needsClassification;}))showNextClassification();});},jitter(4000));}
  function resume(){showNextClassification();kick();}
  return {enqueue:enqueueEvent,resume:resume,onPermissionDenied:function(fn){permissionDeniedHandler=fn;},onQueueChange:function(fn){queueChangeHandler=fn;}};
})();

<script>
/* Grid: only allow approved Grid domains to open unsandboxed tabs */
(function(){
  var allowedHosts = ["figma.com", "www.figma.com", "furydocs.io", "zeroheight.com", "google.com", "docs.google.com", "meet.google.com", "grid.adminml.com", "grid-artifacts.adminml.com", "mercadolibre.atlassian.net", "mercadolibre-opsgenie.atlassian.net", "app.datadoghq.com", "grafana-service.furycloud.io", "web.furycloud.io", "nasdaq-meli.app.opsgenie.com", "meli.enterprise.slack.com"];
  var allowedSuffixes = [".adminml.com", ".atlassian.net", ".google.com", ".furycloud.io", ".melioffice.com", ".melisystems.com"];
  var allowedPathPrefixes = {"github.com": ["/melisource/"], "www.github.com": ["/melisource/"], "reclameaqui.com.br": ["/empresa/mercado-pago/"], "www.reclameaqui.com.br": ["/empresa/mercado-pago/"]};
  function normalizeUrl(rawUrl){
    try {
      return new URL(String(rawUrl || ""), window.location.href);
    } catch (_err) {
      return null;
    }
  }
  function isAllowedUrl(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed) return false;
    if(parsed.protocol === "slack:") return true;
    if(parsed.protocol !== "https:") return false;
    var h = (parsed.hostname || "").toLowerCase();
    if(!h) return false;
    if(allowedHosts.indexOf(h) !== -1) return true;
    for(var i = 0; i < allowedSuffixes.length; i++){
      var s = allowedSuffixes[i];
      if(h === s.slice(1) || (h.length > s.length && h.slice(-s.length) === s)) return true;
    }
    var pathPrefixes = allowedPathPrefixes[h];
    if(pathPrefixes){
      var p = parsed.pathname || "/";
      for(var j = 0; j < pathPrefixes.length; j++){
        if(p.slice(0, pathPrefixes[j].length) === pathPrefixes[j]) return true;
      }
    }
    return false;
  }
  function requestParentPopup(rawUrl){
    var parsed = normalizeUrl(rawUrl);
    if(!parsed || !window.parent || window.parent === window) return false;
    try {
      window.parent.postMessage({type: "grid-open-safe-popup", url: parsed.href}, window.location.origin);
      return true;
    } catch (_err) {
      return false;
    }
  }
  /* Open synchronously from the parent window, inside the click's call stack, so
     the browser keeps the transient user activation (a click in a same-origin
     child propagates activation to its ancestors). Forwarding via postMessage
     runs window.open in an async handler, which popup blockers reject.
     We deliberately open WITHOUT the "noopener" feature: with it the browser
     returns null even on success, so a genuinely blocked popup would be
     indistinguishable from a successful one. Instead we detect a real block via a
     null handle and sever the opener ourselves.
     Returns true only when a tab actually opened; false when there is no
     accessible parent, the call throws (opaque/cross-origin), or the popup was
     blocked — the caller then lets the native target="_blank" run.
     SECURITY: rawUrl is always gated by isAllowedUrl() first, and popup.opener is
     nulled to prevent reverse tabnabbing (equivalent guarantee to "noopener"). */
  function openInParent(rawUrl){
    if(!window.parent || window.parent === window) return false;
    var parsed = normalizeUrl(rawUrl);
    if(!parsed) return false;
    try {
      var popup = window.parent.open(parsed.href, "_blank");
      if(!popup) return false;
      try { popup.opener = null; } catch (_e) {}
      return true;
    } catch (_err) {
      return false;
    }
  }

  document.addEventListener("click", function(event){
    var target = event.target;
    var anchor = target && target.closest ? target.closest("a[href]") : null;
    if(!anchor) return;
    var href = anchor.getAttribute("href") || "";
    if(!href || href.charAt(0) === "#") return;
    var opensNewTab = anchor.target === "_blank" || event.ctrlKey || event.metaKey || event.button === 1;
    if(!opensNewTab) return;
    // SECURITY: only allowlisted destinations may escape the sandbox.
    if(!isAllowedUrl(href)) {
      event.preventDefault();
      event.stopPropagation();
      return;
    }
    /* Open a clean tab from the unsandboxed parent, within the click gesture.
       Suppress the native navigation ONLY when the parent open actually
       succeeded; otherwise (no parent, cross-origin, or popup blocked) let the
       native target="_blank" proceed so the allowed link still opens. We do NOT
       fall back to the async postMessage bridge here: by the time it runs the
       user activation is gone, so it cannot reopen a blocked popup — it would
       just swallow the click and leave the link dead. */
    if(openInParent(href)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, true);

  var nativeOpen = window.open;
  window.open = function(rawUrl, target, features){
    if(!isAllowedUrl(rawUrl)) return null;
    if(openInParent(rawUrl)) return null;
    if(requestParentPopup(rawUrl)) return null;
    return nativeOpen ? nativeOpen.call(window, normalizeUrl(rawUrl).href, target, features) : null;
  };
})();
</script>
<script>
/* Grid: video/audio embed diagnostics & proxy fallback */
(function(){
  var TAG='[Grid:media-diag]';
  function patchMedia(el){
    if(el._gridPatched) return;
    el._gridPatched=true;
    el.addEventListener('error',function handler(ev){
      var src=el.currentSrc||el.src||'';
      var code=el.error?el.error.code:'?';
      var msg=el.error?el.error.message:'unknown';
